    <script type="module">
const createPuzzleAudioHost = (send) => {
  const U64 = /^(?:[1-9][0-9]{0,19})$/;
  const U64_MAX = 18446744073709551615n;
  const voices = new Map();
  let context = null;
  let workletSource = null;
  let workletLoader = null;
  let workletReady = null;
  let sequence = 0n;
  let terminal = false;
  let unlocked = false;
  let commandQueue = Promise.resolve();
  let authorityGenerationId = null;
  let authorityEpoch = 0;

  const canonicalVoice = (value) => (
    typeof value === "string" && U64.test(value) && BigInt(value) <= U64_MAX
  );
  const canonicalFrame = (value) => (
    typeof value === "string"
    && /^(?:0|[1-9][0-9]{0,19})$/.test(value)
    && BigInt(value) <= U64_MAX
  );
  const finiteGain = (value) => Number.isFinite(value) && value >= 0;
  const exactKeys = (value, keys) => (
    value
    && Object.getPrototypeOf(value) === Object.prototype
    && Object.keys(value).length === keys.length
    && keys.every((key) => Object.hasOwn(value, key))
  );
  const emit = (event, generationId = authorityGenerationId) => {
    if (terminal || generationId === null) {
      return false;
    }
    if (sequence + 1n === U64_MAX) {
      terminal = true;
      unlocked = false;
      for (const voice of [...voices.keys()]) {
        discardVoice(voice);
      }
      try { void context?.close(); } catch (_error) {}
      sequence = U64_MAX;
      send({
        kind: "audio-event",
        sequence: sequence.toString(),
        event: {
          kind: "device-failure",
          error: "browser audio event sequence exhausted",
        },
      }, generationId);
      return false;
    }
    sequence += 1n;
    send({ kind: "audio-event", sequence: sequence.toString(), event }, generationId);
    return true;
  };
  const capability = (state, generationId = authorityGenerationId) => (
    emit({ kind: "capability", state }, generationId)
  );
  const result = (requestId, ok, error, generationId) => send({
    kind: "audio-result",
    requestId,
    ok,
    ...(error ? { error: String(error) } : {}),
  }, generationId);
  const discardVoice = (voice) => {
    const active = voices.get(voice);
    if (active) {
      active.explicitStop = true;
      try {
        if (active.kind === "sfx") active.node.stop();
        else active.node.port.postMessage({ version: 1, kind: "stop" });
      } catch (_error) {}
      try { active.node.disconnect(); } catch (_error) {}
      try { active.gain.disconnect(); } catch (_error) {}
      voices.delete(voice);
    }
  };
  const failVoice = (voice, expected, error) => {
    if (voices.get(voice) !== expected) return;
    discardVoice(voice);
    emit({ kind: "voice-failure", voice, error: String(error) }, expected.generationId);
  };
  const requireContext = () => {
    if (!context || !unlocked || context.state !== "running") {
      throw new Error("browser audio capability is not ready");
    }
    return context;
  };
  const loadWorklet = async (generationId, epoch) => {
    if (workletReady) return workletReady;
    let source = workletSource;
    const loader = workletLoader;
    if (typeof source !== "string" && typeof loader === "function") {
      source = await loader();
    }
    if (generationId !== authorityGenerationId || epoch !== authorityEpoch) {
      throw new Error("audio generation retired before worklet preparation completed");
    }
    if (typeof source !== "string" || source.length === 0) {
      throw new Error("music AudioWorklet source is unavailable");
    }
    const blobUrl = URL.createObjectURL(new Blob([source], {
      type: "text/javascript",
    }));
    workletReady = context.audioWorklet.addModule(blobUrl).finally(() => {
      URL.revokeObjectURL(blobUrl);
    });
    return workletReady;
  };
  const unlock = async (generationId) => {
    if (generationId !== authorityGenerationId) return;
    const epoch = authorityEpoch;
    try {
      if (!context) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (typeof AudioContext !== "function") {
          capability("unavailable", generationId);
          return;
        }
        context = new AudioContext();
        context.addEventListener("statechange", () => {
          if (context.state === "closed") capability("unavailable");
          else if (context.state === "running") capability("ready");
          else capability("suspended");
        });
      }
      await Promise.all([context.resume(), loadWorklet(generationId, epoch)]);
      if (generationId !== authorityGenerationId || epoch !== authorityEpoch) return;
      unlocked = context.state === "running";
      capability(unlocked ? "ready" : "locked", generationId);
    } catch (error) {
      if (generationId !== authorityGenerationId || epoch !== authorityEpoch) return;
      unlocked = false;
      capability(context?.state === "closed" ? "unavailable" : "locked", generationId);
      emit(
        { kind: "device-failure", error: error?.message || String(error) },
        generationId,
      );
    }
  };
  const startSfx = (command, generationId) => {
    const audio = requireContext();
    if (!(command.samples instanceof Float32Array)
      || command.samples.length === 0
      || !Number.isInteger(command.sampleRate)
      || command.sampleRate <= 0
      || command.sampleRate > 0xffffffff) {
      throw new Error("start-sfx requires typed mono samples and sampleRate");
    }
    const buffer = audio.createBuffer(1, command.samples.length, command.sampleRate);
    buffer.copyToChannel(command.samples, 0);
    const node = audio.createBufferSource();
    const gain = audio.createGain();
    gain.gain.value = command.gain;
    node.buffer = buffer;
    node.connect(gain).connect(audio.destination);
    const active = { kind: "sfx", node, gain, explicitStop: false, generationId };
    voices.set(command.voice, active);
    node.addEventListener("ended", () => {
      if (voices.get(command.voice) !== active) return;
      voices.delete(command.voice);
      try { gain.disconnect(); } catch (_error) {}
      if (!active.explicitStop) {
        emit({ kind: "voice-ended", voice: command.voice }, generationId);
      }
    }, { once: true });
    node.start();
  };
  const startMusic = async (command, generationId, epoch) => {
    const audio = requireContext();
    if (!(command.assetBytes instanceof Uint8Array) || command.assetBytes.length === 0) {
      throw new Error("start-music requires encoded worklet assetBytes");
    }
    await loadWorklet(generationId, epoch);
    if (generationId !== authorityGenerationId || epoch !== authorityEpoch) {
      throw new Error("audio generation retired before music preparation completed");
    }
    const gain = audio.createGain();
    gain.gain.value = command.gain;
    const node = new AudioWorkletNode(audio, "puzzle-music-processor-v1", {
      numberOfInputs: 0,
      numberOfOutputs: 1,
      outputChannelCount: [2],
      processorOptions: {
        version: 1,
        asset: command.assetBytes,
        startFrame: command.startFrame,
      },
    });
    const active = { kind: "music", node, gain, explicitStop: false, generationId };
    voices.set(command.voice, active);
    node.connect(gain).connect(audio.destination);
    await new Promise((resolve, reject) => {
      const timeout = window.setTimeout(() => reject(new Error("music worklet ready timeout")), 2000);
      node.port.onmessage = (event) => {
        const feedback = event.data || {};
        if (feedback.version !== 1) return;
        if (feedback.kind === "ready") {
          window.clearTimeout(timeout);
          resolve();
        } else if (feedback.kind === "error") {
          window.clearTimeout(timeout);
          reject(new Error(`${feedback.operation || "worklet"}: ${feedback.error || "failed"}`));
        }
      };
      node.onprocessorerror = () => {
        window.clearTimeout(timeout);
        reject(new Error("music AudioWorklet processor error"));
      };
    });
    node.port.onmessage = (event) => {
      const feedback = event.data || {};
      if (feedback.version === 1 && feedback.kind === "error") {
        failVoice(
          command.voice,
          active,
          `${feedback.operation || "worklet"}: ${feedback.error || "failed"}`,
        );
      }
    };
    node.onprocessorerror = () => failVoice(
      command.voice,
      active,
      "music AudioWorklet processor error",
    );
  };
  const applyCommand = async (message, generationId, epoch) => {
    const requestId = message.requestId;
    const command = message.command;
    try {
      if (generationId !== authorityGenerationId || epoch !== authorityEpoch) {
        throw new Error("audio command generation is no longer authoritative");
      }
      if (!canonicalVoice(requestId) || !command || typeof command !== "object"
        || !canonicalVoice(command.voice)) {
        throw new Error("audio command identity is invalid");
      }
      const voice = command.voice;
      const commandKeys = {
        "start-sfx": ["kind", "voice", "asset", "gain", "sampleRate", "samples"],
        "start-music": ["kind", "voice", "asset", "startFrame", "gain", "assetBytes"],
        "pause-voice": ["kind", "voice", "atFrame"],
        "resume-voice": ["kind", "voice", "atFrame"],
        "set-voice-gain": ["kind", "voice", "gain"],
        "stop-voice": ["kind", "voice"],
      }[command.kind];
      if (!commandKeys || !exactKeys(command, commandKeys)) {
        throw new Error("audio command is not a closed schema variant");
      }
      if (!Number.isInteger(command.asset) || command.asset < 0 || command.asset > 0xffff) {
        if (command.kind === "start-sfx" || command.kind === "start-music") {
          throw new Error("audio asset identity is invalid");
        }
      }
      if (command.kind === "start-sfx" || command.kind === "start-music") {
        if (voices.has(voice) || !finiteGain(command.gain)) {
          throw new Error("audio start command has duplicate voice or invalid gain");
        }
        if (command.kind === "start-sfx") startSfx(command, generationId);
        else {
          if (!canonicalFrame(command.startFrame)) throw new Error("music startFrame is invalid");
          await startMusic(command, generationId, epoch);
        }
      } else {
        const active = voices.get(voice);
        if (active && active.generationId !== generationId) {
          throw new Error("audio voice belongs to another runtime generation");
        }
        if (!active && command.kind === "stop-voice") {
          result(requestId, true, null, generationId);
          return;
        }
        if (!active) throw new Error("audio command references an inactive voice");
        if (command.kind === "set-voice-gain") {
          if (!finiteGain(command.gain)) throw new Error("voice gain is invalid");
          active.gain.gain.value = command.gain;
        } else if (command.kind === "pause-voice" || command.kind === "resume-voice") {
          if (active.kind !== "music" || !canonicalFrame(command.atFrame)) {
            throw new Error("pause/resume requires a music voice and exact frame");
          }
          active.node.port.postMessage({
            version: 1,
            kind: command.kind === "pause-voice" ? "pause" : "resume",
            atFrame: command.atFrame,
          });
        } else if (command.kind === "stop-voice") {
          active.explicitStop = true;
          voices.delete(voice);
          if (active.kind === "music") {
            active.node.port.postMessage({ version: 1, kind: "stop" });
          } else {
            active.node.stop();
          }
          active.node.disconnect();
          active.gain.disconnect();
        } else {
          throw new Error("audio command kind is invalid");
        }
      }
      result(requestId, true, null, generationId);
    } catch (error) {
      if (canonicalVoice(command?.voice)
        && voices.get(command.voice)?.generationId === generationId
        && (command?.kind === "start-sfx" || command?.kind === "start-music")) {
        discardVoice(command.voice);
      }
      if (canonicalVoice(requestId)) {
        result(requestId, false, error?.message || String(error), generationId);
      } else {
        emit(
          { kind: "device-failure", error: error?.message || String(error) },
          generationId,
        );
      }
    }
  };
  const enqueueCommand = (message, generationId) => {
    if (generationId !== authorityGenerationId) return false;
    const epoch = authorityEpoch;
    commandQueue = commandQueue.then(() => applyCommand(message, generationId, epoch)).catch((error) => {
      const requestId = message?.requestId;
      if (canonicalVoice(requestId)) {
        result(requestId, false, error?.message || String(error), generationId);
      } else {
        emit(
          { kind: "device-failure", error: error?.message || String(error) },
          generationId,
        );
      }
    });
    return true;
  };

  return Object.freeze({
    activateGeneration(generationId, source) {
      authorityEpoch += 1;
      for (const voice of [...voices.keys()]) {
        discardVoice(voice);
      }
      commandQueue = Promise.resolve();
      authorityGenerationId = generationId;
      workletSource = typeof source === "string" ? source : null;
      workletLoader = typeof source === "function" ? source : null;
    },
    announceCapability(generationId) {
      if (generationId !== authorityGenerationId) return;
      capability(
        (typeof workletSource === "string" && workletSource.length > 0)
          || typeof workletLoader === "function"
          ? "locked"
          : "unavailable",
        generationId,
      );
    },
    retireGeneration(generationId) {
      if (generationId !== authorityGenerationId) return false;
      authorityEpoch += 1;
      for (const voice of [...voices.keys()]) {
        discardVoice(voice);
      }
      commandQueue = Promise.resolve();
      authorityGenerationId = null;
      return true;
    },
    unlock,
    enqueueCommand,
    async setVisible(visible, generationId) {
      if (generationId !== authorityGenerationId) return;
      if (!context || context.state === "closed") return;
      try {
        if (!visible) await context.suspend();
        else if (unlocked) await context.resume();
      } catch (error) {
        emit(
          { kind: "device-failure", error: error?.message || String(error) },
          generationId,
        );
      }
    },
  });
};

const launchPuzzleRuntimeGeneration = ({
  broker,
  runtimeGenerationId,
  runtimeModuleSource,
  rendererModuleSource,
  wasmBytes,
  runtimeDescriptor,
  launchProfile,
  workerArguments,
  progressIdentityKey,
  audioWorkletLoader,
}) => {
  if (
    !broker
    || typeof runtimeGenerationId !== "string"
    || !/^[1-9][0-9]*$/.test(runtimeGenerationId)
    || typeof runtimeModuleSource !== "string"
    || !runtimeModuleSource
    || !(wasmBytes instanceof ArrayBuffer)
    || !runtimeDescriptor
    || typeof runtimeDescriptor.startExport !== "string"
    || !runtimeDescriptor.startExport
    || typeof runtimeDescriptor.requiresRendererModule !== "boolean"
    || !Array.isArray(runtimeDescriptor.workerArgumentNames)
    || !workerArguments
    || Object.getPrototypeOf(workerArguments) !== Object.prototype
  ) {
    throw new Error("Runtime generation composition is invalid.");
  }
  if (
    (runtimeDescriptor.requiresRendererModule && (
      typeof rendererModuleSource !== "string" || !rendererModuleSource
    ))
    || (!runtimeDescriptor.requiresRendererModule && rendererModuleSource !== null)
  ) {
    throw new Error("Runtime generation renderer capability is invalid.");
  }
  const argumentNames = runtimeDescriptor.workerArgumentNames;
  if (
    new Set(argumentNames).size !== argumentNames.length
    || argumentNames.some((name) => typeof name !== "string" || !name)
    || argumentNames.some((name) => !Object.hasOwn(workerArguments, name))
  ) {
    throw new Error("Runtime generation Worker arguments do not match its manifest.");
  }
  broker.loadRuntimeGeneration({
    runtimeGenerationId,
    runtimeModuleSource,
    rendererModuleSource,
    wasmBytes,
    startExport: runtimeDescriptor.startExport,
    startArguments: argumentNames.map((name) => workerArguments[name]),
    launchProfile,
    progressIdentityKey,
    audioWorkletLoader,
  });
};

const createPuzzleFrameBroker = async ({

  onMessage,

  iframe.title = accessibleLabel;

    "width:100%",
    "height:100%",
    "border:0",
    "background:transparent",
  ].join(";");
  iframe.srcdoc = "\u003c!doctype html\u003e\n\u003chtml\u003e\n  \u003chead\u003e\n    \u003cmeta charset=\"utf-8\"\u003e\n    \u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval' blob:; worker-src blob:; child-src blob:; connect-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; object-src 'none'; base-uri 'none'\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n    \u003cstyle\u003ehtml,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color-scheme:light dark}body{outline:none}\u003c/style\u003e\n  \u003c/head\u003e\n  \u003cbody tabindex=\"0\"\u003e\n    \u003cscript\u003e(() =\u003e {\n  \"use strict\";\n\n  const bootstrapNonce = window.name;\n  window.name = \"\";\n  const trustedRoot = document.body.attachShadow({ mode: \"closed\" });\n  const retainedCanvases = [0, 1].map(() =\u003e {\n    const canvas = document.createElement(\"canvas\");\n    canvas.setAttribute(\"role\", \"img\");\n    canvas.setAttribute(\"aria-label\", \"Puzzle game\");\n    canvas.tabIndex = -1;\n    canvas.style.cssText = \"display:block;width:100%;height:100%;touch-action:none\";\n    return canvas;\n  });\n  const fatalSurface = document.createElement(\"pre\");\n  fatalSurface.setAttribute(\"role\", \"alert\");\n  fatalSurface.style.cssText = [\n    \"box-sizing:border-box\",\n    \"width:100%\",\n    \"height:100%\",\n    \"margin:0\",\n    \"padding:2rem\",\n    \"overflow:auto\",\n    \"white-space:pre-wrap\",\n    \"color:#fff\",\n    \"background:#280b0b\",\n    \"font:16px/1.5 system-ui,sans-serif\",\n  ].join(\";\");\n\n  let hostPort = null;\n  let worker = null;\n  let publicCanvas = null;\n  let publicPresentation = null;\n  let runtimeModuleUrl = null;\n  let rendererModuleUrl = null;\n  let workerUrl = null;\n  let runtimeGenerationId = \"\";\n  let bootstrapped = false;\n  let launchProfile = null;\n  const memoryProgressStorage = new Map();\n  let pendingPresentation = null;\n  let viewportGeneration = 0n;\n  let currentViewportMetrics = null;\n  let viewportMonitorActive = false;\n  let pendingRuntimeStart = null;\n\n  const U64_MAX = 18446744073709551615n;\n  const canonicalU64 = (value, positive) =\u003e {\n    if (\n      typeof value !== \"string\"\n      || value.length === 0\n      || value.length \u003e 20\n      || !(positive ? /^[1-9][0-9]*$/.test(value) : /^(0|[1-9][0-9]*)$/.test(value))\n    ) {\n      return false;\n    }\n    return BigInt(value) \u003c= U64_MAX;\n  };\n  const validExtent = (width, height) =\u003e (\n    Number.isSafeInteger(width)\n    \u0026\u0026 Number.isSafeInteger(height)\n    \u0026\u0026 width \u003e 0\n    \u0026\u0026 height \u003e 0\n  );\n  const validPresentationMetadata = (value) =\u003e (\n    value\n    \u0026\u0026 typeof value === \"object\"\n    \u0026\u0026 canonicalU64(value.request, true)\n    \u0026\u0026 canonicalU64(value.revision, false)\n    \u0026\u0026 canonicalU64(value.sample, true)\n    \u0026\u0026 canonicalU64(value.metricsGeneration, true)\n    \u0026\u0026 validExtent(value.width, value.height)\n  );\n  const validPresentation = (value) =\u003e (\n    validPresentationMetadata(value)\n    \u0026\u0026 currentViewportMetrics\n    \u0026\u0026 value.metricsGeneration === currentViewportMetrics.generation\n    \u0026\u0026 value.width === currentViewportMetrics.width\n    \u0026\u0026 value.height === currentViewportMetrics.height\n  );\n  const editorObservationCapabilities = new Map([\n    [\"PuzzleStudioPreviewRuntimeReady\", \"state\"],\n    [\"PuzzleStudioPreviewState\", \"state\"],\n    [\"PuzzleStudioPreviewCommit\", \"commit\"],\n    [\"PuzzleStudioPreviewDebugTrace\", \"trace\"],\n    [\"PuzzleStudioEditorAuthoringFrame\", \"authoring\"],\n    [\"PuzzleStudioEditorAuthoringAccepted\", \"authoring\"],\n    [\"PuzzleStudioEditorAuthoringSubmitted\", \"authoring\"],\n    [\"PuzzleStudioEditorAuthoringRender
