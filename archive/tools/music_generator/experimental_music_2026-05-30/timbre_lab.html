<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instrument Timbre Lab</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0c0f0c;
        color: #eef4e8;
      }

      body {
        margin: 0;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 20px 0;
        display: grid;
        justify-items: center;
      }

      main {
        width: min(820px, calc(100vw - 24px));
        display: grid;
        gap: 12px;
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: end;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0;
      }

      a {
        color: #a7d983;
        font-size: 13px;
        text-decoration: none;
      }

      .panel {
        border: 1px solid #293329;
        border-radius: 8px;
        background: #151a14;
        overflow: hidden;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
      }

      .controls {
        padding: 14px;
        display: grid;
        grid-template-columns: auto auto 1fr;
        gap: 12px;
        align-items: center;
      }

      button {
        min-width: 40px;
        height: 40px;
        padding: 0 14px;
        display: inline-grid;
        place-items: center;
        border: 0;
        border-radius: 999px;
        background: #a7d983;
        color: #0c0f0c;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button.secondary {
        background: #293329;
        color: #eef4e8;
      }

      .field {
        display: grid;
        gap: 7px;
        min-width: 0;
      }

      .field-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
      }

      .label {
        color: #9ba994;
        font-size: 12px;
      }

      .value {
        font-size: 13px;
        font-weight: 700;
      }

      input[type="range"] {
        width: 100%;
        accent-color: #a7d983;
      }

      .group {
        display: grid;
        border-top: 1px solid #293329;
      }

      .group:first-child {
        border-top: 0;
      }

      .group-title {
        padding: 12px 14px 8px;
        color: #d7e8cf;
        font-size: 13px;
        font-weight: 700;
      }

      .rows {
        display: grid;
      }

      .row {
        display: grid;
        grid-template-columns: 132px 1fr 70px 70px 84px 88px;
        gap: 10px;
        align-items: center;
        padding: 9px 14px;
        border-top: 1px solid #293329;
      }

      .row.active {
        background: #20291e;
      }

      .name {
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .meta {
        color: #9ba994;
        font-size: 12px;
      }

      .meter {
        height: 8px;
        border-radius: 999px;
        background: #293329;
        overflow: hidden;
      }

      .meter span {
        display: block;
        width: calc(var(--value, 0) * 100%);
        height: 100%;
        background: #a7d983;
      }

      .row button {
        justify-self: end;
        min-width: 64px;
        height: 32px;
        padding: 0 12px;
      }

      @media (max-width: 680px) {
        .controls {
          grid-template-columns: 1fr 1fr;
        }

        .field {
          grid-column: 1 / -1;
        }

        .row {
          grid-template-columns: 1fr auto;
          gap: 6px 10px;
        }

        .meta,
        .meter {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <script>
      if (location.protocol === "file:") {
        location.replace("http://localhost:8875/timbre_lab.html");
      }
    </script>
    <main>
      <header>
        <h1>Instrument Timbre Lab</h1>
        <nav>
          <a href="./timbre_distribution_lab.html">Distribution Lab</a>
          <a href="./transient_distribution_lab.html">Transient Lab</a>
          <a href="./timbre_axis_lab.html">Axis Lab</a>
          <a href="./function_music_lab.html">Sound &gt; Music</a>
          <a href="./music_lab.html">Music Lab</a>
        </nav>
      </header>

      <section class="panel">
        <div class="controls">
          <button id="play-all" type="button">Play All</button>
          <button id="stop" class="secondary" type="button">Stop</button>
          <div class="field">
            <div class="field-head">
              <span class="label">Volume</span>
              <span id="volume-value" class="value">50%</span>
            </div>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Audition volume">
          </div>
        </div>
      </section>

      <section id="list" class="panel"></section>
    </main>

    <script type="module">
      import { auditionInstruments, buildInstrumentAuditionScore, createPlayer } from "./seeded_music_lab.mjs?v=lab-1";

      const list = document.querySelector("#list");
      const playAllButton = document.querySelector("#play-all");
      const stopButton = document.querySelector("#stop");
      const volumeInput = document.querySelector("#volume");
      const volumeValue = document.querySelector("#volume-value");
      let audioContext = null;
      let player = null;
      let stopTimer = null;
      let activeId = null;

      const instruments = auditionInstruments();
      renderList();
      updateVolumeLabel();

      function renderList() {
        const groups = new Map();
        for (const item of instruments) {
          if (!groups.has(item.groupLabel)) {
            groups.set(item.groupLabel, []);
          }
          groups.get(item.groupLabel).push(item);
        }
        list.innerHTML = "";
        for (const [groupLabel, items] of groups) {
          const group = document.createElement("div");
          group.className = "group";
          group.innerHTML = `<div class="group-title">${groupLabel}</div>`;
          const rows = document.createElement("div");
          rows.className = "rows";
          for (const item of items) {
            const row = document.createElement("div");
            row.className = "row";
            row.dataset.id = item.id;
            row.innerHTML = `
              <div class="name">${item.instrument}</div>
              <div class="meta">${item.timbre.family ? `${item.timbre.family} / ${item.timbre.engine}` : `${item.track} / ${item.noteLabel}`}</div>
              <div class="meta">${item.velocity.toFixed(2)}</div>
              <div class="meta">gain ${(item.timbre.gain ?? 1).toFixed(2)}</div>
              <div class="meter" style="--value:${item.velocity.toFixed(3)}"><span></span></div>
              <button type="button" data-play="${item.id}">Play</button>
            `;
            rows.append(row);
          }
          group.append(rows);
          list.append(group);
        }
      }

      async function ensureAudio() {
        if (!audioContext) {
          audioContext = new AudioContext();
        }
        if (audioContext.state === "suspended") {
          await audioContext.resume();
        }
      }

      async function playScore(score, id = null, autoStopMs = null) {
        await ensureAudio();
        stopCurrent();
        player = createPlayer(audioContext, score);
        activeId = id;
        paintActive();
        player.start(0);
        if (autoStopMs !== null) {
          stopTimer = setTimeout(stopCurrent, autoStopMs);
        }
      }

      function stopCurrent() {
        if (stopTimer !== null) {
          clearTimeout(stopTimer);
          stopTimer = null;
        }
        if (player) {
          player.stop();
          player = null;
        }
        activeId = null;
        paintActive();
      }

      function paintActive() {
        for (const row of list.querySelectorAll(".row")) {
          row.classList.toggle("active", row.dataset.id === activeId);
        }
      }

      function scoreFor(ids) {
        return buildInstrumentAuditionScore({
          instruments: ids,
          tone: 0.5,
          bpm: 110,
          volume: Number(volumeInput.value),
        });
      }

      function updateVolumeLabel() {
        volumeValue.textContent = `${Math.round(Number(volumeInput.value) * 100)}%`;
      }

      playAllButton.addEventListener("click", () => {
        playScore(scoreFor(null), null, null);
      });

      stopButton.addEventListener("click", stopCurrent);

      volumeInput.addEventListener("input", () => {
        updateVolumeLabel();
      });

      list.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-play]");
        if (!button) {
          return;
        }
        const id = button.dataset.play;
        playScore(scoreFor([id]), id, 1200);
      });
    </script>
  </body>
</html>
