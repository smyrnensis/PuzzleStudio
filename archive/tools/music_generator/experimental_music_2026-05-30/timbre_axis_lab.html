<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timbre Axis Lab</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0c0f0c;
        color: #eef4e8;
      }

      body {
        margin: 0;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 20px 0;
        display: grid;
        justify-items: center;
      }

      main {
        width: min(920px, calc(100vw - 24px));
        display: grid;
        gap: 12px;
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: end;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0;
      }

      a {
        color: #a7d983;
        font-size: 13px;
        text-decoration: none;
      }

      .panel {
        border: 1px solid #293329;
        border-radius: 8px;
        background: #151a14;
        overflow: hidden;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
      }

      .controls {
        padding: 14px;
        display: grid;
        grid-template-columns: auto auto auto minmax(180px, 1fr);
        gap: 12px;
        align-items: center;
      }

      button {
        min-width: 40px;
        height: 40px;
        padding: 0 14px;
        display: inline-grid;
        place-items: center;
        border: 0;
        border-radius: 999px;
        background: #a7d983;
        color: #0c0f0c;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button.secondary {
        background: #293329;
        color: #eef4e8;
      }

      .field {
        display: grid;
        gap: 7px;
        min-width: 0;
      }

      .field-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
      }

      .label {
        color: #9ba994;
        font-size: 12px;
      }

      .value {
        font-size: 13px;
        font-weight: 700;
      }

      input[type="range"] {
        width: 100%;
        accent-color: #a7d983;
      }

      .axis {
        display: grid;
        border-top: 1px solid #293329;
      }

      .axis:first-child {
        border-top: 0;
      }

      .axis-head {
        padding: 12px 14px 8px;
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 12px;
        align-items: baseline;
      }

      .axis-title {
        color: #d7e8cf;
        font-size: 13px;
        font-weight: 700;
      }

      .controlled {
        color: #9ba994;
        font-size: 12px;
      }

      .rows {
        display: grid;
      }

      .row {
        display: grid;
        grid-template-columns: 150px 1fr 170px 74px;
        gap: 10px;
        align-items: center;
        padding: 9px 14px;
        border-top: 1px solid #293329;
      }

      .row.active {
        background: #20291e;
      }

      .name {
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .meta {
        color: #9ba994;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .row button {
        justify-self: end;
        min-width: 64px;
        height: 32px;
        padding: 0 12px;
      }

      .measurement {
        display: grid;
        gap: 0;
      }

      .measurement-head {
        display: grid;
        grid-template-columns: 150px repeat(6, minmax(84px, 1fr));
        gap: 8px;
        padding: 10px 14px;
        border-top: 1px solid #293329;
        color: #9ba994;
        font-size: 11px;
      }

      .measurement-row {
        display: grid;
        grid-template-columns: 150px repeat(6, minmax(84px, 1fr));
        gap: 8px;
        padding: 8px 14px;
        border-top: 1px solid #293329;
        font-size: 12px;
        align-items: baseline;
      }

      .measurement-row strong {
        font-size: 12px;
      }

      .distance {
        padding: 10px 14px 14px;
        border-top: 1px solid #293329;
        color: #9ba994;
        font-size: 12px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      @media (max-width: 760px) {
        .controls {
          grid-template-columns: 1fr 1fr 1fr;
        }

        .field {
          grid-column: 1 / -1;
        }

        .axis-head,
        .row {
          grid-template-columns: 1fr;
          gap: 6px;
        }

        .row button {
          justify-self: start;
        }

        .measurement-head,
        .measurement-row {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <script>
      if (location.protocol === "file:") {
        location.replace("http://localhost:8875/timbre_axis_lab.html");
      }
    </script>
    <main>
      <header>
        <h1>Timbre Axis Lab</h1>
        <nav>
          <a href="./timbre_distribution_lab.html">Distribution Lab</a>
          <a href="./transient_distribution_lab.html">Transient Lab</a>
          <a href="./timbre_lab.html">Timbre Lab</a>
          <a href="./function_music_lab.html">Sound &gt; Music</a>
          <a href="./music_lab.html">Music Lab</a>
        </nav>
      </header>

      <section class="panel">
        <div class="controls">
          <button id="play-all" type="button">Play Axis</button>
          <button id="measure" class="secondary" type="button">Measure</button>
          <button id="stop" class="secondary" type="button">Stop</button>
          <div class="field">
            <div class="field-head">
              <span class="label">Volume</span>
              <span id="volume-value" class="value">50%</span>
            </div>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Audition volume">
          </div>
        </div>
      </section>

      <section id="list" class="panel"></section>
    </main>

    <script type="module">
      import { AXIS_EXPERIMENTS, measureAxis, playAxisVariant } from "./timbre_axis_lab.mjs?v=axis-2";

      const list = document.querySelector("#list");
      const playAllButton = document.querySelector("#play-all");
      const measureButton = document.querySelector("#measure");
      const stopButton = document.querySelector("#stop");
      const volumeInput = document.querySelector("#volume");
      const volumeValue = document.querySelector("#volume-value");
      let audioContext = null;
      let activePlayback = null;
      let activeId = null;
      let playAllTimer = null;

      renderList();
      updateVolumeLabel();

      function renderList() {
        list.innerHTML = "";
        for (const axis of AXIS_EXPERIMENTS) {
          const section = document.createElement("div");
          section.className = "axis";
          section.dataset.axis = axis.id;
          section.innerHTML = `
            <div class="axis-head">
              <div class="axis-title">${axis.label}</div>
              <div class="controlled">held constant: ${axis.controlled.join(", ")}</div>
            </div>
          `;
          const rows = document.createElement("div");
          rows.className = "rows";
          for (const variant of axis.variants) {
            const id = `${axis.id}:${variant.id}`;
            const row = document.createElement("div");
            row.className = "row";
            row.dataset.id = id;
            row.innerHTML = `
              <div class="name">${variant.label}</div>
              <div class="meta">${variant.operations.join(" / ")}</div>
              <div class="meta">${mechanismFor(variant.signal)}</div>
              <button type="button" data-axis="${axis.id}" data-variant="${variant.id}">Play</button>
            `;
            rows.append(row);
          }
          section.append(rows);
          const measurement = document.createElement("div");
          measurement.className = "measurement";
          measurement.dataset.measurement = axis.id;
          section.append(measurement);
          list.append(section);
        }
      }

      function mechanismFor(signal) {
        if (signal.pluck) {
          return "buffer-pluck";
        }
        if (signal.noise?.role === "carrier") {
          return "noise-carrier";
        }
        if (signal.body?.type === "comb") {
          return "comb-body";
        }
        if (signal.body?.type === "bandpass") {
          return "formant-body";
        }
        if (signal.partials?.some((partial) => partial[2])) {
          return "additive-separate-decay";
        }
        return "additive";
      }

      async function ensureAudio() {
        if (!audioContext) {
          audioContext = new AudioContext();
        }
        if (audioContext.state === "suspended") {
          await audioContext.resume();
        }
      }

      async function playOne(axisId, variantId) {
        await ensureAudio();
        stopCurrent();
        activeId = `${axisId}:${variantId}`;
        paintActive();
        activePlayback = playAxisVariant(audioContext, axisId, variantId, {
          gain: Number(volumeInput.value) * 0.28,
        });
      }

      async function playAxis(axis) {
        await ensureAudio();
        stopCurrent();
        let index = 0;
        const playNext = () => {
          if (index >= axis.variants.length) {
            stopCurrent();
            return;
          }
          const variant = axis.variants[index];
          activeId = `${axis.id}:${variant.id}`;
          paintActive();
          activePlayback = playAxisVariant(audioContext, axis.id, variant.id, {
            gain: Number(volumeInput.value) * 0.28,
          });
          index += 1;
          playAllTimer = setTimeout(playNext, 1150);
        };
        playNext();
      }

      async function measureAllAxes() {
        measureButton.disabled = true;
        measureButton.textContent = "Measuring";
        try {
          for (const axis of AXIS_EXPERIMENTS) {
            await measureOneAxis(axis.id);
          }
        } finally {
          measureButton.disabled = false;
          measureButton.textContent = "Measure";
        }
      }

      async function measureOneAxis(axisId) {
        const result = await measureAxis(axisId);
        window.__axisMeasurements ??= {};
        window.__axisMeasurements[axisId] = result;
        const target = list.querySelector(`[data-measurement="${axisId}"]`);
        target.innerHTML = "";
        const head = document.createElement("div");
        head.className = "measurement-head";
        head.innerHTML = `
          <div>variant</div>
          <div>centroid</div>
          <div>flatness</div>
          <div>harmonic</div>
          <div>inharmonic</div>
          <div>pitch</div>
          <div>attack</div>
        `;
        target.append(head);
        for (const item of result.measurements) {
          const row = document.createElement("div");
          row.className = "measurement-row";
          const features = item.features;
          row.innerHTML = `
            <strong>${item.label}</strong>
            <span>${Math.round(features.spectralCentroid)} Hz</span>
            <span>${features.spectralFlatness.toFixed(3)}</span>
            <span>${features.harmonicEnergyRatio.toFixed(3)}</span>
            <span>${features.inharmonicEnergyRatio.toFixed(3)}</span>
            <span>${features.pitchSalience.toFixed(3)}</span>
            <span>${features.attackTime.toFixed(3)}s</span>
          `;
          target.append(row);
        }
        const distance = document.createElement("div");
        distance.className = "distance";
        distance.textContent = `unweighted normalized distances: ${distanceSummary(result)}`;
        target.append(distance);
      }

      function distanceSummary(result) {
        const labels = result.measurements.map((item) => item.label);
        const parts = [];
        for (let row = 0; row < labels.length; row += 1) {
          for (let col = row + 1; col < labels.length; col += 1) {
            parts.push(`${labels[row]} - ${labels[col]} ${result.distances[row][col].toFixed(3)}`);
          }
        }
        return parts.join(" / ");
      }

      function stopCurrent() {
        if (playAllTimer !== null) {
          clearTimeout(playAllTimer);
          playAllTimer = null;
        }
        if (activePlayback) {
          activePlayback.stop();
          activePlayback = null;
        }
        activeId = null;
        paintActive();
      }

      function paintActive() {
        for (const row of list.querySelectorAll(".row")) {
          row.classList.toggle("active", row.dataset.id === activeId);
        }
      }

      function updateVolumeLabel() {
        volumeValue.textContent = `${Math.round(Number(volumeInput.value) * 100)}%`;
      }

      playAllButton.addEventListener("click", () => {
        playAxis(AXIS_EXPERIMENTS[0]);
      });

      measureButton.addEventListener("click", measureAllAxes);
      stopButton.addEventListener("click", stopCurrent);
      volumeInput.addEventListener("input", updateVolumeLabel);

      list.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-axis]");
        if (!button) {
          return;
        }
        playOne(button.dataset.axis, button.dataset.variant);
      });

      list.addEventListener("dblclick", (event) => {
        const axisNode = event.target.closest(".axis");
        if (!axisNode) {
          return;
        }
        const axis = AXIS_EXPERIMENTS.find((item) => item.id === axisNode.dataset.axis);
        if (axis) {
          playAxis(axis);
        }
      });
    </script>
  </body>
</html>
