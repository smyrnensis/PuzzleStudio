<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PuzzleStudio HTML Export</title>
    <style>
:root {
  color-scheme: light;
  --bg: #f5f3ef;
  --ink: #1f2428;
  --muted: #66727c;
  --panel: #ffffff;
  --line: #d7dde2;
  --floor-a: #edf1f2;
  --floor-b: #e4e9eb;
  --accent: #2f7ebc;
  --button-bg: #263039;
  --button-bg-hover: #313d47;
  --button-bg-active: #1d252c;
  --ok: #257a59;
  --warn: #b65b22;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0;
}

button {
  min-height: 40px;
  padding: 0 18px;
  border: 0;
  border-radius: 6px;
  background: linear-gradient(180deg, var(--button-bg-hover), var(--button-bg));
  color: #fff;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.12),
    0 7px 16px rgba(31, 36, 40, 0.18);
  transition:
    background-color 120ms ease,
    box-shadow 120ms ease,
    transform 120ms ease;
}

button:hover {
  background: linear-gradient(180deg, #3a4651, var(--button-bg-hover));
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.16),
    0 10px 20px rgba(31, 36, 40, 0.2);
  transform: translateY(-1px);
}

button:active {
  background: var(--button-bg-active);
  box-shadow:
    inset 0 2px 5px rgba(0, 0, 0, 0.22),
    0 3px 9px rgba(31, 36, 40, 0.14);
  transform: translateY(0);
}

button:focus-visible {
  outline: 3px solid rgba(47, 126, 188, 0.38);
  outline-offset: 3px;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
  transform: none;
}

.shell {
  position: relative;
  width: min(1100px, calc(100vw - 32px));
  min-height: 100vh;
  margin: 0 auto;
  padding: 24px 0;
  display: grid;
  grid-template-rows: minmax(0, 1fr);
}

.shell:focus {
  outline: none;
}

.shell.has-overlay .play-surface {
  filter: saturate(0.72);
}

.play-surface {
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 16px;
  touch-action: none;
}

.screen-view {
  width: min(100%, 720px);
  display: grid;
  place-items: center;
  gap: 14px;
}

.overlay {
  position: absolute;
  inset: 24px 0;
  z-index: 10;
  display: none;
  place-items: center;
  padding: 24px;
  background: rgba(245, 243, 239, 0.72);
  backdrop-filter: blur(2px);
}

.shell.has-overlay .overlay {
  display: grid;
}

.overlay-panel {
  width: min(440px, 100%);
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.94);
  box-shadow: 0 22px 54px rgba(31, 36, 40, 0.18);
  text-align: center;
}

.overlay-menu {
  width: min(320px, 100%);
  margin: 18px auto 22px;
  padding: 0;
  display: grid;
  gap: 8px;
  list-style: none;
  text-align: left;
}

.view-row,
.view-column,
.view-panel {
  display: grid;
  gap: 8px;
}

.screen-view > .view-row,
.screen-view > .view-column,
.screen-view > .view-panel {
  width: min(100%, calc(var(--cols, 9) * 60px));
}

.view-row {
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  align-items: end;
}

.view-panel {
  padding: 10px 0 0;
  border-top: 1px solid var(--line);
}

.view-list {
  margin: 0;
  padding: 0;
  display: grid;
  gap: 8px;
  list-style: none;
}

.overlay-menu .view-text {
  margin: 0;
  color: var(--ink);
  font-weight: 700;
  text-align: center;
}

.screen-view .view-text {
  margin: 0;
  color: var(--ink);
  font-weight: 700;
}

.view-title,
.view-subtitle {
  margin: 0;
  font-weight: 700;
}

.view-title {
  color: var(--ink);
}

.view-subtitle {
  color: var(--muted);
  text-align: right;
  font-size: 14px;
}

.overlay-menu:empty {
  display: none;
}

.overlay-menu li {
  min-height: 40px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border: 0;
  border-radius: 6px;
  background: rgba(38, 48, 57, 0.08);
  color: var(--ink);
  font-weight: 700;
}

.overlay-menu li.is-selected {
  background: rgba(47, 126, 188, 0.13);
  box-shadow: inset 4px 0 0 var(--accent);
}

.overlay-menu .menu-meta {
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
}

.overlay-menu button {
  width: 100%;
}

.overlay-panel button {
  min-width: 160px;
  min-height: 46px;
  padding: 0 22px;
}

@media (max-width: 720px) {
  .shell {
    width: min(100vw - 20px, 560px);
    padding: 10px 0;
  }

  .overlay {
    inset: 10px 0;
    padding: 16px;
  }

  .overlay-panel {
    padding: 22px;
  }
}

</style>
    <style>
.board {
  --cols: 1;
  --cell-background: linear-gradient(135deg, var(--floor-a, #edf1f2), var(--floor-b, #e4e9eb));
  display: grid;
  grid-template-columns: repeat(var(--cols), minmax(28px, 56px));
  gap: 0;
  align-content: center;
  justify-content: center;
  width: min(100%, calc(var(--cols) * 56px));
}

.cell {
  aspect-ratio: 1;
  position: relative;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: var(--cell-background);
}

.sprite {
  position: absolute;
  display: block;
  pointer-events: none;
}

.visual-sprite {
  inset: 0;
  display: grid;
  grid-template-columns: repeat(var(--sprite-cols, 5), 1fr);
  grid-template-rows: repeat(var(--sprite-rows, 5), 1fr);
}

.visual-pixel {
  display: block;
}

.sprite.unknown {
  inset: 24%;
  display: grid;
  place-items: center;
  border: 2px dashed #77848d;
  border-radius: 6px;
}

.sprite.unknown::after {
  content: "?";
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-weight: 800;
}

@media (max-width: 720px) {
  .board {
    grid-template-columns: repeat(var(--cols), minmax(24px, 1fr));
    width: 100%;
    gap: 0;
  }
}

</style>
    <style>
:root {
  --accent: #4a4;
}

body.theme-ps {
  background: #222;
}

.theme-ps .play-surface {
  background: #222;
}

.board.is-ps {
  grid-template-columns: repeat(var(--cols), 45px);
  width: calc(var(--cols) * 45px);
  gap: 0;
  background: #444;
  image-rendering: pixelated;
  box-shadow: 0 0 0 1px #222;
}

.board.is-ps .cell {
  background: #cfcfcf;
}

.board.is-ps .cell::before {
  content: "";
  position: absolute;
  z-index: 0;
  inset: 40%;
  background: #c5c5c5;
}

.board.is-ps .visual-solid {
  inset: -1px;
}

@media (min-width: 720px) {
  .board.is-ps {
    grid-template-columns: repeat(var(--cols), 55px);
    width: calc(var(--cols) * 55px);
  }
}

</style>
  </head>
  <body>
    <main id="shell" class="shell" tabindex="0">
      <section class="play-surface" aria-label="Puzzle board">
        <div id="screenView" class="screen-view">
          <div id="board" class="board"></div>
        </div>
      </section>

      <section id="overlay" class="overlay" aria-live="polite">
        <div class="overlay-panel">
          <div id="overlayMenu" class="overlay-menu"></div>
        </div>
      </section>
    </main>

<script>
class PuzzleRenderer {
  constructor(root, options = {}) {
    this.root = root;
    this.options = options;
  }

  render(scene) {
    window.__PuzzleCurrentScene = scene;
    const frame = this.resolveFrame(scene);
    this.root.style.setProperty("--cols", frame.width);
    this.root.dataset.frameX = String(frame.x);
    this.root.dataset.frameY = String(frame.y);
    this.root.dataset.frameWidth = String(frame.width);
    this.root.dataset.frameHeight = String(frame.height);
    const visuals = this.visuals();
    const hasVisuals = this.hasVisualConfig(visuals) || this.usesVisualSprites(scene, visuals);
    if (visuals.boardClass) {
      this.root.classList.toggle(visuals.boardClass, hasVisuals);
    }
    if (visuals.themeClass && this.options.applyTheme !== false) {
      document.body.classList.toggle(visuals.themeClass, hasVisuals);
    }
    this.root.replaceChildren();

    for (const cellData of this.frameCells(scene, frame)) {
      this.root.append(this.renderCell(cellData, scene));
    }
  }

  resolveFrame(scene) {
    const screen = scene.screen || scene.view || {};
    const frameSize = screen.frameSize || { kind: "full" };
    const behavior = screen.frameBehavior || "switch_frame";
    const focus = this.focusCell(scene, screen.frameFocus || "Player");
    const previous = this.frame;

    if (frameSize.kind === "full" || frameSize.kind === "region") {
      const region = this.regionForCell(scene, focus) || scene.regions?.[0];
      const frame = region
        ? { x: region.x, y: region.y, width: region.width, height: region.height }
        : { x: 0, y: 0, width: scene.width, height: scene.height };
      this.frame = frame;
      return frame;
    }

    const width = Math.max(1, Number(frameSize.width || scene.width || 1));
    const height = Math.max(1, Number(frameSize.height || scene.height || 1));
    if (
      behavior === "switch_frame"
      && previous
      && previous.width === width
      && previous.height === height
      && this.frameContains(previous, focus)
    ) {
      return previous;
    }

    const frame = this.centeredFrame(scene, focus, width, height);
    this.frame = frame;
    return frame;
  }

  focusCell(scene, objectName) {
    for (const cell of scene.cells || []) {
      if (cell.layers?.some((layer) => layer.object === objectName || layer.sprite === objectName)) {
        return cell;
      }
    }
    return null;
  }

  regionForCell(scene, cell) {
    if (!cell) {
      return null;
    }
    return (scene.regions || []).find((region) =>
      cell.x >= region.x
      && cell.y >= region.y
      && cell.x < region.x + region.width
      && cell.y < region.y + region.height
    ) || null;
  }

  frameContains(frame, cell) {
    return Boolean(
      cell
      && cell.x >= frame.x
      && cell.y >= frame.y
      && cell.x < frame.x + frame.width
      && cell.y < frame.y + frame.height
    );
  }

  centeredFrame(scene, focus, width, height) {
    const centerX = focus ? focus.x - Math.floor(width / 2) : 0;
    const centerY = focus ? focus.y - Math.floor(height / 2) : 0;
    const maxX = Math.max(0, Number(scene.width || 0) - width);
    const maxY = Math.max(0, Number(scene.height || 0) - height);
    return {
      x: Math.max(0, Math.min(maxX, centerX)),
      y: Math.max(0, Math.min(maxY, centerY)),
      width: Math.min(width, Number(scene.width || width)),
      height: Math.min(height, Number(scene.height || height)),
    };
  }

  frameCells(scene, frame) {
    return (scene.cells || []).filter((cell) =>
      cell.x >= frame.x
      && cell.y >= frame.y
      && cell.x < frame.x + frame.width
      && cell.y < frame.y + frame.height
    );
  }

  renderCell(cellData, scene) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.x = cellData.x;
    cell.dataset.y = cellData.y;
    cell.setAttribute("aria-label", this.cellLabel(cellData));

    const layers = this.sortedLayers(cellData.layers);
    for (const layer of layers) {
      cell.classList.add(`has-${layer.sprite}`);
    }

    for (const layer of layers) {
      cell.append(this.renderSprite(layer));
    }

    return cell;
  }

  renderSprite(layer) {
    const visualSprite = this.resolveVisualSprite(layer);
    if (visualSprite) {
      return this.renderVisualSprite(layer, visualSprite.definition, visualSprite.key);
    }

    const sprite = document.createElement("span");
    sprite.className = `sprite ${layer.sprite}`;
    sprite.dataset.object = layer.object;
    sprite.dataset.layer = layer.layer;
    sprite.style.zIndex = String(layer.layer + 1);
    sprite.setAttribute("aria-hidden", "true");
    return sprite;
  }

  renderVisualSprite(layer, definition, visualKey) {
    const sprite = document.createElement("span");
    sprite.className = `sprite visual-sprite ${definition.className || ""} ${layer.sprite} visual-${this.classNameFor(visualKey)}`;
    sprite.dataset.object = layer.object;
    sprite.dataset.layer = layer.layer;
    sprite.style.zIndex = String(definition.zIndex ?? layer.layer + 1);
    sprite.style.setProperty("--sprite-cols", String(definition.pattern?.[0]?.length || 1));
    sprite.style.setProperty("--sprite-rows", String(definition.pattern?.length || 1));
    sprite.setAttribute("aria-hidden", "true");

    const solidColor = this.solidPatternColor(definition);
    if (solidColor) {
      sprite.classList.add("visual-solid");
      sprite.style.backgroundColor = solidColor;
      return sprite;
    }

    for (const row of definition.pattern) {
      for (const token of row) {
        const pixel = document.createElement("span");
        pixel.className = "visual-pixel";
        const color = definition.colors[token] || "transparent";
        pixel.style.backgroundColor = color;
        sprite.append(pixel);
      }
    }

    return sprite;
  }

  solidPatternColor(definition) {
    const firstToken = definition.pattern?.[0]?.[0];
    if (!firstToken) {
      return null;
    }
    const isSolid = definition.pattern.every((row) =>
      [...row].every((token) => token === firstToken),
    );
    if (!isSolid) {
      return null;
    }
    const color = definition.colors[firstToken];
    return color && color !== "transparent" ? color : null;
  }

  sortedLayers(layers) {
    return [...layers].sort((a, b) => a.layer - b.layer);
  }

  usesVisualSprites(scene, visuals) {
    return scene.cells.some((cell) =>
      cell.layers.some((layer) => Boolean(this.resolveVisualSprite(layer, visuals))),
    );
  }

  hasVisualConfig(visuals) {
    return Boolean(
      visuals.boardClass
        || visuals.themeClass
        || Object.keys(visuals.sprites || {}).length,
    );
  }

  resolveVisualSprite(layer, visuals = this.visuals()) {
    const sprites = visuals.sprites || {};
    for (const key of this.visualKeys(layer, visuals.aliases || {})) {
      if (sprites[key]) {
        return { key, definition: sprites[key] };
      }
    }
    return null;
  }

  visualKeys(layer, aliases) {
    const keys = [];
    const add = (key) => {
      if (key && !keys.includes(key)) {
        keys.push(key);
      }
    };
    const addWithAlias = (key) => {
      add(key);
      const alias = aliases[key];
      if (Array.isArray(alias)) {
        alias.forEach(add);
      } else {
        add(alias);
      }
    };

    addWithAlias(layer.object);
    addWithAlias(layer.sprite);

    return keys;
  }

  classNameFor(value) {
    return String(value || "")
      .replace(/[^a-zA-Z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .toLowerCase() || "unknown";
  }

  visuals() {
    return window.GameVisuals || {};
  }

  cellLabel(cellData) {
    if (cellData.layers.length === 0) {
