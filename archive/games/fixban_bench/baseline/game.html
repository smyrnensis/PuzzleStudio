          const result = this.applyStep(child, input, current);
          if (result.cancelled) {
            return { fired: true, state: current, cancelled: true };
          }
          current = result.state;
          passFired = passFired || result.fired;
        }
        if (!passFired) {
          break;
        }
        firedAny = true;
        const key = this.stateKey(current);
        if (seen.has(key)) {
          throw new Error("until-stable block cycle");
        }
        seen.add(key);
      }
      return { fired: firedAny, state: current };
    }

    conditionAccepts(condition, state) {
      const patterns = condition?.patterns || [];
      if (condition?.kind === "any_matches") {
        return patterns.some((entry) => this.hasPatternMatch(state, entry.pattern || entry));
      }
      if (condition?.kind === "no_matches") {
        return patterns.every((entry) => !this.hasPatternMatch(state, entry.pattern || entry));
      }
      return false;
    }

    applyRuleStep(rule, input, state) {
      if (!this.guardsAccept(rule, input, state)) {
        return { fired: false, state };
      }
      if (rule.application === "once") {
        const placement = this.findFirstMatch(state, rule);
        if (!placement) {
          return { fired: false, state };
        }
        if (this.ruleCancels(rule)) {
          return { fired: true, state, cancelled: true };
        }
        return { fired: true, state: this.applyWrites(state, rule, placement) };
      }
      if (rule.application === "once_all") {
        const placements = this.findAllMatches(state, rule);
        if (!placements.length) {
          return { fired: false, state };
        }
        if (this.ruleCancels(rule)) {
          return { fired: true, state, cancelled: true };
        }
        return { fired: true, state: this.applyWritesOnceAll(state, rule, placements) };
      }
      if (rule.application === "once_per_level") {
        const firedRules = state.levelFiredRules || [];
        if (firedRules.includes(rule.id)) {
          return { fired: false, state };
        }
        const placement = this.findFirstMatch(state, rule);
        if (!placement) {
          return { fired: false, state };
        }
        if (this.ruleCancels(rule)) {
          return { fired: true, state, cancelled: true };
        }
        const next = this.applyWrites(state, rule, placement);
        next.levelFiredRules = [...(next.levelFiredRules || []), rule.id].sort((a, b) => a - b);
        return { fired: true, state: next };
      }

      let current = state;
      let fired = false;
      const seen = new Set([this.stateKey(current)]);
      while (true) {
        const placement = this.findFirstMatch(current, rule);
        if (!placement) {
          break;
        }
        if (this.ruleCancels(rule)) {
          return { fired: true, state: current, cancelled: true };
        }
        current = this.applyWrites(current, rule, placement);
        fired = true;
        const key = this.stateKey(current);
        if (seen.has(key)) {
          throw new Error(`until-stable cycle in rule ${rule.id}`);
        }
        seen.add(key);
      }
      return { fired, state: current };
    }

    ruleCancels(rule) {
      return (rule.effects || []).some((effect) => effect.kind === "cancel");
    }

    guardsAccept(rule, input, state) {
      return rule.guards.every((guard) => {
        if (guard.kind === "input_is") {
          return input === guard.input;
        }
        if (guard.kind === "global_compare") {
          return this.compare(state.globals[guard.global] ?? 0, guard.op, guard.value);
        }
        if (guard.kind === "query_compare") {
          return this.compare(this.evalQuery(state, guard.query), guard.op, guard.value);
        }
        if (guard.kind === "query_nonzero") {
          return this.evalQuery(state, guard.query) !== 0;
        }
        if (guard.kind === "query_value_compare") {
          return this.compare(this.evalQueryKind(state, guard.queryKind), guard.op, guard.value);
        }
        if (guard.kind === "query_value_nonzero") {
          return this.evalQueryKind(state, guard.queryKind) !== 0;
        }
        return true;
      });
    }

    findFirstMatch(state, rule) {
      if (!rule.pattern.components.length) {
        return null;
      }
      for (const [x, y] of this.componentCandidateOrigins(state, rule.pattern.components[0])) {
        const first = this.componentPlacementAt(state, rule.pattern.components[0], x, y);
        if (!first) {
          continue;
        }
        const components = [first];
        if (this.completeComponentPlacements(state, rule, 1, components)) {
          return { components };
        }
      }
      return null;
    }

    findAllMatches(state, rule) {
      if (!rule.pattern.components.length) {
        return [];
      }
      const matches = [];
      for (const [x, y] of this.componentCandidateOrigins(state, rule.pattern.components[0])) {
        const first = this.componentPlacementAt(state, rule.pattern.components[0], x, y);
        if (!first) {
          continue;
        }
        const components = [first];
        this.collectComponentPlacements(state, rule, 1, components, matches);
      }
      return matches;
    }

    completeComponentPlacements(state, rule, componentIndex, components) {
      if (componentIndex === rule.pattern.components.length) {
        return true;
      }
      const component = rule.pattern.components[componentIndex];
      for (const [x, y] of this.componentCandidateOrigins(state, component)) {
        const placement = this.componentPlacementAt(state, component, x, y);
        if (!placement) {
          continue;
        }
        components.push(placement);
        if (this.completeComponentPlacements(state, rule, componentIndex + 1, components)) {
          return true;
        }
        components.pop();
      }
      return false;
    }

    collectComponentPlacements(state, rule, componentIndex, components, matches) {
      if (componentIndex === rule.pattern.components.length) {
        matches.push({ components: components.map((component) => ({
          originX: component.originX,
          originY: component.originY,
          gaps: [...(component.gaps || [])],
        })) });
        return;
      }
      const component = rule.pattern.components[componentIndex];
      for (const [x, y] of this.componentCandidateOrigins(state, component)) {
        const placement = this.componentPlacementAt(state, component, x, y);
        if (!placement) {
          continue;
        }
        components.push(placement);
        this.collectComponentPlacements(state, rule, componentIndex + 1, components, matches);
        components.pop();
      }
    }

    componentCandidateOrigins(state, component) {
      const anchor = this.componentAnchorCell(component);
      if (!anchor) {
        return this.allOrigins(state);
      }
      const [dx, dy] = this.resolveOffset(anchor.cell.offset, []);
      const layer = this.objectLayers.get(anchor.object);
      if (layer === undefined || layer >= state.layerCount) {
        return this.allOrigins(state);
      }
      const origins = [];
      for (let y = 0; y < state.height; y += 1) {
        for (let x = 0; x < state.width; x += 1) {
          if (state.slots[this.slotIndex(state, x, y, layer)] === anchor.object) {
            origins.push([x - dx, y - dy]);
          }
        }
      }
      return origins;
    }

    componentAnchorCell(component) {
      if (component.gapCount !== 0) {
        return null;
      }
      for (const cell of component.cells) {
        if (cell.offset.kind === "fixed" && cell.requireObjects.length) {
          return { cell, object: cell.requireObjects[0] };
        }
      }
      return null;
    }

    allOrigins(state) {
      const origins = [];
      for (let y = 0; y < state.height; y += 1) {
        for (let x = 0; x < state.width; x += 1) {
          origins.push([x, y]);
        }
      }
      return origins;
    }

    componentPlacementAt(state, component, originX, originY) {
      if (component.gapCount === 0) {
        const gaps = [];
        return this.componentMatchesWithGaps(state, component, originX, originY, gaps)
          ? { originX, originY, gaps }
          : null;
      }
      const maxGap = Math.max(state.width, state.height);
      for (let totalGap = 0; totalGap <= maxGap * component.gapCount; totalGap += 1) {
        const gaps = [];
        if (this.findGapAssignment(state, component, originX, originY, maxGap, totalGap, gaps)) {
          return { originX, originY, gaps };
        }
      }
      return null;
    }

    findGapAssignment(state, component, originX, originY, maxGap, remainingTotal, gaps) {
      if (gaps.length === component.gapCount) {
        return remainingTotal === 0
          && this.componentMatchesWithGaps(state, component, originX, originY, gaps);
      }
      for (let gap = 0; gap <= Math.min(maxGap, remainingTotal); gap += 1) {
        gaps.push(gap);
        if (this.findGapAssignment(state, component, originX, originY, maxGap, remainingTotal - gap, gaps)) {
          return true;
        }
        gaps.pop();
      }
      return false;
    }

    componentMatchesWithGaps(state, component, originX, originY, gaps) {
      return component.cells.every((cell) => this.matchCell(state, originX, originY, gaps, cell));
    }

    matchCell(state, originX, originY, gaps, cell) {
      const [dx, dy] = this.resolveOffset(cell.offset, gaps);
      const x = originX + dx;
      const y = originY + dy;
      if (x < 0 || y < 0 || x >= state.width || y >= state.height) {
        return false;
      }
      return cell.requireObjects.every((object) => this.hasObject(state, x, y, object))
        && cell.forbidObjects.every((object) => !this.hasObject(state, x, y, object))
        && (cell.requireScratch || []).every((attr) => this.hasScratchPattern(state, x, y, attr))
        && (cell.forbidScratch || []).every((attr) => !this.hasScratchPattern(state, x, y, attr));
    }

    applyWrites(state, rule, placement) {
      const next = this.cloneState(state);
      this.applyMoveWrites(next, rule.writes || [], placement);
      for (const write of rule.writes) {
        if (write.kind === "add") {
          const [x, y] = this.writePosition(placement, write.component, write.offset);
          this.setObject(next, x, y, write.object);
        } else if (write.kind === "remove") {
          const [x, y] = this.writePosition(placement, write.component, write.offset);
          this.removeObject(next, x, y, write.object);
        } else if (write.kind === "move") {
          continue;
        } else if (write.kind === "replace") {
          const [x, y] = this.writePosition(placement, write.component, write.offset);
          this.removeObject(next, x, y, write.remove);
          this.setObject(next, x, y, write.add);
        } else if (write.kind === "set_scratch") {
          const [x, y] = this.writePosition(placement, write.component, write.offset);
          this.setScratch(next, x, y, write.object, write.scratch, Object.hasOwn(write, "value") ? write.value : null);
        } else if (write.kind === "remove_scratch") {
          const [x, y] = this.writePosition(placement, write.component, write.offset);
          this.removeScratch(
            next,
            x,
            y,
            write.object,
            write.scratch,
            Object.hasOwn(write, "value") ? write.value : null,
            write.match,
          );
        }
      }
      for (const effect of rule.effects) {
        if (effect.kind === "update_global") {
          next.globals[effect.global] = this.applyGlobalUpdate(next.globals[effect.global] ?? 0, effect.op, effect.value);
        }
      }
      return next;
    }

    applyWritesOnceAll(state, rule, placements) {
      const next = this.cloneState(state);
      const objectProposals = new Map();
      const deferredWrites = [];
      const deferredEffects = [];

      for (const placement of placements) {
        this.applyWrites(state, rule, placement);
        for (const write of rule.writes) {
          if (write.kind === "add") {
            const [x, y] = this.writePosition(placement, write.component, write.offset);
            const layer = this.objectLayers.get(write.object);
            objectProposals.set(`${x},${y},${layer}`, { x, y, layer, object: write.object });
          } else if (write.kind === "remove") {
            const [x, y] = this.writePosition(placement, write.component, write.offset);
            const layer = this.objectLayers.get(write.object);
            objectProposals.set(`${x},${y},${layer}`, { x, y, layer, object: 0 });
          } else if (write.kind === "move") {
            const [fromX, fromY] = this.writePosition(placement, write.component, write.fromOffset);
            const [toX, toY] = this.writePosition(placement, write.component, write.toOffset);
            const layer = this.objectLayers.get(write.object);
            objectProposals.set(`${fromX},${fromY},${layer}`, { x: fromX, y: fromY, layer, object: 0 });
            objectProposals.set(`${toX},${toY},${layer}`, { x: toX, y: toY, layer, object: write.object });
          } else if (write.kind === "replace") {
            const [x, y] = this.writePosition(placement, write.component, write.offset);
            const removeLayer = this.objectLayers.get(write.remove);
            const addLayer = this.objectLayers.get(write.add);
            objectProposals.set(`${x},${y},${removeLayer}`, { x, y, layer: removeLayer, object: 0 });
            objectProposals.set(`${x},${y},${addLayer}`, { x, y, layer: addLayer, object: write.add });
          } else if (write.kind === "set_scratch" || write.kind === "remove_scratch") {
            const [x, y] = this.writePosition(placement, write.component, write.offset);
            deferredWrites.push({ write, x, y });
          }
        }
        deferredEffects.push(...(rule.effects || []));
      }

      for (const proposal of objectProposals.values()) {
        const index = this.slotIndex(next, proposal.x, proposal.y, proposal.layer);
        if (next.slots[index] !== proposal.object) {
          next.slots[index] = proposal.object;
          if (next.scratch?.[index]?.length) {
            next.scratch[index] = [];
          }
        }
      }
      for (const { write, x, y } of deferredWrites) {
        if (write.kind === "set_scratch") {
          this.setScratch(next, x, y, write.object, write.scratch, Object.hasOwn(write, "value") ? write.value : null);
        } else {
          this.removeScratch(
            next,
            x,
            y,
            write.object,
            write.scratch,
            Object.hasOwn(write, "value") ? write.value : null,
            write.match,
          );
        }
      }
      for (const effect of deferredEffects) {
        if (effect.kind === "update_global") {
          next.globals[effect.global] = this.applyGlobalUpdate(next.globals[effect.global] ?? 0, effect.op, effect.value);
        }
      }
      return next;
    }

    applyMoveWrites(state, writes, placement) {
      const moves = [];
      const sources = new Set();
      const destinations = new Set();

      for (const write of writes) {
        if (write.kind !== "move") {
          continue;
        }
        const layer = this.objectLayers.get(write.object);
        if (layer === undefined) {
          throw new Error(`unknown object in move: ${write.object}`);
        }
        const [fromX, fromY] = this.writePosition(placement, write.component, write.fromOffset);
        const [toX, toY] = this.writePosition(placement, write.component, write.toOffset);
        const fromIndex = this.slotIndex(state, fromX, fromY, layer);
        if (state.slots[fromIndex] !== write.object) {
          throw new Error(`expected object ${write.object} at ${fromX},${fromY}`);
        }
        const destinationKey = `${toX},${toY},${layer}`;
        if (destinations.has(destinationKey)) {
          throw new Error(`move destination already occupied: ${toX},${toY}`);
        }
        sources.add(`${fromX},${fromY},${layer}`);
        destinations.add(destinationKey);
        moves.push({ fromX, fromY, toX, toY, layer, object: write.object });
      }

      for (const move of moves) {
        const toIndex = this.slotIndex(state, move.toX, move.toY, move.layer);
        const existing = state.slots[toIndex];
        if (existing && !sources.has(`${move.toX},${move.toY},${move.layer}`)) {
          throw new Error(`move destination occupied: ${move.toX},${move.toY}`);
        }
      }

      const moved = moves.map((move) => {
        const fromIndex = this.slotIndex(state, move.fromX, move.fromY, move.layer);
        const scratch = state.scratch?.[fromIndex]?.length
          ? state.scratch[fromIndex].map((entry) => ({ ...entry }))
          : [];
        state.slots[fromIndex] = 0;
        if (state.scratch?.[fromIndex]?.length) {
          state.scratch[fromIndex] = [];
        }
        return { ...move, scratch };
      });
      for (const move of moved) {
        const toIndex = this.slotIndex(state, move.toX, move.toY, move.layer);
        state.slots[toIndex] = move.object;
        if (move.scratch.length) {
          state.scratch = state.scratch || [];
          state.scratch[toIndex] = move.scratch;
        } else if (state.scratch?.[toIndex]?.length) {
          state.scratch[toIndex] = [];
        }
      }
    }

    writePosition(placement, componentIndex, offset) {
      const component = placement.components[componentIndex];
      const [dx, dy] = this.resolveOffset(offset, component.gaps);
      return [component.originX + dx, component.originY + dy];
    }

    resolveOffset(offset, gaps) {
      if (offset.kind === "fixed") {
        return [offset.dx, offset.dy];
      }
      let dx = offset.baseDx;
      let dy = offset.baseDy;
      for (const term of offset.gapTerms) {
        const gap = gaps[term.gapIndex];
        dx += term.dx * gap;
        dy += term.dy * gap;
      }
      return [dx, dy];
    }

    goalScore(state) {
      return this.data.goal?.expr ? this.goalExprScore(state, this.data.goal.expr) : 0;
    }

    goalExprScore(state, expr) {
      if (!expr) {
        return 0;
      }
      if (expr.kind === "all") {
        return (expr.exprs || []).reduce((sum, child) => sum + this.goalExprScore(state, child), 0);
      }
      if (expr.kind === "any") {
        const scores = (expr.exprs || []).map((child) => this.goalExprScore(state, child));
        return scores.length ? Math.min(...scores) : 0;
      }
      if (expr.kind === "clause") {
        const current = this.evalGoalValue(state, expr.value);
        if (this.compare(current, expr.op, expr.expected)) {
          return 0;
        }
        return this.goalClauseScore(state, expr.value, current, expr.expected);
      }
      return 0;
    }

    goalClauseScore(state, value, current, expected) {
      if (value?.kind === "query") {
        return this.queryKindScore(state, this.queriesById.get(value.query), current, expected);
      }
      if (value?.kind === "query_value") {
        return this.queryKindScore(state, value.queryKind, current, expected);
      }
      return Math.abs(current - expected);
    }

    queryKindScore(state, kind, current, expected) {
      if (kind?.kind === "count_matches" && expected === 0) {
        return (kind.patterns || []).reduce((sum, entry) => sum + this.patternDistanceScore(state, entry.pattern || entry), 0);
      }
      if (kind?.kind === "exists_matches" && expected !== 0) {
        const scores = (kind.patterns || []).map((entry) => this.patternDistanceScore(state, entry.pattern || entry));
        return scores.length ? Math.min(...scores) : 1;
      }
      return Math.abs(current - expected);
    }

    patternDistanceScore(state, pattern) {
      const component = pattern?.components?.[0];
      if (!component || pattern.components.length !== 1 || component.cells.length !== 1) {
        return this.countPatternMatches(state, pattern);
      }
      const cell = component.cells[0];
      if (!cell.requireObjects?.length || !cell.forbidObjects?.length) {
        return this.countPatternMatches(state, pattern);
      }

      const targets = this.objectPositions(state, cell.forbidObjects);
      const fallback = state.width + state.height;
      let score = 0;
      for (let y = 0; y < state.height; y += 1) {
        for (let x = 0; x < state.width; x += 1) {
          if (!this.hasAllObjects(state, x, y, cell.requireObjects)) {
            continue;
          }
          if (this.hasAllObjects(state, x, y, cell.forbidObjects)) {
            continue;
          }
          const distance = targets.reduce((best, [tx, ty]) => {
            const found = Math.abs(x - tx) + Math.abs(y - ty);
            return Math.min(best, found);
          }, fallback);
          score += Math.max(1, distance);
        }
      }
      return score;
    }

    objectPositions(state, objects) {
      const positions = [];
      for (let y = 0; y < state.height; y += 1) {
        for (let x = 0; x < state.width; x += 1) {
          if (this.hasAllObjects(state, x, y, objects)) {
            positions.push([x, y]);
          }
        }
      }
      return positions;
    }

    hasAllObjects(state, x, y, objects) {
      return (objects || []).every((object) => this.hasObject(state, x, y, object));
    }

    evalQuery(state, queryId) {
      return this.evalQueryKind(state, this.queriesById.get(queryId));
    }

    evalQueryKind(state, kind) {
      if (!kind) {
        return 0;
      }
      if (kind.kind === "count_objects") {
        return kind.objects.reduce((sum, object) => sum + this.objectCount(state, object), 0);
      }
      if (kind.kind === "exists_objects") {
        return kind.objects.some((object) => this.objectCount(state, object) > 0) ? 1 : 0;
      }
      const patterns = kind.patterns || [];
      if (kind.kind === "count_matches") {
        return patterns.reduce((sum, entry) => sum + this.countPatternMatches(state, entry.pattern || entry), 0);
      }
      if (kind.kind === "exists_matches") {
        return patterns.some((entry) => this.hasPatternMatch(state, entry.pattern || entry)) ? 1 : 0;
      }
      return 0;
    }

    hasPatternMatch(state, pattern) {
      const rule = {
        id: 0,
        guards: [],
        application: "once",
        pattern,
        writes: [],
        effects: [],
      };
      for (const [x, y] of this.componentCandidateOrigins(state, pattern.components[0])) {
        const first = this.componentPlacementAt(state, pattern.components[0], x, y);
        if (!first) {
          continue;
        }
        const components = [first];
        if (this.completeComponentPlacements(state, rule, 1, components)) {
          return true;
        }
      }
      return false;
    }

    countPatternMatches(state, pattern) {
      const rule = {
        id: 0,
        guards: [],
        application: "once",
        pattern,
        writes: [],
        effects: [],
      };
      let count = 0;
      for (const [x, y] of this.componentCandidateOrigins(state, pattern.components[0])) {
        const first = this.componentPlacementAt(state, pattern.components[0], x, y);
        if (!first) {
          continue;
        }
        const components = [first];
        if (this.completeComponentPlacements(state, rule, 1, components)) {
          count += 1;
        }
      }
      return count;
    }

    applyGlobalUpdate(current, op, value) {
      if (op === "set") return value;
      if (op === "add") return current + value;
      if (op === "subtract") return current - value;
      if (op === "multiply") return current * value;
      if (op === "divide") return Math.trunc(current / value);
      if (op === "remainder") return current % value;
      return current;
    }

    compare(left, op, right) {
      if (op === "eq") return left === right;
      if (op === "not_eq") return left !== right;
      if (op === "greater") return left > right;
      if (op === "greater_eq") return left >= right;
      if (op === "less") return left < right;
      if (op === "less_eq") return left <= right;
      return false;
    }

    isGoalComplete(state) {
      return this.data.goal ? this.evalGoalExpr(state, this.data.goal.expr) : false;
    }

    isLoseComplete(state) {
      return this.data.lose ? this.evalGoalExpr(state, this.data.lose.expr) : false;
    }

    isConditionTrue(name, state) {
      const condition = this.data.conditions?.[this.conditionName(name)];
      return condition ? this.evalGoalExpr(state, condition.expr) : false;
    }

    evalGoalExpr(state, expr) {
      if (expr.kind === "all") {
        return expr.exprs.every((child) => this.evalGoalExpr(state, child));
      }
      if (expr.kind === "any") {
        return expr.exprs.some((child) => this.evalGoalExpr(state, child));
      }
      return this.compare(this.evalGoalValue(state, expr.value), expr.op, expr.expected);
    }

    evalGoalValue(state, value) {
      if (value.kind === "global") {
        return state.globals[value.global] ?? 0;
      }
      if (value.kind === "query") {
        return this.evalQuery(state, value.query);
      }
      if (value.kind === "query_value") {
        return this.evalQueryKind(state, value.queryKind);
      }
      return 0;
    }

    applyScreenTransition(action) {
      const screen = this.currentScreenDef();
      if (!screen) {
        return false;
      }
      const [actionName, actionPayload] = this.splitActionValue(action);
      for (const transition of screen.transitions || []) {
        if (!transition.pattern || transition.pattern.name !== actionName) {
          continue;
        }
        const bindings = {};
        if (transition.pattern.payload && actionPayload !== undefined) {
          bindings[transition.pattern.payload] = actionPayload;
        } else if (transition.pattern.payload || actionPayload !== undefined) {
          continue;
        }
        this.applyScreenEffect(transition.effect, bindings);
        this.applyConditionTransitions();
        return true;
      }
      return false;
    }

    applyConditionTransitions() {
      const screen = this.currentScreenDef();
      const transition = (screen?.transitions || []).find((candidate) =>
        candidate.condition && this.isScreenConditionTrue(candidate.condition),
      );
      if (transition) {
        this.applyLevelClearHook();
        this.applyScreenEffect(transition.effect, {});
      }
    }

    applyLevelClearHook() {
      const program = this.engine.levelClearProgram || [];
      const displayProgram = this.engine.displayLevelClearProgram || [];
      if ((!program.length && !displayProgram.length) || !this.isGoalComplete(this.state)) {
        return;
      }
      if (program.length) {
        this.state = this.transitionProgram(program, this.state, 0);
      }
      if (displayProgram.length) {
        this.state = this.transitionProgram(displayProgram, this.state, 0);
      }
      this.syncCurrentLevelPuzzles();
    }

    isScreenConditionTrue(condition) {
      return String(condition || "")
        .split(" and ")
        .every((part) => this.isScreenConditionAtomTrue(part.trim()));
    }

    isScreenConditionAtomTrue(condition) {
      if (condition === "level.last") {
        return !this.hasNextStage();
      }
      if (condition === "level.has_next") {
        return this.hasNextStage();
      }
      return this.isConditionTrue(condition, this.state);
    }

    applyScreenEffect(effect, bindings) {
      if (!effect) {
        return;
      }
      if (effect.kind === "action") {
        this.applyActionName(effect.name);
      } else if (effect.kind === "goto") {
        this.applyScreenParams(effect.scene || effect.screen, effect.params || [], bindings);
        this.gotoScreen(effect.scene || effect.screen);
      } else if (effect.kind === "enter") {
        this.applyScreenParams(effect.scene || effect.screen, effect.params || [], bindings);
        this.enterScreen(effect.scene || effect.screen);
      } else if (effect.kind === "back") {
        this.backOrInitial();
      } else if (effect.kind === "create") {
        this.createScreen(effect.scene || effect.screen);
      } else if (effect.kind === "reset") {
        this.resetScreenState(effect.scene || effect.screen);
      } else if (effect.kind === "delete") {
        this.deleteScreen(effect.scene || effect.screen);
      } else if (effect.kind === "show") {
        this.showScreen(effect.scene || effect.screen);
      } else if (effect.kind === "hide") {
        this.hideScreen(effect.scene || effect.screen);
      } else if (effect.kind === "toggle") {
        this.toggleScreen(effect.scene || effect.screen);
      } else if (effect.kind === "focus") {
        this.focusScreen(effect.scene || effect.screen);
      } else if (effect.kind === "puzzle_next_level") {
        this.advanceStage();
      } else if (effect.kind === "apply") {
        const firstArg = this.evalEffectString(effect.args?.[0], bindings);
        if (this.inputIdsByName.has(firstArg)) {
          this.applyInputName(firstArg);
        }
      }
    }

    applyScreenParams(screenName, params, bindings) {
      let levelChanged = false;
      for (const param of params) {
        const value = this.evalEffectString(param.value, bindings);
        if (value === undefined) {
          continue;
        }
        if (param.name === "level") {
          const index = this.stageIndexFromValue(value);
          if (index !== undefined) {
            this.stageIndex = index;
            this.selectedStageIndex = index;
            this.state = this.cloneState(this.currentStage().initialState);
            this.undoStack = [];
            this.redoStack = [];
            levelChanged = true;
          }
          continue;
        }
        this.createScreen(screenName);
        this.screenStates.get(screenName).values[param.name] = value;
      }
      if (levelChanged) {
        this.syncCurrentLevelPuzzles();
      }
    }

    evalEffectString(expr, bindings) {
      if (!expr) {
        return undefined;
      }
      if (expr.kind === "bool" || expr.kind === "int") {
        return String(expr.value);
      }
      if (expr.kind === "text") {
        return expr.value || "";
      }
      if (expr.kind === "path") {
        const parts = String(expr.path || "").split(".").filter(Boolean);
        if (parts.length === 1) {
          return bindings[parts[0]] ?? (parts[0] === "level" ? String(this.stageIndex) : parts[0]);
        }
        return parts.join(".");
      }
      if (expr.kind === "call" && expr.name === "next" && expr.args?.length === 1) {
        const level = this.evalEffectString(expr.args[0], bindings);
        const index = this.stageIndexFromValue(level);
        return index === undefined ? undefined : String(Math.min(index + 1, this.data.stages.length - 1));
      }
      return undefined;
    }

    restartStage() {
      this.replaceStateIfChanged(this.cloneState(this.currentStage().initialState));
      this.startScreen(this.initialScreenName());
      this.syncCurrentLevelPuzzles();
    }

    materializeLevelStart(state) {
      let next = this.cloneState(state);
      const levelStartProgram = this.engine.levelStartProgram || [];
      if (levelStartProgram.length) {
        next = this.transitionProgram(levelStartProgram, next, 0);
      }
      const displayLevelStartProgram = this.engine.displayLevelStartProgram || [];
      if (displayLevelStartProgram.length) {
        next = this.transitionProgram(displayLevelStartProgram, next, 0);
      }
      return next;
    }

    setCurrentState(state, options = {}) {
      this.state = options.materializeLevelStart
        ? this.materializeLevelStart(state)
        : this.cloneState(state);
      this.undoStack = [];
      this.redoStack = [];
      this.syncCurrentLevelPuzzles();
    }

    advanceStage() {
      if (!this.hasNextStage()) {
        return;
      }
      this.stageIndex += 1;
      this.state = this.cloneState(this.currentStage().initialState);
      this.undoStack = [];
      this.redoStack = [];
      this.startScreen(this.initialScreenName());
      this.syncCurrentLevelPuzzles();
      this.selectedStageIndex = this.stageIndex;
    }

    startStage(stageIndex) {
      if (stageIndex < 0 || stageIndex >= this.data.stages.length) {
        return;
      }
      this.stageIndex = stageIndex;
      this.selectedStageIndex = stageIndex;
      this.state = this.cloneState(this.currentStage().initialState);
      this.undoStack = [];
      this.redoStack = [];
      this.startScreen(this.initialScreenName());
      this.syncCurrentLevelPuzzles();
    }

    undo() {
      const previous = this.undoStack.pop();
      if (!previous) {
        return;
      }
      this.redoStack.push(this.cloneState(this.state));
      this.state = previous;
      this.syncCurrentLevelPuzzles();
    }

    redo() {
      const next = this.redoStack.pop();
      if (!next) {
        return;
      }
      this.undoStack.push(this.cloneState(this.state));
      this.state = next;
      this.syncCurrentLevelPuzzles();
    }

    replaceStateIfChanged(next) {
      if (this.stateKey(next) === this.stateKey(this.state)) {
        return;
      }
      this.undoStack.push(this.cloneState(this.state));
      this.state = next;
      this.redoStack = [];
    }

    gotoScreen(name) {
      this.createScreen(name);
      this.visibleScreens = [];
      this.showScreen(name);
      this.focusHistory = [];
      this.focusScreen(name);
    }

    enterScreen(name) {
      this.createScreen(name);
      if (this.focusedScreen !== name) {
        this.focusHistory.push(this.focusedScreen);
      }
      this.showScreen(name);
      this.focusScreen(name);
    }

    startScreen(name) {
      this.resetScreenState(name);
      this.visibleScreens = [];
      this.showScreen(name);
      this.focusHistory = [];
      this.focusScreen(name);
    }

    backOrInitial() {
      const current = this.focusedScreen;
      const previous = this.focusHistory.pop() || this.initialScreenName();
      this.hideScreenOnly(current);
      this.createScreen(previous);
      this.showScreen(previous);
      this.focusedScreen = previous;
    }

    createScreen(name) {
      if (!this.screenStates.has(name)) {
        this.resetScreenState(name);
      }
    }

    resetScreenState(name) {
      this.screenStates.set(name, this.defaultScreenState(name));
    }

    defaultScreenState(name) {
      const screen = this.screenDef(name);
      const values = {};
      const puzzles = {};
      for (const variable of screen?.state?.variables || []) {
        values[variable.name] = variable.default;
      }
      for (const puzzle of screen?.state?.puzzles || []) {
        if (puzzle.initializer === "current_level") {
          puzzles[puzzle.name] = this.cloneState(this.state);
        }
      }
      return { values, puzzles };
    }

    deleteScreen(name) {
      this.screenStates.delete(name);
      this.visibleScreens = this.visibleScreens.filter((screen) => screen !== name);
      this.focusHistory = this.focusHistory.filter((screen) => screen !== name);
      if (this.focusedScreen === name) {
        const previous = this.focusHistory.pop() || this.initialScreenName();
        this.createScreen(previous);
        this.showScreen(previous);
        this.focusedScreen = previous;
      }
    }

    showScreen(name) {
      this.createScreen(name);
      if (!this.visibleScreens.includes(name)) {
        this.visibleScreens.push(name);
      }
    }

    hideScreen(name) {
      this.hideScreenOnly(name);
      if (this.focusedScreen === name) {
        const previous = this.visibleScreens.at(-1) || this.focusHistory.pop() || this.initialScreenName();
        this.createScreen(previous);
        this.showScreen(previous);
        this.focusedScreen = previous;
      }
    }

    hideScreenOnly(name) {
      this.visibleScreens = this.visibleScreens.filter((screen) => screen !== name);
    }

    toggleScreen(name) {
      if (this.visibleScreens.includes(name)) {
        this.hideScreen(name);
      } else {
        this.showScreen(name);
      }
    }

    focusScreen(name) {
      this.createScreen(name);
      this.showScreen(name);
      this.focusedScreen = name;
    }

    syncCurrentLevelPuzzles() {
      for (const screen of this.data.screens) {
        const runtime = this.screenStates.get(screen.name);
        if (!runtime) {
          continue;
        }
        for (const puzzle of screen.state?.puzzles || []) {
          if (puzzle.initializer === "current_level") {
            runtime.puzzles[puzzle.name] = this.cloneState(this.state);
          }
        }
      }
    }

    currentScreenHasLevelMenu() {
      return (this.currentScreenDef()?.components || []).some((component) => this.componentHasLevelMenu(component));
    }

    currentScreenAcceptsPuzzleInput() {
      return Boolean(this.currentScreenDef()?.puzzleRule);
    }

    componentHasLevelMenu(component) {
      if (component.kind === "level_menu") {
        return true;
      }
      return (component.children || []).some((child) => this.componentHasLevelMenu(child));
    }

    currentLevelMenuDef() {
      const find = (components) => {
        for (const component of components || []) {
          if (component.kind === "level_menu") {
            return component;
          }
          const child = find(component.children || []);
          if (child) {
            return child;
          }
        }
        return null;
      };
      return find(this.currentScreenDef()?.components || []);
    }

    applyLevelMenuAction(action) {
      const [name, rawCursor] = String(action || "").split(":");
      const menu = this.currentLevelMenuDef();
      const itemCount = (this.data.stages?.length || 0) + (menu?.actions?.length || 0);
      if (!menu || itemCount === 0) {
        this.selectedStageIndex = 0;
        return false;
      }
      if (/^\d+$/.test(rawCursor || "")) {
        this.selectedStageIndex = Math.min(itemCount - 1, Number(rawCursor));
      }
      if (name === "menu_up") {
        this.selectedStageIndex = Math.max(0, this.selectedStageIndex - 1);
        return true;
      }
      if (name === "menu_down") {
        this.selectedStageIndex = Math.min(itemCount - 1, this.selectedStageIndex + 1);
        return true;
      }
      if (name === "confirm") {
        if (this.selectedStageIndex < this.data.stages.length) {
          const confirmAction = menu?.confirmAction || { kind: "start_selected_level" };
          if (confirmAction.kind === "emit_action" && confirmAction.name) {
            this.applyAction(`${confirmAction.name}:${this.selectedStageIndex}`);
          } else {
            this.startStage(this.selectedStageIndex);
          }
        } else {
          const item = menu.actions?.[this.selectedStageIndex - this.data.stages.length];
          this.applyScreenEffect(item?.effect, {});
        }
        return true;
      }
      return false;
    }

    parseRuntimeCommand(action) {
      const trimmed = String(action || "").trim();
      if (trimmed === "back") {
        return { kind: "back" };
      }
      const match = trimmed.match(/^(goto|enter|create|reset|delete|show|hide|toggle|focus)\s+([A-Za-z_][A-Za-z0-9_]*)(?:\s+with\s+(.+))?$/);
      if (!match) {
        return null;
      }
      const [, kind, screen, params] = match;
      const parsedParams = params ? this.parseRuntimeParams(params) : [];
      if (["create", "reset", "delete", "show", "hide", "toggle", "focus"].includes(kind) && parsedParams.length) {
        return null;
      }
      return { kind, screen, params: parsedParams };
    }

    parsePuzzleRuntimeCommand(action) {
      const [target, command] = String(action || "").trim().split(".");
      if (!target || command !== "next_level") {
        return null;
      }
      return { kind: "puzzle_next_level", target };
    }

    parseRuntimeParams(value) {
      return String(value)
        .split(",")
        .map((part) => part.trim())
        .filter(Boolean)
        .map((part) => {
          const [name, rawValue] = part.split("=").map((segment) => segment.trim());
          return { name, value: this.parseRuntimeExpr(rawValue) };
        });
    }

    parseRuntimeExpr(value) {
      if (value === "true") return { kind: "bool", value: true };
      if (value === "false") return { kind: "bool", value: false };
      if (/^-?\d+$/.test(value)) return { kind: "int", value: Number(value) };
      const call = String(value).match(/^([A-Za-z_][A-Za-z0-9_]*)\((.*)\)$/);
      if (call) {
        const args = call[2].trim()
          ? call[2].split(",").map((arg) => this.parseRuntimeExpr(arg.trim()))
          : [];
        return { kind: "call", name: call[1], args };
      }
      return { kind: "path", path: String(value || "") };
    }

    currentStage() {
      return this.data.stages[this.stageIndex];
    }

    clampStageIndex(index) {
      const number = Number(index);
      if (!Number.isFinite(number)) {
        return 0;
      }
      return Math.max(0, Math.min(this.data.stages.length - 1, Math.trunc(number)));
    }

    hasNextStage() {
      return this.stageIndex + 1 < this.data.stages.length;
    }

    currentScreenDef() {
      return this.screenDef(this.focusedScreen);
    }

    screenDef(name) {
      return this.data.screens.find((screen) => screen.name === name) || null;
    }

    focusedScreenState() {
      this.createScreen(this.focusedScreen);
      return this.screenStates.get(this.focusedScreen);
    }

    initialScreenName() {
      return this.data.screens[0]?.name || "playing";
    }

    stageIndexFromValue(value) {
      if (/^\d+$/.test(String(value))) {
        const index = Number(value);
        return index < this.data.stages.length ? index : undefined;
      }
      const found = this.data.stages.findIndex((stage) => stage.name === value);
      return found >= 0 ? found : undefined;
    }

    splitActionValue(action) {
      const index = String(action).indexOf(":");
      return index < 0 ? [action, undefined] : [action.slice(0, index), action.slice(index + 1)];
    }

    conditionName(value) {
      const parts = String(value).split(".");
      return parts[parts.length - 1];
    }

    cloneState(state) {
      return {
        width: state.width,
        height: state.height,
        layerCount: state.layerCount,
        slots: [...state.slots],
        cellScratch: this.cloneScratchStore(state.cellScratch),
        scratch: this.cloneScratchStore(state.scratch),
        globals: [...(state.globals || [])],
        levelFiredRules: [...(state.levelFiredRules || [])],
      };
    }

    cloneScratchStore(store) {
      if (!store?.some((attrs) => attrs?.length)) {
        return [];
      }
      const cloned = store.map((attrs) => attrs?.length ? attrs.map((attr) => ({ ...attr })) : []);
      while (cloned.length && !cloned[cloned.length - 1]?.length) {
        cloned.pop();
      }
      return cloned;
    }

    scratchStoreKey(store) {
      if (!store?.some((attrs) => attrs?.length)) {
        return "";
      }
      let last = store.length - 1;
      while (last >= 0 && !store[last]?.length) {
        last -= 1;
      }
      const parts = [];
      for (let index = 0; index <= last; index += 1) {
        parts.push((store[index] || [])
          .map((attr) => `${attr.scratch}:${Object.hasOwn(attr, "value") ? attr.value : ""}`)
          .join("."));
      }
      return parts.join(",");
    }

    stateKey(state) {
      const cellAttrs = this.scratchStoreKey(state.cellScratch);
      const attrs = this.scratchStoreKey(state.scratch);
      return `${state.width}x${state.height}x${state.layerCount}|${state.slots.join(",")}|${cellAttrs}|${attrs}|${state.globals.join(",")}|${(state.levelFiredRules || []).join(",")}`;
    }

    slotIndex(state, x, y, layer) {
      return ((y * state.width + x) * state.layerCount) + layer;
    }

    cellIndex(state, x, y) {
      return (y * state.width) + x;
    }

    hasObject(state, x, y, object) {
      const layer = this.objectLayers.get(object);
      if (layer === undefined) {
        return false;
      }
      return state.slots[this.slotIndex(state, x, y, layer)] === object;
    }

    hasScratchPattern(state, x, y, attr) {
      if (!attr.object) {
        const attrs = state.cellScratch?.[this.cellIndex(state, x, y)] || [];
        if (attr.match === "any") {
          return attrs.some((entry) => entry.scratch === attr.scratch);
        }
        const value = Object.hasOwn(attr, "value") ? attr.value : null;
        return attrs.some((entry) => entry.scratch === attr.scratch && (Object.hasOwn(entry, "value") ? entry.value : null) === value);
      }
      const layer = this.objectLayers.get(attr.object);
      if (layer === undefined) {
        return false;
      }
      const index = this.slotIndex(state, x, y, layer);
      if (state.slots[index] !== attr.object) {
        return false;
      }
      const attrs = state.scratch?.[index] || [];
      if (attr.match === "any") {
        return attrs.some((entry) => entry.scratch === attr.scratch);
      }
      const value = Object.hasOwn(attr, "value") ? attr.value : null;
      return attrs.some((entry) => entry.scratch === attr.scratch && (Object.hasOwn(entry, "value") ? entry.value : null) === value);
    }

    setObject(state, x, y, object) {
      const layer = this.objectLayers.get(object);
      const index = this.slotIndex(state, x, y, layer);
      state.slots[index] = object;
      if (state.scratch?.[index]?.length) {
        state.scratch[index] = [];
      }
    }

    removeObject(state, x, y, object) {
      const layer = this.objectLayers.get(object);
      const index = this.slotIndex(state, x, y, layer);
      if (state.slots[index] === object) {
        state.slots[index] = 0;
        if (state.scratch?.[index]?.length) {
          state.scratch[index] = [];
        }
      }
    }

    moveObject(state, fromX, fromY, toX, toY, object) {
      const layer = this.objectLayers.get(object);
      const fromIndex = this.slotIndex(state, fromX, fromY, layer);
      const toIndex = this.slotIndex(state, toX, toY, layer);
      if (state.slots[fromIndex] !== object) {
        return;
      }
      state.slots[fromIndex] = 0;
      state.slots[toIndex] = object;
      const scratch = state.scratch?.[fromIndex] || [];
      if (scratch.length) {
        state.scratch = state.scratch || [];
        state.scratch[toIndex] = scratch;
        state.scratch[fromIndex] = [];
      } else if (state.scratch?.[toIndex]?.length) {
        state.scratch[toIndex] = [];
      }
    }

    setScratch(state, x, y, object, scratch, value) {
      if (!object) {
        const index = this.cellIndex(state, x, y);
        state.cellScratch = state.cellScratch || [];
        const attrs = state.cellScratch[index] || [];
        const found = attrs.find((entry) => entry.scratch === scratch);
        if (found) {
          if (value === null) {
            delete found.value;
          } else {
            found.value = value;
          }
        } else {
          const entry = { scratch };
          if (value !== null) {
            entry.value = value;
          }
          attrs.push(entry);
        }
        state.cellScratch[index] = attrs;
        return;
      }
      const layer = this.objectLayers.get(object);
      const index = this.slotIndex(state, x, y, layer);
      if (state.slots[index] !== object) {
        return;
      }
      state.scratch = state.scratch || [];
      const attrs = state.scratch[index] || [];
      const found = attrs.find((entry) => entry.scratch === scratch);
      if (found) {
        if (value === null) {
          delete found.value;
        } else {
          found.value = value;
        }
      } else {
        const entry = { scratch };
        if (value !== null) {
          entry.value = value;
        }
        attrs.push(entry);
      }
      state.scratch[index] = attrs;
    }

    removeScratch(state, x, y, object, scratch, value, matchMode) {
      if (!object) {
        const index = this.cellIndex(state, x, y);
        const attrs = state.cellScratch?.[index] || [];
        if (!attrs.length) {
          return;
        }
        state.cellScratch[index] = attrs.filter((entry) => {
          if (entry.scratch !== scratch) {
            return true;
          }
          if (matchMode === "any") {
            return false;
          }
          return (Object.hasOwn(entry, "value") ? entry.value : null) !== value;
        });
        return;
      }
      const layer = this.objectLayers.get(object);
      const index = this.slotIndex(state, x, y, layer);
      if (state.slots[index] !== object) {
        return;
      }
      const attrs = state.scratch?.[index] || [];
      if (!attrs.length) {
        return;
      }
      state.scratch[index] = attrs.filter((entry) => {
        if (entry.scratch !== scratch) {
          return true;
        }
        if (matchMode === "any") {
          return false;
        }
        return (Object.hasOwn(entry, "value") ? entry.value : null) !== value;
      });
    }

    clearScratch(state) {
      state.cellScratch = [];
      state.scratch = [];
    }

    objectCount(state, object) {
      return state.slots.reduce((count, found) => count + (found === object ? 1 : 0), 0);
    }

    sceneFromState(state) {
      const cells = [];
      for (let y = 0; y < state.height; y += 1) {
        for (let x = 0; x < state.width; x += 1) {
          const layers = [];
          for (let layer = 0; layer < state.layerCount; layer += 1) {
            const objectId = state.slots[this.slotIndex(state, x, y, layer)];
            if (!objectId) {
              continue;
            }
            const object = this.objectsById.get(objectId);
            layers.push({
              layer,
              objectId,
              object: object?.name || "?",
              sprite: object?.sprite || "unknown",
            });
          }
          cells.push({ x, y, layers });
        }
      }
      return {
        width: state.width,
        height: state.height,
        layerCount: state.layerCount,
        screen: this.data.screen,
        regions: this.currentStage()?.regions || [],
        cells,
      };
    }
  }

  window.PuzzleStandaloneRuntime = PuzzleStandaloneRuntime;
}());

</script>
    <script>
const board = document.querySelector("#board");
const screenView = document.querySelector("#screenView");
const playSurface = document.querySelector(".play-surface");
const shell = document.querySelector("#shell");
const overlayMenu = document.querySelector("#overlayMenu");
const renderer = new window.PuzzleRenderer(board);
const standaloneRuntime = window.PuzzleStandaloneRuntime
  ? new window.PuzzleStandaloneRuntime(window.PuzzleExport)
  : null;

let currentState = null;
let swipeStart = null;
const activeSolveRequests = new Map();

async function requestJson(url, options = {}) {
  if (standaloneRuntime) {
    return standaloneRuntime.requestJson(url, options);
  }
  const response = await fetch(url, options);
  const body = await response.json();
  if (!response.ok) {
    throw new Error(body.error || response.statusText);
  }
  return body;
}

async function loadState() {
  render(await requestJson("/api/state"));
}

async function post(url) {
  try {
    const nextState = await requestJson(url, { method: "POST" });
    render(nextState);
  } catch (error) {
    showError(error);
  }
}

function render(state) {
  currentState = state;
  renderScreen(state);
  renderOverlay(state);
  notifyPreviewState(state);
  focusShell();
}

function notifyPreviewState(state) {
  if (window.parent === window) {
    return;
  }
  window.parent.postMessage({
    type: "PuzzleStudioPreviewState",
    stageIndex: state.stageIndex,
    scene: state.scene,
    inputs: state.inputs,
  }, "*");
}

function renderScreen(state) {
  screenView.replaceChildren();
  const screenDef = currentScreenDef();
  const components = screenDef?.components || [];
  const hasPuzzle = components.some((component) => component.kind === "puzzle");
  if (!hasPuzzle) {
    return;
  }
  renderSurfaceComponents(components, screenView);
}

function renderOverlay(state) {
  overlayMenu.replaceChildren();
  const screenDef = currentScreenDef();
  const overlayComponents = (screenDef?.components || []).filter((component) => component.kind !== "puzzle");
  const needsOverlay = overlayComponents.length > 0 && !currentScreenHasPuzzle();
  shell.classList.toggle("has-overlay", needsOverlay);
  if (needsOverlay) {
    renderViewComponents(overlayComponents);
  }
}

function screenHasComponent(screen, kind) {
  return Boolean(screen?.components?.some((component) => componentHasKind(component, kind)));
}

function componentHasKind(component, kind) {
  if (component.kind === kind) {
    return true;
  }
  return Boolean(component.children?.some((child) => componentHasKind(child, kind)));
}

function currentScreenHasPuzzle() {
  return screenHasComponent(currentScreenDef(), "puzzle");
}

function screenTitle(name) {
  return String(name || "")
    .split(/[_-]+/)
    .filter(Boolean)
    .map((part) => part[0]?.toUpperCase() + part.slice(1))
    .join(" ") || "Screen";
}

function renderViewComponents(components, parent = overlayMenu, scope = {}) {
  for (const component of components || []) {
    if (component.kind === "puzzle") {
      continue;
    }
    parent.append(renderComponent(component, scope));
  }
}

function renderSurfaceComponents(components, parent = screenView, scope = {}) {
  for (const component of components || []) {
    parent.append(renderComponent(component, scope));
  }
}

function renderComponent(component, scope = {}) {
  switch (component.kind) {
    case "puzzle":
      return renderPuzzle(component);
    case "title":
      return renderTitle(component, "view-title", scope);
    case "subtitle":
      return renderTitle(component, "view-subtitle", scope);
    case "text":
      return renderText(component, scope);
    case "button":
      return renderButton(component, scope);
    case "panel":
    case "row":
    case "column":
      return renderContainer(component, scope);
    case "for":
      return renderFor(component, scope);
    case "level_menu":
      return renderLevelMenu(currentState, component);
    case "menu":
      return renderMenuInstance(component, scope);
    default: {
      const empty = document.createElement("div");
      empty.hidden = true;
      return empty;
    }
  }
}

function renderMenuInstance(component, scope = {}) {
  const menu = currentState?.menus?.find((candidate) => candidate.name === component.menu);
  const container = document.createElement("div");
  container.className = "view-menu";
  if (!menu) {
    container.hidden = true;
    return container;
  }

  const menuScope = {
    ...scope,
    __menuInstance: component.name,
    __menuButtonCounter: { value: 0 },
    __menuCursor: Number((currentState?.sceneState || currentState?.screenState)?.[`__menu_${component.name}_cursor`] || 0),
  };
  renderSurfaceComponents(menu.view || [], container, menuScope);
  return container;
}

function renderTitle(component, className, scope = {}) {
  const title = document.createElement("p");
  title.className = className;
  title.textContent = resolveLabel(component.content, scope);
  return title;
}

function renderPuzzle(component) {
  board.dataset.source = component.source || "";
  renderer.render(currentState.scene);
  return board;
}

function renderText(component, scope = {}) {
  const text = document.createElement("p");
  text.className = "view-text";
  if (component.source === "path") {
    text.textContent = String(resolveViewPath(component.path, scope) ?? "");
  } else {
    text.textContent = component.value || "";
  }
  return text;
}

function renderButton(component, scope = {}) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = resolveLabel(component.label, scope) || screenTitle(effectActionName(component.effect));
  if (scope.__menuInstance && component.value) {
    const counter = scope.__menuButtonCounter || { value: 0 };
    const index = counter.value;
    counter.value += 1;
    button.classList.toggle("is-selected", index === scope.__menuCursor);
    button.addEventListener("click", () => sendAction(`${scope.__menuInstance}.enter:${index}`));
  } else {
    button.addEventListener("click", () => sendEffect(component.effect, scope));
  }
  return button;
}

function renderContainer(component, scope = {}) {
  const container = document.createElement("div");
  container.className = `view-${component.kind}`;
  renderSurfaceComponents(component.children || [], container, scope);
  return container;
}

function renderFor(component, scope = {}) {
  const list = document.createElement("ul");
  list.className = "view-list";

  for (const item of viewItems(component)) {
    const row = document.createElement("li");
    row.classList.toggle("is-selected", item.selected === true);
    renderViewComponents(component.children || [], row, {
      ...scope,
      [component.binding]: item,
    });
    if (!row.childNodes.length) {
      row.textContent = item.label || item.name || "";
    }
    list.append(row);
  }

  return list;
}

function viewItems(component) {
  if (component.source === "levels") {
    return (currentState?.stages || []).map((level, index) => ({
      index,
      number: index + 1,
      name: level.name || `Stage ${index + 1}`,
      label: level.label || level.name || `Stage ${index + 1}`,
      current: index === currentState.stageIndex,
      selected: index === currentState.selectedStageIndex,
    }));
  }
  return [];
}

function menuInstanceComponent(screen = currentScreenDef()) {
  const components = screen?.components || [];
  return findComponent(components, (component) => component.kind === "menu");
}

function findComponent(components, predicate) {
  for (const component of components || []) {
    if (predicate(component)) {
      return component;
    }
    const found = findComponent(component.children || [], predicate);
    if (found) {
      return found;
    }
  }
  return null;
}

function resolveViewPath(path, scope = {}) {
  const parts = String(path || "").split(".").filter(Boolean);
  if (parts.length === 0) {
    return "";
  }
  if (parts.length === 1) {
    if (Object.prototype.hasOwnProperty.call(scope, parts[0])) {
      return scope[parts[0]];
    }
    if (currentState && Object.prototype.hasOwnProperty.call(currentState, parts[0])) {
      return currentState[parts[0]];
    }
    return (currentState?.sceneState || currentState?.screenState)?.[parts[0]];
  }
  let value = Object.prototype.hasOwnProperty.call(scope, parts[0])
    ? scope[parts[0]]
    : currentState?.[parts[0]];
  if (value === undefined) {
  value = (currentState?.sceneState || currentState?.screenState)?.[parts[0]];
  }
  for (const part of parts.slice(1)) {
    value = value?.[part];
  }
  return value;
}

function resolveLabel(label, scope = {}) {
  if (!label) {
    return "";
  }
  if (typeof label === "string") {
    return label;
  }
  if (label.kind === "text") {
    return label.value || "";
  }
  if (label.kind === "int" || label.kind === "bool") {
    return String(label.value);
  }
  if (label.kind === "path") {
    return String(resolveViewPath(label.path, scope) ?? "");
  }
  if (label.kind === "call") {
    if (label.name === "join") {
      return (label.args || []).map((arg) => resolveLabel(arg, scope)).join("");
    }
    return exprSource(label, scope);
  }
  return "";
}

function renderLevelMenu(state, component = {}) {
  const list = document.createElement("ul");
  list.className = "view-list";
  for (let index = 0; index < state.stageCount; index += 1) {
    const item = document.createElement("li");
    item.classList.toggle("is-selected", index === state.selectedStageIndex);

    const label = document.createElement("span");
    const stageName = state.stages?.[index]?.name || `Stage ${index + 1}`;
    label.textContent = `${index + 1}. ${stageName}`;
    item.append(label);
    item.addEventListener("click", () => sendAction(`confirm:${index}`));

    if (index === state.stageIndex) {
      const meta = document.createElement("span");
      meta.className = "menu-meta";
      meta.textContent = "current";
      item.append(meta);
    }

    list.append(item);
  }
  for (const [actionIndex, action] of (component.actions || []).entries()) {
    const index = state.stageCount + actionIndex;
    const item = document.createElement("li");
    item.classList.toggle("is-selected", index === state.selectedStageIndex);
    item.textContent = resolveLabel(action.label);
    item.addEventListener("click", () => sendAction(`confirm:${index}`));
    list.append(item);
  }
  return list;
}

function focusShell() {
  shell.focus({ preventScroll: true });
}

function actionForKey(event) {
  if (!currentState) {
    return null;
  }
  const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
  const screen = currentScreenDef();
  const binding = screen?.keys?.find((binding) => binding.keys.includes(key));
  if (binding) {
    return binding.effect || { kind: "action", name: binding.action };
  }

  const menu = menuInstanceComponent(screen);
  if (menu) {
    const menuInput = menuInputForKey(key, event.key);
    if (menuInput) {
      return { kind: "action", name: `${menu.name}.${menuInput}` };
    }
  }

  if (key === "z") {
    return { kind: "action", name: "undo" };
  }
  if (key === "y") {
    return { kind: "action", name: "redo" };
  }
  if (key === "r") {
    return { kind: "action", name: "restart" };
  }

  if (!currentScreenHasPuzzle()) {
    return null;
  }

  const input = currentState.inputs.find((input) => input.key === key || input.arrow === event.key);
  return input ? { kind: "action", name: input.name } : null;
}

function menuInputForKey(key, rawKey) {
  if (key === "w" || rawKey === "ArrowUp") {
    return "up";
  }
  if (key === "s" || rawKey === "ArrowDown") {
    return "down";
  }
  if (key === "a" || rawKey === "ArrowLeft") {
    return "left";
  }
  if (key === "d" || rawKey === "ArrowRight") {
    return "right";
  }
  if (rawKey === "Enter" || rawKey === " ") {
    return "enter";
  }
  if (rawKey === "Escape" || key === "q") {
    return "back";
  }
  return null;
}

function inputByName(name) {
  if (!currentState) {
    return null;
  }
  return currentState.inputs.find((input) => input.name === name);
}

function currentScreenDef() {
  const name = currentState?.currentScene || currentState?.screen || "playing";
  const scenes = currentState?.scenes || currentState?.screens || [];
  return scenes.find((screen) => screen.name === name) || null;
}

function sendEffect(effect, scope = {}) {
  const action = effectToAction(effect, scope);
  if (action) {
    sendAction(action);
  }
}

function sendAction(action) {
  if (currentState?.inputs?.some((input) => input.name === action)) {
    post(`/api/input/${encodeURIComponent(action)}`);
    return;
  }
  post(`/api/action/${encodeURIComponent(action)}`);
}

function effectActionName(effect) {
  if (!effect) {
    return "";
  }
  if (typeof effect === "string") {
    return effect;
  }
  if (effect.kind === "action") {
    return effect.name;
  }
  if (["goto", "enter", "create", "reset", "delete", "show", "hide", "toggle", "focus"].includes(effect.kind)) {
    return effectCommandName(effect);
  }
  if (effect.kind === "puzzle_next_level") {
    return `${effect.target}.next_level`;
  }
  if (effect.kind === "back") {
    return "back";
  }
  return "";
}

function effectToAction(effect, scope = {}) {
  if (!effect) {
    return "";
  }
  if (typeof effect === "string") {
    return effect;
  }
  if (effect.kind === "action") {
    return actionWithScope(effect.name, scope);
  }
  if (["goto", "enter", "create", "reset", "delete", "show", "hide", "toggle", "focus"].includes(effect.kind)) {
    return effectCommand(effect, scope);
  }
  if (effect.kind === "puzzle_next_level") {
    return `${effect.target}.next_level`;
  }
  if (effect.kind === "back") {
    return "back";
  }
  return "";
}

function effectCommandName(effect) {
  return effect?.scene || effect?.screen || "";
}

function effectCommand(effect, scope = {}) {
  const screen = effect?.scene || effect?.screen || "";
  if (!screen) {
    return "";
  }
  const params = (effect.params || []).map((param) => `${param.name} = ${exprSource(param.value, scope)}`);
  const base = `${effect.kind} ${screen}`;
  return params.length ? `${base} with ${params.join(", ")}` : base;
}

function exprSource(expr, scope = {}) {
  if (!expr) {
    return "";
  }
  if (expr.kind === "text") {
    return JSON.stringify(expr.value || "");
  }
  if (expr.kind === "int" || expr.kind === "bool") {
    return String(expr.value);
  }
  if (expr.kind === "path") {
    const resolved = resolveViewPath(expr.path, scope);
    return resolved === undefined || resolved === null ? expr.path : actionPayload(resolved);
  }
  if (expr.kind === "call") {
    return `${expr.name}(${(expr.args || []).map((arg) => exprSource(arg, scope)).join(", ")})`;
  }
  return "";
}

function actionWithScope(action, scope = {}) {
  const [name, payload] = String(action || "").split(":", 2);
  if (!payload) {
    return action;
  }
  const scoped = resolveViewPath(payload, scope);
  if (scoped === undefined || scoped === null) {
    return action;
  }
  return `${name}:${actionPayload(scoped)}`;
}

function actionPayload(value) {
  if (typeof value === "object") {
    if (value.index !== undefined) {
      return String(value.index);
    }
    if (value.name !== undefined) {
      return String(value.name);
    }
    if (value.label !== undefined) {
      return String(value.label);
    }
  }
  return String(value);
}

document.addEventListener("keydown", (event) => {
  const action = actionForKey(event);
  if (!currentState) {
    return;
  }

  if (action) {
    event.preventDefault();
    sendEffect(action);
    return;
  }
});

window.addEventListener("message", async (event) => {
  if (event.data?.type === "PuzzleStudioSetState") {
    if (standaloneRuntime && event.data.state) {
      standaloneRuntime.setCurrentState(event.data.state, {
        materializeLevelStart: event.data.materializeLevelStart === true,
      });
      loadState();
    }
    return;
  }

  if (event.data?.type === "PuzzleStudioSolve") {
    const requestId = event.data.requestId;
    const solveRequest = { cancelled: false };
    activeSolveRequests.set(requestId, solveRequest);
    try {
      if (standaloneRuntime && event.data.state) {
        standaloneRuntime.setCurrentState(event.data.state, {
          materializeLevelStart: event.data.materializeLevelStart === true,
        });
        await loadState();
      }
      const solution = standaloneRuntime
        ? await standaloneRuntime.solveCurrentStateAsync(event.data.options || {}, (progress) => {
            window.parent.postMessage({
              type: "PuzzleStudioSolveProgress",
              requestId,
              progress,
            }, "*");
          }, () => solveRequest.cancelled)
        : await requestJson("/api/solve", { method: "POST" });
      window.parent.postMessage({
        type: "PuzzleStudioSolveResult",
        requestId,
        solution,
      }, "*");
    } catch (error) {
      window.parent.postMessage({
        type: "PuzzleStudioSolveResult",
        requestId,
        error: String(error?.message || error),
      }, "*");
    } finally {
      activeSolveRequests.delete(requestId);
    }
    return;
  }

  if (event.data?.type === "PuzzleStudioCancelSolve") {
    const solveRequest = activeSolveRequests.get(event.data.requestId);
    if (solveRequest) {
      solveRequest.cancelled = true;
    }
    return;
  }

  if (event.data?.type !== "PuzzleStudioAction") {
    return;
  }
  const action = String(event.data.action || "");
  if (action) {
    sendAction(action);
  }
});

playSurface.addEventListener("pointerdown", (event) => {
  if (!currentState || !currentScreenHasPuzzle()) {
    return;
  }
  swipeStart = { x: event.clientX, y: event.clientY, pointerId: event.pointerId };
  playSurface.setPointerCapture(event.pointerId);
});

playSurface.addEventListener("pointerup", (event) => {
  if (!swipeStart || swipeStart.pointerId !== event.pointerId) {
    return;
  }

  const dx = event.clientX - swipeStart.x;
  const dy = event.clientY - swipeStart.y;
  swipeStart = null;

  const threshold = 24;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < threshold) {
    return;
  }

  const inputName = Math.abs(dx) > Math.abs(dy)
    ? (dx > 0 ? "right" : "left")
    : (dy > 0 ? "down" : "up");
  const input = inputByName(inputName);
  if (input) {
    sendAction(input.name);
  }
});

playSurface.addEventListener("pointercancel", () => {
  swipeStart = null;
});

loadState().catch((error) => {
  showError(error);
});

document.addEventListener("pointerdown", focusShell);
window.addEventListener("focus", focusShell);

function showError(error) {
  console.error(error);
}

</script>
