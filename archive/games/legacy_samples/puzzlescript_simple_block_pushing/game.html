<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PuzzleStudio HTML Export</title>
    <style>
:root {
  color-scheme: light;
  --bg: #f5f3ef;
  --ink: #1f2428;
  --muted: #66727c;
  --line: #d7dde2;
  --board-bg: #edf1f2;
  --accent: #2f7ebc;
  --button-bg: #263039;
  --button-bg-hover: #313d47;
  --button-bg-active: #1d252c;
  --menu-item-bg: rgba(38, 48, 57, 0.08);
  --menu-item-bg-selected: rgba(47, 126, 188, 0.13);
  --menu-item-ring: rgba(47, 126, 188, 0.22);
  --panel-bg: rgba(255, 255, 255, 0.94);
  --popup-bg: rgba(255, 255, 255, 0.96);
  --backdrop: rgba(245, 243, 239, 0.72);
  --scrim: rgba(29, 31, 34, 0.24);
  --radius-control: 6px;
  --radius-panel: 8px;
  --ok: #257a59;
  --ui-font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --title-font: var(--ui-font);
  --menu-cursor: ">";
  --level-clear-mark: "✓";
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui-font);
  letter-spacing: 0;
}

html.is-component-embed,
body.is-component-embed {
  background: transparent;
}

body.is-component-embed .shell,
body.is-component-embed .play-surface,
body.is-component-embed .screen-view,
body.is-component-embed .scene-layer {
  background: transparent;
}

body.is-component-embed .shell,
body.is-component-embed .play-surface,
body.is-component-embed .screen-view {
  width: 100vw;
  height: 100vh;
  min-height: 0;
  margin: 0;
  padding: 0;
}

body.is-component-embed .screen-view {
  max-width: none;
  gap: 0;
}

button {
  min-height: 40px;
  padding: 0 18px;
  border: 0;
  border-radius: var(--radius-control);
  background: linear-gradient(180deg, var(--button-bg-hover), var(--button-bg));
  color: #fff;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.12),
    0 7px 16px rgba(31, 36, 40, 0.18);
  transition:
    background-color 120ms ease,
    box-shadow 120ms ease,
    transform 120ms ease;
}

button:hover {
  background: linear-gradient(180deg, var(--button-bg-hover), var(--button-bg));
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.16),
    0 10px 20px rgba(31, 36, 40, 0.2);
  transform: translateY(-1px);
}

button:active {
  background: var(--button-bg-active);
  box-shadow:
    inset 0 2px 5px rgba(0, 0, 0, 0.22),
    0 3px 9px rgba(31, 36, 40, 0.14);
  transform: translateY(0);
}

button:focus-visible {
  outline: 3px solid var(--menu-item-ring);
  outline-offset: 3px;
}

.title-menu-button.is-selected {
  outline: none;
  box-shadow: inset 0 0 0 2px var(--menu-item-ring);
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
  transform: none;
}

.shell {
  position: relative;
  width: min(1100px, calc(100vw - 32px));
  min-height: 100vh;
  margin: 0 auto;
  padding: 24px 0;
  display: grid;
  grid-template-rows: minmax(0, 1fr);
}

.shell:focus {
  outline: none;
}

.play-surface {
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 16px;
  touch-action: none;
}

.screen-view {
  width: min(100%, 720px);
  display: grid;
  place-items: center;
  gap: 14px;
}

.screen-view.has-scene-stack {
  position: relative;
  isolation: isolate;
}

.scene-layer {
  grid-area: 1 / 1;
  width: 100%;
  display: grid;
  place-items: center;
  gap: 14px;
}

.scene-overlay-layer {
  align-self: stretch;
  justify-self: stretch;
  padding: 24px;
  background: var(--backdrop);
  backdrop-filter: blur(2px);
}

.message-popup-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--bg);
}

.message-popup {
  width: min(680px, 100%);
  padding: 24px;
  text-align: center;
}

.message-popup-text {
  margin: 0;
  color: var(--ink);
  font-size: 22px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.view-row,
.view-column,
.view-box {
  display: grid;
  gap: 8px;
}

.screen-view > .view-row,
.screen-view > .view-column,
.screen-view > .view-box {
  width: min(100%, calc(var(--cols, 9) * 60px));
}

.view-row {
  grid-auto-flow: column;
  grid-auto-columns: max-content;
  justify-content: space-between;
  align-items: end;
}

.view-row > * {
  min-width: 0;
}

.view-list {
  margin: 0;
  padding: 0;
  display: grid;
  gap: 8px;
  list-style: none;
}

.view-list.is-matrix {
  width: min(100%, calc(var(--cols, 9) * 60px));
}

.level-menu {
  width: min(100%, 420px);
  text-align: left;
}

.level-menu li,
.is-menu-scene button {
  position: relative;
  min-height: 40px;
  padding: 10px 12px 10px 36px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  border: 0;
  border-radius: var(--radius-control);
  background: var(--menu-item-bg);
  color: var(--ink);
  font-weight: 700;
  box-shadow: none;
  text-align: left;
}

.is-menu-scene button {
  width: min(100%, 420px);
  justify-self: center;
  cursor: pointer;
  grid-template-columns: minmax(0, 1fr);
}

.is-menu-scene button:hover {
  background: var(--menu-item-bg-selected);
  box-shadow: inset 0 0 0 2px var(--menu-item-ring);
  transform: none;
}

.is-menu-scene button:active {
  background: var(--menu-item-bg-selected);
  box-shadow: inset 0 0 0 2px var(--accent);
  transform: none;
}

.level-menu li::before {
  position: absolute;
  top: 50%;
  left: 12px;
  color: var(--accent);
  font-weight: 900;
  content: "";
  transform: translateY(-50%);
}

.level-menu li.is-selected,
.is-menu-scene button.is-selected {
  background: var(--menu-item-bg-selected);
  box-shadow: inset 0 0 0 2px var(--menu-item-ring);
}

.is-menu-scene button::before {
  position: absolute;
  top: 50%;
  left: 12px;
  color: var(--accent);
  font-weight: 900;
  content: "";
  transform: translateY(-50%);
}

.level-menu li.is-selected::before,
.is-menu-scene button.is-selected::before {
  content: var(--menu-cursor);
}

.level-clear-mark {
  width: 18px;
  color: var(--ok);
  text-align: center;
}

.level-clear-mark.is-cleared::before {
  content: var(--level-clear-mark);
}

.screen-view .view-text {
  margin: 0;
  color: var(--ink);
  font-weight: 700;
}

.view-title,
.view-subtitle {
  margin: 0;
  font-family: var(--title-font);
  font-weight: 700;
}

.view-title {
  color: var(--ink);
}

.view-subtitle {
  color: var(--muted);
  text-align: right;
  font-size: 14px;
}

@media (max-width: 720px) {
  .shell {
    width: min(100vw - 20px, 560px);
    padding: 10px 0;
  }

  .view-row {
    grid-auto-flow: row;
    grid-auto-columns: auto;
    justify-content: center;
    justify-items: center;
  }

  .view-row .view-subtitle {
    text-align: center;
  }

}

</style>

body.theme-clean {
  --bg: #f5f3ef;
  --ink: #1f2428;
  --muted: #66727c;
  --line: #d7dde2;
  --board-bg: #edf1f2;
  --accent: #2f7ebc;
  --button-bg: #263039;
  --button-bg-hover: #313d47;
  --button-bg-active: #1d252c;
  --menu-item-bg: rgba(38, 48, 57, 0.08);
  --menu-item-bg-selected: rgba(47, 126, 188, 0.13);
  --menu-item-ring: rgba(47, 126, 188, 0.24);
  --panel-bg: rgba(255, 255, 255, 0.94);
  --popup-bg: rgba(255, 255, 255, 0.96);
  --backdrop: rgba(245, 243, 239, 0.72);
  --scrim: rgba(29, 31, 34, 0.24);
  --radius-control: 6px;
  --radius-panel: 8px;
  --ok: #257a59;
  --ui-font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --title-font: var(--ui-font);
}

.theme-clean button,
.theme-clean .level-menu li {
  letter-spacing: 0;
}

.theme-clean .board {
  border: 1px solid rgba(31, 36, 40, 0.08);
  box-shadow: 0 12px 30px rgba(31, 36, 40, 0.10);
}

.theme-clean .scene-layer.is-menu-scene {
  gap: 16px;
}

.theme-clean .view-title {
  font-size: 30px;
  line-height: 1.08;
}

.theme-clean .is-menu-scene button,
.theme-clean .level-menu {
  width: min(100%, 420px);
}

body.theme-terminal {
  color-scheme: dark;
  --bg: #000000;
  --ink: #ffffff;
  --muted: #ffffff;
  --line: #ffffff;
  --board-bg: #000000;
  --accent: #ffffff;
  --button-bg: #000000;
  --button-bg-hover: #ffffff;
  --button-bg-active: #000000;
  --menu-item-bg: #000000;
  --menu-item-bg-selected: #ffffff;
  --menu-item-ring: #ffffff;
  --panel-bg: #000000;
  --popup-bg: #000000;
  --backdrop: rgba(0, 0, 0, 0.88);
  --scrim: rgba(0, 0, 0, 0.72);
  --radius-control: 0px;
  --radius-panel: 0px;
  --ok: #ffffff;
  --menu-cursor: ">";
  --level-clear-mark: "*";
  --ui-font: "PuzzleStudio Pixel 5x7", "Courier New", Monaco, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --title-font: var(--ui-font);
  background: var(--bg);
  font-variant-ligatures: none;
  font-smooth: never;
  -webkit-font-smoothing: none;
  image-rendering: pixelated;
  text-rendering: optimizeSpeed;
}

.theme-terminal .view-title {
  color: var(--ink);
}

.theme-terminal .view-subtitle,
.theme-terminal .screen-view .view-text,
.theme-terminal .message-popup-text {
  color: var(--ink);
  text-shadow: none;
}

.theme-terminal button,
.theme-terminal .level-menu li {
  border: 0;
  background: var(--button-bg);
  color: var(--ink);
  font-weight: 400;
  box-shadow: none;
  text-transform: uppercase;
}

.theme-terminal button:hover,
.theme-terminal .is-menu-scene button:hover,
.theme-terminal .level-menu li.is-selected,
.theme-terminal .is-menu-scene button.is-selected {
  background: var(--button-bg-hover);
  color: #000000;
  box-shadow: none;
  transform: none;
}

.theme-terminal button:active,
.theme-terminal .is-menu-scene button:active {
  background: var(--button-bg-active);
  color: var(--ink);
  box-shadow: none;
  transform: none;
}

.theme-terminal .board {
  image-rendering: pixelated;
  border: 4px solid var(--line);
  box-shadow: none;
}

.theme-terminal .cell {
  box-shadow: inset 0 0 0 1px rgba(128, 255, 106, 0.05);
}

.theme-terminal .sprite {
  image-rendering: pixelated;
}

.theme-terminal .scene-layer.is-menu-scene {
  gap: 8px;
  justify-items: stretch;
}

.theme-terminal .view-title {
  font-size: 28px;
  font-weight: 400;
  line-height: 1.25;
  text-transform: uppercase;
}

.theme-terminal .view-subtitle {
  font-size: 14px;
  font-weight: 400;
  text-align: left;
  text-transform: uppercase;
}

.theme-terminal .is-menu-scene button,
.theme-terminal .level-menu {
  width: min(100%, 520px);
}

.theme-terminal .is-menu-scene button,
.theme-terminal .level-menu li {
  min-height: 30px;
  padding: 5px 8px 5px 32px;
  font-size: 18px;
  line-height: 1.1;
}

body.theme-paper {
  --bg: #f4ecd9;
  --ink: #2b2419;
  --muted: #756852;
  --line: #cdbd9a;
  --board-bg: #efe3c8;
  --accent: #8d5d2a;
  --button-bg: #fff7e7;
  --button-bg-hover: #fffaf0;
  --button-bg-active: #eadbbd;
  --menu-item-bg: rgba(70, 55, 34, 0.08);
  --menu-item-bg-selected: rgba(141, 93, 42, 0.16);
  --menu-item-ring: rgba(141, 93, 42, 0.34);
  --panel-bg: rgba(255, 250, 240, 0.96);
  --popup-bg: #fff9ec;
  --backdrop: rgba(244, 236, 217, 0.78);
  --scrim: rgba(43, 36, 25, 0.30);
  --radius-control: 4px;
  --radius-panel: 6px;
  --ok: #8d5d2a;
  --ui-font: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
  --title-font: var(--ui-font);
  background:
    linear-gradient(rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0.26)),
    repeating-linear-gradient(0deg, transparent 0 23px, rgba(141, 93, 42, 0.08) 23px 24px),
    var(--bg);
}

.theme-paper button,
.theme-paper .level-menu li {
  border: 1px solid rgba(141, 93, 42, 0.22);
  border-left: 4px solid rgba(141, 93, 42, 0.24);
  background: var(--button-bg);
  box-shadow: 0 3px 8px rgba(84, 66, 42, 0.10);
  color: var(--ink);
}

.theme-paper .level-menu li,
.theme-paper .is-menu-scene button {
  border-radius: 2px 7px 7px 2px;
  justify-items: start;
  text-align: left;
}

.theme-paper button:hover,
.theme-paper .is-menu-scene button:hover {
  background: var(--button-bg-hover);
  box-shadow: 0 5px 12px rgba(84, 66, 42, 0.13);
  transform: translateY(-1px);
}

.theme-paper .level-menu li.is-selected,
.theme-paper .is-menu-scene button.is-selected {
  border-left-color: var(--accent);
  background: var(--button-bg-hover);
  box-shadow:
    inset 0 -2px 0 rgba(141, 93, 42, 0.24),
    0 6px 14px rgba(84, 66, 42, 0.14);
}

.theme-paper .board {
  border: 1px solid rgba(84, 66, 42, 0.16);
  box-shadow: 0 10px 24px rgba(84, 66, 42, 0.15);
}

.theme-paper .scene-layer.is-menu-scene {
  gap: 18px;
}

.theme-paper .view-title {
  font-size: 40px;
  font-weight: 700;
  line-height: 1.04;
}

.theme-paper .view-subtitle {
  font-size: 15px;
  text-align: center;
}

.theme-paper .is-menu-scene button,
.theme-paper .level-menu {
  width: min(100%, 460px);
}

.theme-paper .is-menu-scene button,
.theme-paper .level-menu li {
  min-height: 46px;
  padding: 10px 16px 10px 38px;
}

  color-scheme: dark;
  --bg: #08080c;
  --ink: #f8f8f8;

      clickLayer(0, 0.014, 0.06 + intensity * 0.07, 1400),
    ];
  }
  return varyLayers(layers, duration, baseFrequency, intensity, profile, rng);
}

function varyLayers(layers, duration, baseFrequency, intensity, profile, rng) {
  const varied = layers.map((layer) => {
    const gainJitter = lerp(0.84, 1.18, rng());
    if (layer.kind === "tone") {
      const pitchJitter = lerp(0.92, 1.09, rng());
      return {
        ...layer,
        frequencyStart: Math.round(layer.frequencyStart * pitchJitter),
        frequencyEnd: Math.round(layer.frequencyEnd * lerp(0.9, 1.12, rng())),
        gain: round3(layer.gain * gainJitter),
      };
    }
    if (layer.kind === "noise") {
      return {
        ...layer,
        filterStart: Math.round(layer.filterStart * lerp(0.74, 1.32, rng())),
        filterEnd: Math.round(layer.filterEnd * lerp(0.74, 1.32, rng())),
        gain: round3(layer.gain * gainJitter),
      };
    }
    return { ...layer, gain: round3(layer.gain * gainJitter) };
  });

  if (profile.variant === "double") {
    varied.push(toneLayer("ghost", duration * lerp(0.18, 0.42, rng()), duration * 0.24, profile.waveform, baseFrequency * 1.5, baseFrequency * lerp(1.2, 2.1, rng()), 0.09, intensity, profile));
  } else if (profile.variant === "gritty") {
    varied.push(noiseLayer("grit-tail", duration * 0.12, duration * 0.38, 0.08 + intensity * 0.08, "bandpass", 1800, 520, profile));
  } else if (profile.variant === "hollow") {
    for (const layer of varied) {
      if (layer.kind === "tone") {
        layer.waveform = "sine";
        layer.gain = round3(layer.gain * 0.82);
      }
    }
  } else if (profile.variant === "wide") {
    varied.push(toneLayer("upper", duration * 0.04, duration * 0.5, "triangle", baseFrequency * 2, baseFrequency * lerp(1.6, 2.8, rng()), 0.08, intensity, profile));
  } else if (profile.variant === "stepped") {
    varied.push(clickLayer(duration * lerp(0.22, 0.56, rng()), 0.018, 0.06 + intensity * 0.08, 3600 * profile.filterBias));
  }

  return varied.sort((a, b) => a.start - b.start || a.name.localeCompare(b.name));
}

function toneLayer(name, start, duration, waveform, frequencyStart, frequencyEnd, gain, intensity, profile) {
  return {
    kind: "tone",
    name,
    start: round3(start),
    duration: round3(Math.max(0.025, duration)),
    waveform,
    frequencyStart: Math.round(frequencyStart),
    frequencyEnd: Math.round(frequencyEnd),
    gain: round3(gain * lerp(0.62, 1.22, intensity)),
    attack: 0.006,
    release: round3(Math.max(0.018, duration * 0.32)),
    filterFrequency: Math.round(lerp(900, 4200, intensity) * profile.filterBias),
    wobble: profile.pitchWobble,
  };
}

function noiseLayer(name, start, duration, gain, filterType, filterStart, filterEnd, profile) {
  return {
    kind: "noise",
    name,
    color: profile.noiseColor,
    start: round3(start),
    duration: round3(Math.max(0.02, duration)),
    gain: round3(gain),
    attack: 0.004,
    release: round3(Math.max(0.018, duration * 0.45)),
    filterType,
    filterStart: Math.round(filterStart),
    filterEnd: Math.round(filterEnd),
  };
}

function clickLayer(start, duration, gain, filterFrequency) {
  return {
    kind: "click",
    name: "transient",
    start: round3(start),
    duration: round3(duration),
    gain: round3(gain),
    filterFrequency: Math.round(filterFrequency),
  };
}

function playLayer(audioContext, layer, effectStart, activeSources) {
  const startsAt = effectStart + layer.start;
  if (layer.kind === "tone") {
    playToneLayer(audioContext, layer, startsAt, activeSources);
  } else if (layer.kind === "noise") {
    playNoiseLayer(audioContext, layer, startsAt, activeSources);
  } else {
    playClickLayer(audioContext, layer, startsAt, activeSources);
  }
}

function playToneLayer(audioContext, layer, startsAt, activeSources) {
  const oscillator = audioContext.createOscillator();
  const filter = audioContext.createBiquadFilter();
  const gain = audioContext.createGain();
  const endsAt = startsAt + layer.duration;
  oscillator.type = layer.waveform;
  oscillator.frequency.setValueAtTime(Math.max(20, layer.frequencyStart), startsAt);
  oscillator.frequency.exponentialRampToValueAtTime(Math.max(20, layer.frequencyEnd), endsAt);
  if (layer.wobble > 0) {
    oscillator.detune.setValueAtTime(0, startsAt);
    oscillator.detune.linearRampToValueAtTime(layer.wobble * 1200, startsAt + layer.duration * 0.35);
    oscillator.detune.linearRampToValueAtTime(0, endsAt);
  }
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(layer.filterFrequency, startsAt);
  gain.gain.setValueAtTime(0.0001, startsAt);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, layer.gain), startsAt + layer.attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, Math.max(startsAt + layer.attack + 0.01, endsAt - layer.release));
  oscillator.connect(filter).connect(gain).connect(audioContext.destination);
  trackSource(oscillator, activeSources);
  oscillator.start(startsAt);
  oscillator.stop(endsAt + 0.03);
}

function playNoiseLayer(audioContext, layer, startsAt, activeSources) {
  const samples = Math.max(1, Math.floor(audioContext.sampleRate * layer.duration));
  const buffer = audioContext.createBuffer(1, samples, audioContext.sampleRate);
  const data = buffer.getChannelData(0);
  const rng = mulberry32(hashSeed(`${layer.name}:${layer.start}:${layer.duration}:${layer.gain}`));
  for (let i = 0; i < samples; i += 1) {
    const white = rng() * 2 - 1;
    data[i] = layer.color === "crackle" && rng() > 0.72 ? white : white * 0.55;
  }

  const source = audioContext.createBufferSource();
  const filter = audioContext.createBiquadFilter();
  const gain = audioContext.createGain();
  const endsAt = startsAt + layer.duration;
  filter.type = layer.filterType;
  filter.frequency.setValueAtTime(Math.max(20, layer.filterStart), startsAt);
  filter.frequency.exponentialRampToValueAtTime(Math.max(20, layer.filterEnd), endsAt);
  gain.gain.setValueAtTime(0.0001, startsAt);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, layer.gain), startsAt + layer.attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, Math.max(startsAt + layer.attack + 0.01, endsAt - layer.release));
  source.buffer = buffer;
  source.connect(filter).connect(gain).connect(audioContext.destination);
  trackSource(source, activeSources);
  source.start(startsAt);
}

function playClickLayer(audioContext, layer, startsAt, activeSources) {
  const samples = Math.max(1, Math.floor(audioContext.sampleRate * layer.duration));
  const buffer = audioContext.createBuffer(1, samples, audioContext.sampleRate);
  const data = buffer.getChannelData(0);
  const rng = mulberry32(hashSeed(`${layer.name}:${layer.filterFrequency}:${layer.gain}`));
  for (let i = 0; i < samples; i += 1) {
    const t = i / audioContext.sampleRate;
    data[i] = (rng() * 2 - 1) * Math.exp(-120 * t);
  }

  const source = audioContext.createBufferSource();
  const filter = audioContext.createBiquadFilter();
  const gain = audioContext.createGain();
  filter.type = "highpass";
  filter.frequency.value = layer.filterFrequency;
  gain.gain.setValueAtTime(layer.gain, startsAt);
  gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + layer.duration);
  source.buffer = buffer;
  source.connect(filter).connect(gain).connect(audioContext.destination);
  trackSource(source, activeSources);
  source.start(startsAt);
}

function trackSource(source, activeSources) {
  activeSources.add(source);
  source.addEventListener("ended", () => {
    activeSources.delete(source);
    source.disconnect();
  }, { once: true });
}

function normalizeType(type) {
  if (typeof type !== "string") {
    return null;
  }
  if (type === "random") {
    return null;
  }
  if (type === "wild") {
    return "wild";
  }
  return SFX_TYPES.includes(type) ? type : null;
}

function typeFromSeed(seed) {
  return SFX_TYPES[hashSeed(seed) % SFX_TYPES.length];
}

function hashSeed(seed) {
  let hash = 2166136261;
  for (let i = 0; i < seed.length; i += 1) {
    hash ^= seed.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}

function mulberry32(seed) {
  return function next() {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function pick(values, rng) {
  return values[Math.floor(rng() * values.length)];
}

function randomInt(rng, min, max) {
  return Math.floor(rng() * (max - min + 1)) + min;
}

function lerp(min, max, value) {
  return min + (max - min) * value;
}

function round2(value) {
  return Math.round(value * 100) / 100;
}

function round3(value) {
  return Math.round(value * 1000) / 1000;
}

let psSfxRng = null;

function generatePuzzleScriptSoundEffect(seed) {
  const numericSeed = Math.max(0, Math.trunc(Number(seed) || 0));
  const params = psGenerateFromSeed(numericSeed);
  params.sound_vol = PS_SFX_SOUND_VOL;
  params.sample_rate = PS_SFX_SAMPLE_RATE;
  return {
    seed: String(seed),
    numericSeed,
    type: "puzzlescript",
    params,
  };
}

function createPuzzleScriptSfxPlayer(audioContext, effect) {
  let source = null;
  let output = null;

  function stop() {
    if (source) {
      try {
        source.stop();
      } catch {
        // Already-ended one-shot sources can be ignored.
      }
      source.disconnect();
      source = null;
    }
    if (output) {
      output.disconnect();
      output = null;
    }
  }

  function start() {
    stop();
    const buffer = psRenderBuffer(audioContext, effect.params);
    source = audioContext.createBufferSource();
    const filter1 = audioContext.createBiquadFilter();
    const filter2 = audioContext.createBiquadFilter();
    const filter3 = audioContext.createBiquadFilter();
    filter1.frequency.value = 1600;
    filter2.frequency.value = 1600;
    filter3.frequency.value = 1600;
    source.buffer = buffer;
    source.connect(filter1);
    filter1.connect(filter2);
    filter2.connect(filter3);
    filter3.connect(audioContext.destination);
    output = filter3;
    source.addEventListener("ended", stop, { once: true });
    source.start(audioContext.currentTime);
  }

  return { start, stop };
}

  return {

function psFrnd(range) {
  return (psSfxRng ? psSfxRng.uniform() : Math.random()) * range;

function psRnd(max) {
  return Math.floor((psSfxRng ? psSfxRng.uniform() : Math.random()) * (max + 1));

function psGenerateFromSeed(seed) {
  psSfxRng = new PsRng((seed / 100) | 0);
  const generatorIndex = seed % 100;
  const generator = PS_GENERATORS[generatorIndex % PS_GENERATORS.length];
  const params = generator();
  params.seed = seed;
  psSfxRng = null;
  return params;
}

function psPickupCoin() {
  const p = psParams();
  p.wave_type = Math.floor(psFrnd(PS_SHAPE_COUNT));
  if (p.wave_type === PS_NOISE) {
    p.wave_type = PS_SQUARE;
  }
  p.p_base_freq = 0.4 + psFrnd(0.5);
  p.p_env_attack = 0.0;
  p.p_env_sustain = psFrnd(0.1);
  p.p_env_decay = 0.1 + psFrnd(0.4);
  p.p_env_punch = 0.3 + psFrnd(0.3);
  if (psRnd(1)) {
    p.p_arp_speed = 0.5 + psFrnd(0.2);
    const num = (psFrnd(7) | 1) + 1;
    const den = num + (psFrnd(7) | 1) + 2;
    p.p_arp_mod = num / den;
  }
  return p;
}

function psLaserShoot() {

  p.p_base_freq = 0.5 + psFrnd(0.5);
  p.p_freq_limit = Math.max(0.2, p.p_base_freq - 0.2 - psFrnd(0.6));
  p.p_freq_ramp = -0.15 - psFrnd(0.2);
  if (psRnd(2) === 0) {
    p.p_base_freq = 0.3 + psFrnd(0.6);
    p.p_freq_limit = psFrnd(0.1);
    p.p_freq_ramp = -0.35 - psFrnd(0.3);

  if (psRnd(1)) {

    p.p_duty_ramp = psFrnd(0.2);

    p.p_duty = 0.4 + psFrnd(0.5);
    p.p_duty_ramp = -psFrnd(0.7);

  p.p_env_attack = 0.0;
  p.p_env_sustain = 0.1 + psFrnd(0.2);
  p.p_env_decay = psFrnd(0.4);
  if (psRnd(1)) {

function psRenderBuffer(audioContext, ps) {
  let repTime;
  let fperiod;
  let period;
  let fmaxperiod;
  let fslide;
  let fdslide;
  let squareDuty;
  let squareSlide;
  let arpMod;
  let arpLimit;

  function repeat() {
    repTime = 0;
    fperiod = 100.0 / (ps.p_base_freq * ps.p_base_freq + 0.001);
    period = Math.floor(fperiod);
    fmaxperiod = 100.0 / (ps.p_freq_limit * ps.p_freq_limit + 0.001);
    fslide = 1.0 - Math.pow(ps.p_freq_ramp, 3.0) * 0.01;
    fdslide = -Math.pow(ps.p_freq_dramp, 3.0) * 0.000001;
    squareDuty = 0.5 - ps.p_duty * 0.5;
    squareSlide = -ps.p_duty_ramp * 0.00005;
    arpMod = ps.p_arp_mod >= 0.0
      ? 1.0 - Math.pow(ps.p_arp_mod, 2.0) * 0.9
      : 1.0 + Math.pow(ps.p_arp_mod, 2.0) * 10.0;
    arpLimit = Math.floor(Math.pow(1.0 - ps.p_arp_speed, 2.0) * 20000 + 32);
    if (ps.p_arp_speed === 1.0) {
      arpLimit = 0;
    }
  }

  repeat();

  let fltp = 0.0;
  let fltdp = 0.0;
  let fltw = Math.pow(ps.p_lpf_freq, 3.0) * 0.1;
  const fltwD = 1.0 + ps.p_lpf_ramp * 0.0001;
  let fltdmp = 5.0 / (1.0 + Math.pow(ps.p_lpf_resonance, 2.0) * 20.0) * (0.01 + fltw);
  if (fltdmp > 0.8) {
    fltdmp = 0.8;
  }
  let fltphp = 0.0;
  let flthp = Math.pow(ps.p_hpf_freq, 2.0) * 0.1;
  const flthpD = 1.0 + ps.p_hpf_ramp * 0.0003;
  let vibPhase = 0.0;
  const vibSpeed = Math.pow(ps.p_vib_speed, 2.0) * 0.01;
  const vibAmp = ps.p_vib_strength * 0.5;
  let envStage = 0;
  let envTime = 0;
  const envLength = [
    Math.floor(ps.p_env_attack * ps.p_env_attack * 100000.0),
    Math.floor(ps.p_env_sustain * ps.p_env_sustain * 100000.0),
    Math.floor(ps.p_env_decay * ps.p_env_decay * 100000.0),
  ];
  const envTotalLength = Math.max(1, envLength[0] + envLength[1] + envLength[2]);
  let fphase = Math.pow(ps.p_pha_offset, 2.0) * 1020.0;
  if (ps.p_pha_offset < 0.0) {
    fphase = -fphase;
  }
  let fdphase = Math.pow(ps.p_pha_ramp, 2.0);
  if (ps.p_pha_ramp < 0.0) {
    fdphase = -fdphase;
  }
  let iphase = Math.abs(Math.floor(fphase));
  let ipp = 0;
  const phaserBuffer = new Array(1024).fill(0.0);
  const noiseBuffer = Array.from({ length: 32 }, () => Math.random() * 2.0 - 1.0);
  let repLimit = Math.floor(Math.pow(1.0 - ps.p_repeat_speed, 2.0) * 20000 + 32);
  if (ps.p_repeat_speed === 0.0) {
    repLimit = 0;
  }
  const gain = Math.exp(ps.sound_vol) - 1;
  let sampleSum = 0;
  let numSummed = 0;
  const summands = Math.max(1, Math.floor(44100 / ps.sample_rate));
  const outputRate = ps.sample_rate < PS_SFX_MIN_SAMPLE_RATE ? PS_SFX_MIN_SAMPLE_RATE : ps.sample_rate;
  const expansion = ps.sample_rate < PS_SFX_MIN_SAMPLE_RATE ? Math.ceil(outputRate / ps.sample_rate) : 1;
  const bufferLength = Math.ceil(envTotalLength / summands) * expansion + expansion + 8;
  const audioBuffer = audioContext.createBuffer(1, bufferLength, outputRate);
  const buffer = audioBuffer.getChannelData(0);
  let bufferIndex = 0;
  let phase = 0;

  for (let t = 0; bufferIndex < buffer.length; t += 1) {
    if (repLimit !== 0 && ++repTime >= repLimit) {
      repeat();
    }
    if (arpLimit !== 0 && t >= arpLimit) {
      arpLimit = 0;
      fperiod *= arpMod;
    }
    fslide += fdslide;
    fperiod *= fslide;
    if (fperiod > fmaxperiod) {
      fperiod = fmaxperiod;
      if (ps.p_freq_limit > 0.0) {
        break;
      }
    }
    let rfperiod = fperiod;
    if (vibAmp > 0.0) {
      vibPhase += vibSpeed;
      rfperiod = fperiod * (1.0 + Math.sin(vibPhase) * vibAmp);
    }
    period = Math.max(8, Math.floor(rfperiod));
    squareDuty = Math.max(0.0, Math.min(0.5, squareDuty + squareSlide));
    envTime += 1;
    if (envTime > envLength[envStage]) {
      envTime = 1;
      envStage += 1;
      while (envStage < 3 && envLength[envStage] === 0) {
        envStage += 1;
      }
      if (envStage === 3) {
        break;
      }
    }
    const envVol = envStage === 0
      ? envTime / Math.max(1, envLength[0])
      : envStage === 1
        ? 1.0 + Math.pow(1.0 - envTime / Math.max(1, envLength[1]), 1.0) * 2.0 * ps.p_env_punch
        : 1.0 - envTime / Math.max(1, envLength[2]);
    fphase += fdphase;
    iphase = Math.min(1023, Math.abs(Math.floor(fphase)));
    if (flthpD !== 0.0) {
      flthp = Math.max(0.00001, Math.min(0.1, flthp * flthpD));
    }

    let sample = 0.0;
    for (let si = 0; si < 8; si += 1) {
      let subSample = 0.0;
      phase += 1;
      if (phase >= period) {
        phase %= period;
        if (ps.wave_type === PS_NOISE) {
          for (let i = 0; i < 32; i += 1) {
            noiseBuffer[i] = Math.random() * 2.0 - 1.0;
          }
        }
      }
      const fp = phase / period;
      if (ps.wave_type === PS_SQUARE) {
        subSample = fp < squareDuty ? 0.5 : -0.5;
      } else if (ps.wave_type === PS_SAWTOOTH) {
        subSample = 1.0 - fp * 2;
      } else if (ps.wave_type === PS_SINE) {
        subSample = Math.sin(fp * 2 * Math.PI);
      } else if (ps.wave_type === PS_NOISE) {
        subSample = noiseBuffer[Math.floor(phase * 32 / period)];
      } else if (ps.wave_type === PS_TRIANGLE) {
        subSample = Math.abs(1 - fp * 2) - 1;
      } else if (ps.wave_type === PS_BREAKER) {
        subSample = Math.abs(1 - fp * fp * 2) - 1;
      }
      const previousFltp = fltp;
      fltw = Math.max(0.0, Math.min(0.1, fltw * fltwD));
      if (ps.p_lpf_freq !== 1.0) {
        fltdp += (subSample - fltp) * fltw;
        fltdp -= fltdp * fltdmp;
      } else {
        fltp = subSample;
        fltdp = 0.0;
      }
      fltp += fltdp;
      fltphp += fltp - previousFltp;
      fltphp -= fltphp * flthp;
      subSample = fltphp;
      phaserBuffer[ipp & 1023] = subSample;
      subSample += phaserBuffer[(ipp - iphase + 1024) & 1023];
      ipp = (ipp + 1) & 1023;
      sample += subSample * envVol;
    }
    sampleSum += sample;
    if (++numSummed < summands) {
      continue;
    }
    numSummed = 0;
    const value = (sampleSum / summands / 8) * gain;
    sampleSum = 0;
    for (let i = 0; i < expansion && bufferIndex < buffer.length; i += 1) {
      buffer[bufferIndex] = value;
      bufferIndex += 1;
    }
  }

  return audioBuffer;
}

class PsRng {
  constructor(seed) {
    this.state = new PsRc4(JSON.stringify(seed));
  }

  uniform() {
    const bytes = 7;
    let output = 0;
    for (let i = 0; i < bytes; i += 1) {
      output *= 256;
      output += this.state.next();
    }
    return output / (Math.pow(2, bytes * 8) - 1);
  }
}

class PsRc4 {
  constructor(seed) {
    this.s = Array.from({ length: 256 }, (_, index) => index);
    this.i = 0;
    this.j = 0;
    this.mix(seed);
  }

  mix(seed) {
    const input = psStringBytes(seed);
    let j = 0;
    for (let i = 0; i < this.s.length; i += 1) {
      j = (j + this.s[i] + input[i % input.length]) % 256;
      this.swap(i, j);
    }
  }

  }
  if (counts.every((count) => count <= 2) && lengthBars >= 4) {
    counts[randomInt(rng, 0, lengthBars - 1)] = randomInt(rng, 4, 7);
  }
  return counts;
}

function generateRestBars(rng, noteDensity, rhythmOpenness) {
  const baseCount = noteDensity < 0.34 ? randomInt(rng, 1, 3) : noteDensity < 0.62 ? pick([0, 1], rng) : rng() < 0.18 ? 1 : 0;
  const count = rhythmOpenness > 0.66 ? Math.min(3, baseCount + 1) : baseCount;
  const candidates = [1, 2, 5, 6];
  const bars = new Set();
  while (bars.size < count) {
    bars.add(pick(candidates, rng));
  }
  return [...bars].sort((a, b) => a - b);
}

function generateContour(rng, intervalLeap, phraseIndex, offset, peakBar, peakDegree) {
  const contour = [];
  let current = clamp(randomInt(rng, 0, 2) + offset, 0, 6);
  let direction = pick([-1, 1], rng);
  const phrasePeakBar = clamp(peakBar + randomInt(rng, -1, 1), 1, 6);
  const phrasePeakDegree = clamp(peakDegree + Math.round(offset * 0.25) - phraseIndex, 3, 6);
  for (let bar = 0; bar < 8; bar += 1) {
    if (bar === phrasePeakBar) {
      current = phrasePeakDegree;
      contour.push(current);
      continue;
    }
    if (bar === 7) {
      contour.push(clamp(Math.round(offset * 0.2), 0, 2));
      continue;
    }
    if (rng() < 0.26) {
      direction *= -1;
    }
    const span = intervalLeap < 0.32
      ? pick([0, 1, 1, 2], rng)
      : intervalLeap > 0.72
        ? pick([1, 2, 3, 4], rng)
        : pick([0, 1, 2, 2, 3], rng);
    current = clamp(current + direction * span + pick([-1, 0, 0, 1], rng), 0, 6);
    contour.push(current);
  }
  return contour;
}

function generateForm(rng, formParameters, phraseCount) {
  const sections = [];
  let phrase = 0;
  let transpose = randomInt(rng, -1, 1);
  let intensity = round2(0.32 + rng() * 0.36);
  for (let index = 0; index < 4; index += 1) {
    if (index > 0) {
      if (rng() < formParameters.phraseChange) {
        phrase = (phrase + 1 + randomInt(rng, 0, Math.max(0, phraseCount - 2))) % phraseCount;
      }
      const transposeSpan = 1 + Math.round(formParameters.sectionChange * 3);
      transpose = clamp(transpose + randomInt(rng, -transposeSpan, transposeSpan), -4, 5);
      const intensitySpan = 0.16 + formParameters.intensityMotion * 0.58;
      intensity = round2(clamp(intensity + (rng() - 0.45) * intensitySpan, 0.18, 1));
    }
    const entryDelayBars = index === 0
      ? formParameters.openingSpace < 0.7 ? 0 : formParameters.openingSpace < 0.9 ? 4 : 8
      : index === 1 && sections[0].entryDelayBars === 8
        ? formParameters.openingSpace < 0.96 ? 0 : 4
        : 0;
    sections.push({
      entryDelayBars,
      phrase,
      transpose,
      intensity,
    });
  }
  const roles = sections.map((section, index) => roleFromSection(section, index));
  return {
    sections,
    roles,
  };
}

function roleFromSection(section, index) {
  if (section.entryDelayBars >= 8) {
    return "space";
  }
  if (section.entryDelayBars >= 4) {
    return "intro";
  }
  if (index === 3 && section.transpose < 0 && section.intensity < 0.58) {
    return "statementReturn";
  }
  if (index === 3 && section.transpose < -1) {
    return "resolution";
  }
  if (section.phrase === 1 && section.intensity > 0.68) {
    return "contrastVariation";
  }
  if (section.phrase === 1) {
    return "contrast";
  }
  if (section.intensity > 0.72) {
    return "development";
  }
  if (section.transpose > 0) {
    return "variation";
  }
  return "statement";
}

function formSignature(sections) {
  return sections
    .map((section) => `${section.entryDelayBars}:${section.phrase}:${section.transpose}:${Math.round(section.intensity * 9)}`)
    .join("/");
}

function buildMelodyForm(rng, scaleLength, phraseGrammar, hookGrammar) {
  const firstStart = randomInt(rng, 0, Math.min(2, scaleLength - 1));
  return {
    phrases: phraseGrammar.contours.map((_, index) => {
      const start = clamp(firstStart + phraseGrammar.degreeOffsets[index], 0, scaleLength - 1);
      return buildPhrase(rng, scaleLength, phraseGrammar, start, index);
    }),
    hook: buildHook(rng, scaleLength, phraseGrammar, hookGrammar, firstStart),
  };
}

function buildHook(rng, scaleLength, phraseGrammar, hookGrammar, startDegree) {
  const steps = hookGrammar.barNoteCounts.flatMap((count, bar) => (
    hookBarSteps(rng, count, bar * 16, hookGrammar.syncopation, bar === 0)
  )).sort((a, b) => a - b);
  const motif = [];
  let current = startDegree;
  let previousInterval = 0;
  const peakIndex = randomInt(rng, Math.max(1, Math.floor(steps.length * 0.35)), Math.max(1, Math.floor(steps.length * 0.72)));
  const answerStart = Math.max(1, Math.floor(steps.length * (0.45 + hookGrammar.durationContrast * 0.22)));
  for (let index = 0; index < steps.length; index += 1) {
    const bar = Math.floor(steps[index] / 16);
    if (index === 0) {
      current = startDegree;
    } else if (index === steps.length - 1) {
      current = phraseGrammar.finalCadenceDegree;
    } else if (index === peakIndex) {
      current = clamp(startDegree + hookGrammar.range, 0, scaleLength - 1);
    } else if (rng() < hookGrammar.repeatRate) {
      current = clamp(current + previousInterval, 0, scaleLength - 1);
    } else {
      const progress = index / Math.max(1, steps.length - 1);
      const target = index < answerStart
        ? startDegree + Math.round(hookGrammar.range * progress)
        : startDegree + hookGrammar.answerShift + Math.round(hookGrammar.range * 0.4);
      current = nextHookDegree(rng, current, target, scaleLength, hookGrammar);
    }
    if (motif.length >= 2 && current === motif[motif.length - 1].n && current === motif[motif.length - 2].n) {
      current = clamp(current + pick(current >= scaleLength - 2 ? [-1, -1, 0] : [-1, 1, 1], rng), 0, scaleLength - 1);
    }
    previousInterval = motif.length === 0 ? pick([-1, 0, 1], rng) : clamp(current - motif[motif.length - 1].n, -2, 2);
    motif.push({
      s: steps[index] % 16,
      b: bar,
      d: hookDuration(steps, index, hookGrammar),
      n: current,
      a: hookAccent(index, steps.length, steps[index]),
    });
  }
  const cycleCount = Math.max(1, Math.floor(8 / hookGrammar.lengthBars));
  const restCycles = Array.from({ length: cycleCount }, (_, index) => index > 0 && rng() < hookGrammar.restRate);
  if (cycleCount > 1 && restCycles.slice(1).every(Boolean)) {
    restCycles[randomInt(rng, 1, cycleCount - 1)] = false;
  }
  const variantShifts = Array.from({ length: cycleCount }, (_, index) => {
    if (index === 0) {
      return 0;
    }
    const raw = Math.round((rng() - 0.42) * (1 + hookGrammar.lift * 4));
    return clamp(raw, -2, 3);
  });
  return {
    lengthBars: hookGrammar.lengthBars,
    startBar: hookGrammar.startBar,
    motif,
    restCycles,
    variantShifts,
    score: {
      lengthBars: hookGrammar.lengthBars,
      startBar: hookGrammar.startBar,
      barNoteCounts: hookGrammar.barNoteCounts,
      steps: motif.map((item) => item.b * 16 + item.s),
      degrees: motif.map((item) => item.n),
      accents: motif.map((item) => item.a),
      restCycles,
      variantShifts,
    },
  };
}

function hookBarSteps(rng, count, barStart, syncopation, forceStart) {
  if (count <= 0) {
    return [];
  }
  const steps = forceStart ? [barStart + pick([0, 1, 2], rng)] : [];
  while (steps.length < count) {
    const weights = Array.from({ length: 16 }, (_, step) => {
      const absolute = barStart + step;
      if (steps.includes(absolute)) {
        return 0;
      }
      const nearExisting = steps.some((used) => Math.abs(used - absolute) <= 1);
      const offbeat = step % 4 === 1 || step % 4 === 3;
      const downbeat = step === 0 || step === 8;
      const edgeWeight = downbeat ? 1.2 - syncopation * 0.35 : 1;
      const syncWeight = offbeat ? 0.72 + syncopation * 1.4 : edgeWeight;
      return syncWeight * (nearExisting ? 0.42 : 1);
    });
    steps.push(barStart + weightedIndex(weights, rng));
  }
  return steps.sort((a, b) => a - b);
}

function nextHookDegree(rng, current, target, scaleLength, hookGrammar) {
  const direction = Math.sign(target - current);
  const step = direction === 0
    ? pick([-1, 0, 1], rng)
    : direction * pick(hookGrammar.range > 4 ? [1, 1, 2, 3] : [1, 1, 1, 2], rng);
  return clamp(current + step, 0, scaleLength - 1);
}

function hookDuration(steps, index, hookGrammar) {
  const current = steps[index];
  const next = steps[index + 1] ?? current + 6;
  const maxDuration = hookGrammar.durationContrast > 0.62 ? 8 : 6;
  return clamp(Math.min(maxDuration, next - current), 1, maxDuration);
}

function hookAccent(index, count, step) {
  const edge = index === 0 || index === count - 1 ? 0.16 : 0;
  const downbeat = step % 16 === 0 || step % 16 === 8 ? 0.08 : 0;
  return round2(clamp(0.92 + edge + downbeat, 0.84, 1.24));
}

function buildPhrase(rng, scaleLength, phraseGrammar, startDegree, phraseIndex) {
  const phrase = [];
  let current = startDegree;
  const contour = phraseGrammar.contours[phraseIndex];
  for (let bar = 0; bar < 8; bar += 1) {
    const cadence = bar === 3 || bar === 7;
    const density = phraseDensity(phraseGrammar, bar, cadence);
    const notes = [];
    if (density === 0) {
      phrase.push(notes);
      continue;
    }
    const rhythm = pickRhythm(rng, phraseGrammar, density, cadence, bar);
    for (let i = 0; i < rhythm.length; i += 1) {
      const target = contour[bar] + (i === rhythm.length - 1 ? 0 : pick([-1, 0, 1], rng));
      current = nextPhraseDegree(rng, current, target, scaleLength, phraseGrammar);
      notes.push({
        s: rhythm[i],
        d: noteDuration(phraseGrammar, i, cadence, rhythm.length),
        n: current,
        a: noteAccent(phraseGrammar, rhythm[i], i, cadence, rhythm.length),
      });
    }
    if (cadence) {
      notes[notes.length - 1].n = bar === 7 ? phraseGrammar.finalCadenceDegree : phraseGrammar.midCadenceDegrees[phraseIndex];
      notes[notes.length - 1].d += 2;
      notes[notes.length - 1].a = 1.18;
    }
    phrase.push(notes);
  }
  return phrase;
}

function phraseDensity(phraseGrammar, bar, cadence) {
  if (cadence) {
    return 1;
  }
  if (phraseGrammar.restBars.includes(bar)) {
    return 0;
  }
  const base = 1 + Math.round(phraseGrammar.noteDensity * 6);
  const rhythmOffset = phraseGrammar.rhythmOpenness > 0.66 ? -1 : phraseGrammar.noteDensity > 0.78 ? 1 : 0;
  const barOffset = bar % 3 === 1 ? -1 : bar % 4 === 2 ? 1 : 0;
  return clamp(base + rhythmOffset + barOffset, 1, 6);
}

function pickRhythm(rng, phraseGrammar, density, cadence, bar) {
  if (cadence) {
    return [pick([4, 5, 6, 7], rng)];
  }
  if (phraseGrammar.pulseRegularity > 0.8) {
    return pickEvenRhythm(rng, phraseGrammar, density);
  }
  const burstCount = density >= 5 && phraseGrammar.runAmount > 0.58 ? randomInt(rng, 2, Math.min(5, density)) : 0;
  const clusterCenter = clamp(Math.round((bar % 4) * 3.4 + rng() * 4), 1, 14);
  const steps = [];
  if (burstCount > 0) {
    const start = clamp(clusterCenter - randomInt(rng, 0, 2), 0, 14);
    const stride = phraseGrammar.syncopation > 0.58 ? pick([1, 1, 2], rng) : 1;
    for (let index = 0; index < burstCount; index += 1) {
      const step = clamp(start + index * stride + (rng() < 0.22 ? 1 : 0), 0, 15);
      if (!steps.includes(step)) {
        steps.push(step);
      }
    }
  }
  while (steps.length < density) {
    const step = weightedRhythmStep(rng, phraseGrammar, steps, clusterCenter);
    if (!steps.includes(step)) {
      steps.push(step);
    }
  }
  return steps.sort((a, b) => a - b);
}

function pickEvenRhythm(rng, phraseGrammar, density) {
  const spacing = 16 / density;
  const phase = phraseGrammar.rhythmOpenness > 0.66 ? rng() * spacing * 0.4 : rng() * spacing;
  const maxJitter = phraseGrammar.syncopation * Math.min(2.5, spacing * 0.45);
  const steps = [];
  for (let index = 0; index < density; index += 1) {
    const jitter = (rng() - 0.5) * maxJitter;
    const step = clamp(Math.round(phase + index * spacing + jitter), 0, 15);
    if (!steps.includes(step)) {
      steps.push(step);
    }
  }
  return steps.sort((a, b) => a - b);
}

function weightedRhythmStep(rng, phraseGrammar, usedSteps, clusterCenter) {
  const weights = Array.from({ length: 16 }, (_, step) => {
    if (usedSteps.includes(step)) {
      return 0;
    }
    const offbeat = step % 4 === 1 || step % 4 === 3;
    const beat = step % 4 === 0;
    const syncWeight = offbeat ? 0.7 + phraseGrammar.syncopation * 1.6 : beat ? 1.25 - phraseGrammar.syncopation * 0.5 : 1;
    const distance = Math.abs(step - clusterCenter);
    const clusterWeight = 1 + (1 - phraseGrammar.pulseRegularity) * Math.max(0, 5 - distance) * 0.45;
    const spacingPenalty = usedSteps.some((used) => Math.abs(used - step) <= 1) && phraseGrammar.runAmount < 0.44 ? 0.28 : 1;
    return syncWeight * clusterWeight * spacingPenalty;
  });
  const total = weights.reduce((sum, weight) => sum + weight, 0);
  let ticket = rng() * total;
  for (let step = 0; step < weights.length; step += 1) {
    ticket -= weights[step];
    if (ticket <= 0) {
      return step;
    }
  }
  return 15;
}

function noteAccent(phraseGrammar, step, index, cadence, count) {
  if (cadence) {
    return 1.18;
  }
  const position = step === 0 || step === 8 ? 0.1 : step % 4 === 0 ? 0.04 : 0;
  const phraseEdge = index === 0 || index === count - 1 ? 0.08 : 0;
  const shortRun = count >= 5 && phraseGrammar.runAmount > 0.5 ? (index % 2 === 0 ? 0.08 : -0.03) : 0;
  return round2(clamp(0.88 + position + phraseEdge + shortRun, 0.72, 1.22));
}

function noteDuration(phraseGrammar, index, cadence, count) {
  if (cadence) {
    return phraseGrammar.cadenceHoldSteps;
  }
  if (phraseGrammar.rhythmOpenness > 0.66) {
    return count === 1 ? 8 : index === 0 ? 5 : 4;
  }
  if (count >= 6) {
    return 1;
  }
  if (count >= 4) {
    return 2;
  }
  if (phraseGrammar.noteDensity > 0.72 || phraseGrammar.syncopation > 0.58) {
    return count === 1 ? 4 : 2;
  }
  return count === 1 ? 5 : 3;
}

function nextPhraseDegree(rng, current, target, scaleLength, phraseGrammar) {
  if (phraseGrammar.intervalLeap > 0.72 && rng() < 0.32) {
    return clamp(target + pick([-2, 2, 3], rng), 0, scaleLength - 1);
  }
  const direction = Math.sign(target - current);
  const steps = phraseGrammar.intervalLeap < 0.32 ? [1, 1, 1, 2] : [1, 1, 2, 3];
  const step = direction === 0 ? pick([-1, 0, 1], rng) : direction * pick(steps, rng);
  return clamp(current + step, 0, scaleLength - 1);
}

function addHarmony(events, barStart, chord, type, instruments, localBar) {
  if (type.partPresence.harmony < 0.18) {
    return;
  }
  if (!harmonyActive(type, localBar)) {
    return;
  }
  const level = 0.46 + type.partPresence.harmony * 0.68;
  if (type.harmony === "pad") {
    const step = type.leadPresence > 0.58 ? 2 : 0;
    const durationSteps = Math.round(7 + type.harmonyPresence * 5);
    const velocity = 0.1 - type.leadPresence * 0.035;
    events.push({ track: "chord", step: barStart + step, durationSteps, notes: voiceChord(chord), instrument: instruments.harmony, velocity: velocity * level });
    return;
  }
  if (type.harmony === "arp") {
    const steps = arpSteps(type, localBar);
    const order = arpOrder(type, localBar);
    const voiced = voiceChord(chord);
    const velocity = (0.085 - type.leadPresence * 0.025) * level * (0.82 + type.harmonyMotion * 0.22);
    for (let i = 0; i < steps.length; i += 1) {
      events.push({ track: "chord", step: barStart + steps[i], durationSteps: type.harmonyMotion > 0.72 ? 1 : 2, notes: [voiced[order[i % order.length]]], instrument: instruments.harmony, velocity });
    }
    return;
  }
  const velocity = 0.095 - type.leadPresence * 0.025;
  for (const step of [0, 10]) {
    events.push({ track: "chord", step: barStart + step, durationSteps: 3, notes: voiceChord(chord).slice(step === 0 ? 0 : 1), instrument: "organ", velocity: velocity * level });
  }
}

function harmonyActive(type, localBar) {
  const presence = type.harmonyPresence;
  const space = type.harmonySpace;
  if (presence < 0.26) {
    return localBar === 0;
  }
  if (presence < 0.46) {
    return localBar === 0 || localBar === 4;
  }
  if (presence < 0.66) {
    return localBar % 2 === 0;
  }
  if (type.harmony === "arp" && space > 0.68) {
    return ![1, 5].includes(localBar);
  }
  if (type.harmony === "arp" && space > 0.46) {
    return localBar % 4 !== 1;
  }
  return true;
}

function arpSteps(type, localBar) {
  const sparse = type.harmonySpace > 0.62;
  const count = sparse
    ? type.harmonyPresence < 0.72 ? 2 : 3
    : type.harmonyPresence < 0.42 ? 2 : type.harmonyPresence < 0.68 ? 3 : 4;
  const phase = type.harmonyMotion < 0.34
    ? 0
    : type.harmonyMotion < 0.68
      ? (localBar % 2) * 2
      : [0, 1, 3, 2][localBar % 4];
  const candidates = type.harmonySpace > 0.72
    ? [phase, phase + 5, phase + 11, phase + 14]
    : type.harmonyMotion > 0.72
      ? [phase + 1, phase + 4, phase + 9, phase + 13]
      : [phase, phase + 4, phase + 9, phase + 12];
  return candidates
    .map((step) => clamp(step, 0, 15))
    .filter((step, index, steps) => index < count && steps.indexOf(step) === index)
    .sort((a, b) => a - b);
}

function arpOrder(type, localBar) {
  if (type.harmonyMotion > 0.76) {
    return localBar % 2 === 0 ? [0, 2, 1, 2] : [1, 0, 2, 1];
  }
  if (type.harmonySpace > 0.62) {
    return localBar % 2 === 0 ? [0, 2, 1] : [1, 2, 0];
  }
  return localBar % 2 === 0 ? [0, 1, 2, 1] : [1, 2, 0, 2];
}

function addBass(events, barStart, chord, type, instruments, localBar) {
  if (type.partPresence.bass < 0.18) {
    return;
  }
  const phraseBar = localBar % 4;
  const leadDucking = 1 - type.leadPresence * 0.24;
  const presenceLevel = 0.62 + type.partPresence.bass * 0.54;
  if (type.bass === "sparse") {
    const sparse = [
      [{ step: 2, degree: 0, duration: 8, velocity: 0.16 }],
      [],
      [{ step: 8, degree: 0, duration: 5, velocity: 0.14 }],
      [{ step: 12, degree: 2, duration: 2, velocity: 0.14 }],
    ][phraseBar];
    for (const hit of sparse) {
      events.push({ track: "bass", step: barStart + hit.step, durationSteps: hit.duration, notes: [chord[hit.degree] - 24], instrument: instruments.bass, velocity: hit.velocity * leadDucking * presenceLevel });
    }
    return;
  }
  if (type.bass === "groove") {
    const pattern = localBar % 2 === 0 ? [[2, 0], [6, 2], [10, 0], [14, 1]] : [[3, 0], [8, 1], [12, 2]];
    for (const [step, degree] of pattern) {
      events.push({ track: "bass", step: barStart + step, durationSteps: 2, notes: [chord[degree] - 24], instrument: instruments.bass, velocity: 0.3 * leadDucking * presenceLevel });
    }
    return;
  }
  events.push({ track: "bass", step: barStart + 2, durationSteps: 9, notes: [chord[0] - 24], instrument: instruments.bass, velocity: 0.16 * leadDucking * presenceLevel });
  if (phraseBar === 3) {
    events.push({ track: "bass", step: barStart + 12, durationSteps: 2, notes: [chord[2] - 24], instrument: instruments.bass, velocity: 0.19 * leadDucking * presenceLevel });
  }
}

function addDrums(events, barStart, type, drums, localBar) {
  if (type.partPresence.drums < 0.18) {
    return;
  }
  const full = type.drums === "full";
  const pattern = (full ? drums.score.full : drums.score.light)[localBar % 8];
  const presenceLevel = 0.58 + type.partPresence.drums * 0.56;
  for (const hit of pattern.kick) {
    events.push({ track: "drums", step: barStart + hit.step, durationSteps: 1, notes: ["kick"], instrument: "kick", velocity: hit.velocity * presenceLevel });
  }
  for (const hit of pattern.snare) {
    events.push({ track: "drums", step: barStart + hit.step, durationSteps: 1, notes: ["snare"], instrument: "snare", velocity: hit.velocity * presenceLevel });
  }
  for (const hit of pattern.hat) {
    events.push({ track: "drums", step: barStart + hit.step, durationSteps: 1, notes: ["hat"], instrument: "hat", velocity: hit.velocity * presenceLevel });
  }
}

function addMelody(events, barStart, tonic, scale, chordDegree, type, form, instruments, section, bar, localBar, tone) {
  if (type.partPresence.lead < 0.18) {
    return;
  }
  if (bar < form.hook.startBar) {
    return;
  }
  const leadLocalBar = (bar - form.hook.startBar) % 8;
  const octave = tone > 0.68 ? 24 : 12;
  const focusLevel = type.focus === "lead" ? 1 : type.focus === "groove" ? 0.84 : type.focus === "space" ? 0.78 : 0.9;
  const velocity = (0.1 + type.partPresence.lead * 0.17) * (0.78 + section.intensity * 0.34) * focusLevel;
  const melodyItems = hookItemsForBar(form.hook, section, leadLocalBar, type);
  for (const item of melodyItems) {
    const cadence = leadLocalBar === 7 && item.end;
    const degree = cadence ? chordDegree + section.transpose : item.n + section.transpose;
    const duration = item.d + (cadence ? 2 : 0);
    events.push({
      track: "lead",
      step: barStart + item.s,
      durationSteps: duration,
      notes: [noteAtDegree(tonic, scale, degree) + octave],
      instrument: instruments.melody,
      velocity: velocity * (item.a ?? 1),
    });
  }
}

function hookItemsForBar(hook, section, localBar, type) {
  const cycle = Math.floor(localBar / hook.lengthBars);
  const cycleBar = localBar % hook.lengthBars;
  const restIndex = (cycle + section.phrase) % hook.restCycles.length;
  if (type.leadPresence < 0.28 && cycle > 0) {
    return [];
  }
  if (type.leadPresence < 0.42 && cycle > 0 && cycle % 2 === 1) {
    return [];
  }
  if (cycle > 0 && hook.restCycles[restIndex] && section.intensity < 0.74) {
    return [];
  }
  const shift = hook.variantShifts[(cycle + section.phrase) % hook.variantShifts.length];
  const items = hook.motif
    .filter((item) => item.b === cycleBar)
    .map((item, index, filtered) => ({
      ...item,
      n: item.n + shift,
      end: cycleBar === 1 && index === filtered.length - 1,
    }));
  if (items.length <= 2 || type.leadDensity > 0.72) {
    return items;
  }
  const keepRatio = clamp(0.24 + type.leadDensity * 0.7 + section.intensity * 0.12, 0.18, 1);
  const keepCount = Math.max(1, Math.min(items.length, Math.ceil(items.length * keepRatio)));
  const stride = items.length > keepCount ? Math.max(1, Math.floor(items.length / keepCount)) : 1;
  const start = (cycle + section.phrase) % Math.max(1, stride);
  const selected = [];
  for (let index = start; index < items.length && selected.length < keepCount; index += stride) {
    selected.push(items[index]);
  }
  if (selected.length < keepCount) {
    selected.push(...items.filter((item) => !selected.includes(item)).slice(0, keepCount - selected.length));

function addCounter(events, barStart, tonic, scale, type, instruments, section, localBar, tone) {

    return;
  }

function phraseForSection(form, section, localBar) {
  const phrase = form.phrases[section.phrase % form.phrases.length];

function midiToFrequency(note) {
  return 440 * 2 ** ((note - 69) / 12);
}

function createPlayer(audioContext, playbackScore) {
  let timer = null;
  let loopStart = 0;
  const scheduled = new Set();
  const activeSources = new Set();
  const lookaheadMs = 80;
  const scheduleAheadSeconds = 0.28;
  const stepSeconds = (60 / playbackScore.transport.bpm) * playbackScore.transport.stepDurationBeats;
  const loopSeconds = playbackScore.transport.loopSteps * stepSeconds;

  function start(progress = 0) {
    stop();
    scheduled.clear();
    loopStart = audioContext.currentTime + 0.05 - progress * loopSeconds;
    timer = setInterval(schedule, lookaheadMs);
    schedule();
  }

  function stop() {
    if (timer !== null) {
      clearInterval(timer);
      timer = null;
    }
    for (const source of activeSources) {
      try {
        source.stop();
      } catch {
        // Stopped sources can be ignored.
      }
      source.disconnect();
    }
    activeSources.clear();
    scheduled.clear();
  }

  function schedule() {
    const now = audioContext.currentTime;
    const firstLoop = Math.max(0, Math.floor((now - loopStart) / loopSeconds));
    for (const loopIndex of [firstLoop, firstLoop + 1]) {
      const candidateLoopStart = loopStart + loopIndex * loopSeconds;
      for (let eventIndex = 0; eventIndex < playbackScore.events.length; eventIndex += 1) {
        const event = playbackScore.events[eventIndex];
        const startsAt = candidateLoopStart + event.step * stepSeconds;
        const key = `${loopIndex}:${eventIndex}`;
        if (!scheduled.has(key) && startsAt >= now && startsAt < now + scheduleAheadSeconds) {
          scheduled.add(key);
          playEvent(audioContext, playbackScore, event, startsAt, event.durationSteps * stepSeconds, activeSources);
        }
      }
    }
    for (const key of scheduled) {
      const [loopIndexText] = key.split(":");
      const loopIndex = Number(loopIndexText);
      if (loopStart + loopIndex * loopSeconds < now - loopSeconds) {
        scheduled.delete(key);
      }
    }
  }

  function loopProgress() {
    if (timer === null) {
      return 0;
    }
    const elapsed = Math.max(0, audioContext.currentTime - loopStart);
    return (elapsed % loopSeconds) / loopSeconds;
  }

  return { start, stop, loopProgress };
}

function playEvent(audioContext, playbackScore, event, startsAt, duration, activeSources) {
  const timbre = playbackScore.timbres[event.timbre] ?? { kind: event.timbre };
  const instrument = timbre?.kind || event.timbre;
  const playbackTone = playbackScore.mix.playbackTone;
  const volume = playbackScore.mix.volume;
  const eventTone = toneForEvent(event, playbackTone);
  const gain = eventTone.gain * volume;
  for (const note of event.notes) {
    if (typeof note === "number") {
      if (isPlucked(instrument)) {
        playPluck(audioContext, note, startsAt, duration, instrument, event.velocity * gain, eventTone.filter, activeSources);
      } else {
        playTone(audioContext, note, startsAt, duration, instrument, event.velocity * gain, eventTone.filter, activeSources);
      }
    } else {
      playNoise(audioContext, startsAt, duration, timbre, event.velocity * gain, eventTone.filter, activeSources);
    }

function toneForEvent(event, tone) {
  if (event.track === "bass") {
    return { gain: tone.bassGain, filter: tone.bassFilter };
  }
  if (event.track === "lead" || event.track === "counter") {
    return { gain: tone.leadGain, filter: tone.toneFilter };
  }
  if (event.track === "chord") {
    return { gain: tone.harmonyGain, filter: tone.toneFilter };
  }
  if (event.timbre === "hat" || event.timbre === "snare") {
    return { gain: tone.highPercussionGain, filter: tone.noiseFilter };
  }
  return { gain: tone.lowPercussionGain, filter: tone.bassFilter };

function playTone(audioContext, midiNote, startsAt, duration, instrument, velocity, filterMultiplier, activeSources) {
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  oscillator.type = waveformFor(instrument);
  oscillator.frequency.setValueAtTime(midiToFrequency(midiNote), startsAt);
  const envelope = envelopeFor(instrument, duration);
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(envelope.filter * filterMultiplier, startsAt);
  gain.gain.setValueAtTime(0.0001, startsAt);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, velocity), startsAt + envelope.attack);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, velocity * envelope.sustain), startsAt + Math.max(envelope.attack + 0.01, duration * 0.5));
  gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + Math.max(0.04, duration));
  oscillator.connect(filter).connect(gain).connect(audioContext.destination);
  trackSource(oscillator, activeSources);
  oscillator.start(startsAt);
  oscillator.stop(startsAt + duration + 0.05);
  if (instrument === "breathy-flute") {
    playBreathNoise(audioContext, startsAt, duration, velocity * 0.18, filterMultiplier, activeSources);
  }
  if (instrument === "chip-lead") {
    playChipClick(audioContext, startsAt, velocity * 0.22, filterMultiplier, activeSources);

function playPluck(audioContext, midiNote, startsAt, duration, instrument, velocity, filterMultiplier, activeSources) {
  const sampleRate = audioContext.sampleRate;
  const seconds = Math.max(0.15, Math.min(1.5, duration + 0.25));
  const samples = Math.floor(sampleRate * seconds);
  const buffer = audioContext.createBuffer(1, samples, sampleRate);
  const data = buffer.getChannelData(0);
  const frequency = midiToFrequency(midiNote);
  const decay = pluckDecayFor(instrument);
  const bright = pluckBrightnessFor(instrument);
  const bodyMix = instrument === "harp" || instrument === "nylon" ? 0.66 : instrument === "marimba" ? 0.48 : 0.55;
  const upperMix = instrument === "kalimba" || instrument === "music-box" ? 0.34 : instrument === "harp" ? 0.18 : 0.24;
  const rng = mulberry32(hashSeed(`${instrument}:${midiNote}:${duration}`));
  for (let i = 0; i < samples; i += 1) {
    const t = i / sampleRate;
    const env = Math.exp(-decay * t);
    const body = Math.sin(2 * Math.PI * frequency * t);
    const detunedBody = Math.sin(2 * Math.PI * frequency * 1.006 * t) * 0.18;
    const upper = Math.sin(2 * Math.PI * frequency * (instrument === "marimba" ? 2.7 : 2.01) * t) * bright;
    const click = Math.exp(-90 * t) * Math.sin(2 * Math.PI * frequency * 7 * t) * bright * 0.35;
    const wood = instrument === "marimba" ? Math.exp(-28 * t) * Math.sin(2 * Math.PI * frequency * 0.52 * t) * 0.28 : 0;
    const scrape = (rng() * 2 - 1) * Math.exp(-38 * t) * (instrument === "nylon" || instrument === "harp" ? 0.035 : 0.018);
    data[i] = (body * bodyMix + detunedBody + upper * upperMix + click + wood + scrape) * env;
  }
  const source = audioContext.createBufferSource();
  const gain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = pluckFilterFor(instrument) * filterMultiplier;
  gain.gain.setValueAtTime(Math.max(0.0001, velocity), startsAt);
  gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + seconds);
  source.buffer = buffer;
  source.connect(filter).connect(gain).connect(audioContext.destination);
  trackSource(source, activeSources);
  source.start(startsAt);
}

function playBreathNoise(audioContext, startsAt, duration, velocity, filterMultiplier, activeSources) {
  const samples = Math.max(1, Math.floor(audioContext.sampleRate * Math.max(0.04, duration)));
  const buffer = audioContext.createBuffer(1, samples, audioContext.sampleRate);
  const data = buffer.getChannelData(0);
  const rng = mulberry32(hashSeed(`breath:${startsAt}:${duration}`));
  for (let i = 0; i < samples; i += 1) {
    const t = i / audioContext.sampleRate;
    data[i] = (rng() * 2 - 1) * Math.exp(-2.4 * t);
  }
  const source = audioContext.createBufferSource();
  const gain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = 1800 * filterMultiplier;
  filter.Q.value = 0.8;
  gain.gain.setValueAtTime(0.0001, startsAt);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, velocity), startsAt + 0.035);
  gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + Math.max(0.06, duration));

  source.connect(filter).connect(gain).connect(audioContext.destination);

function playChipClick(audioContext, startsAt, velocity, filterMultiplier, activeSources) {
  const samples = Math.max(1, Math.floor(audioContext.sampleRate * 0.018));
  const buffer = audioContext.createBuffer(1, samples, audioContext.sampleRate);
  const data = buffer.getChannelData(0);

    const t = i / audioContext.sampleRate;
    data[i] = Math.sign(Math.sin(2 * Math.PI * 3600 * t)) * Math.exp(-180 * t);
  }
  const source = audioContext.createBufferSource();
  const gain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  filter.type = "highpass";
  filter.frequency.value = 1800 * filterMultiplier;
  gain.gain.setValueAtTime(Math.max(0.0001, velocity), startsAt);
  gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + 0.018);
  source.buffer = buffer;
  source.connect(filter).connect(gain).connect(audioContext.destination);

function playNoise(audioContext, startsAt, duration, timbre, velocity, filterMultiplier, activeSources) {
  const instrument = timbre.kind;
  if (instrument === "kick") {
    playKick(audioContext, startsAt, timbre, velocity, filterMultiplier, activeSources);
    return;
  }
  const decay = instrument === "hat" ? timbre.decay : timbre.decay ?? duration;

  const data = buffer.getChannelData(0);
  const rng = mulberry32(hashSeed(`${instrument}:${startsAt}:${duration}:${timbre.filter ?? 0}`));

    const t = i / audioContext.sampleRate;
    const env = Math.exp(-t * (instrument === "hat" ? 42 : 16));

  source.connect(filter).connect(gain).connect(audioContext.destination);
  trackSource(source, activeSources);
  source.start(startsAt);
}

function playKick(audioContext, startsAt, timbre, velocity, filterMultiplier, activeSources) {
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  const duration = Math.max(0.06, timbre.decay ?? 0.14);
  oscillator.type = "sine";
  oscillator.frequency.setValueAtTime(timbre.pitchStart ?? 64, startsAt);
  oscillator.frequency.exponentialRampToValueAtTime(Math.max(20, timbre.pitchEnd ?? 36), startsAt + duration);

  filter.frequency.value = 700 * filterMultiplier;
  gain.gain.setValueAtTime(Math.max(0.0001, velocity), startsAt);
  gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + duration);
  oscillator.connect(filter).connect(gain).connect(audioContext.destination);
  trackSource(oscillator, activeSources);
  oscillator.start(startsAt);
  oscillator.stop(startsAt + duration + 0.03);
  playChipClick(audioContext, startsAt, velocity * (timbre.click ?? 0.12), filterMultiplier, activeSources);

function waveformFor(instrument) {
  if (instrument === "flute" || instrument === "breathy-flute" || instrument === "glass" || instrument === "sine-bell") {
    return "sine";
  }
  if (instrument === "pad" || instrument === "organ" || instrument === "reed" || instrument === "saw-lead") {
    return "sawtooth";
  }
  if (instrument === "round-bass" || instrument === "soft-square" || instrument === "triangle-lead") {
    return "triangle";
  }
  return "square";
}

function envelopeFor(instrument, duration) {
  if (instrument === "breathy-flute") {
    return { attack: 0.075, sustain: 0.54, filter: 1050 };
  }
  if (instrument === "flute") {
    return { attack: 0.055, sustain: 0.62, filter: 1150 };
  }
  if (instrument === "clarinet") {
    return { attack: 0.026, sustain: 0.58, filter: 920 };
  }
  if (instrument === "reed") {
    return { attack: 0.016, sustain: 0.48, filter: 1450 };
  }
  if (instrument === "sine-bell") {
    return { attack: 0.008, sustain: 0.36, filter: 3600 };
  }
  if (instrument === "chip-lead") {
    return { attack: 0.004, sustain: 0.2, filter: 5200 };
  }
  if (instrument === "triangle-lead") {
    return { attack: 0.012, sustain: 0.42, filter: 2400 };
  }
  if (instrument === "saw-lead") {
    return { attack: 0.01, sustain: 0.34, filter: 1700 };
  }
  if (instrument === "soft-square") {
    return { attack: 0.01, sustain: 0.34, filter: 2100 };
  }
  if (instrument === "pad") {
    return { attack: 0.06, sustain: 0.56, filter: 900 };
  }
  if (instrument === "organ") {
    return { attack: 0.02, sustain: 0.72, filter: 1300 };
  }
  if (instrument === "round-bass" || instrument === "wood-bass") {
    return { attack: 0.014, sustain: 0.65, filter: 650 };
  }
  if (instrument === "kick") {
    return { attack: 0.004, sustain: 0.18, filter: 600 };

function isPlucked(instrument) {
  return instrument === "nylon"
    || instrument === "harp"
    || instrument === "kalimba"
    || instrument === "music-box"
    || instrument === "marimba"
    || instrument === "pluck"
    || instrument === "muted-pluck";
}

function pluckDecayFor(instrument) {
  if (instrument === "nylon") {
    return 4.8;
  }
  if (instrument === "harp") {
    return 5.4;
  }
  if (instrument === "kalimba" || instrument === "music-box") {
    return 6.2;
  }
  if (instrument === "marimba") {
    return 8;
  }
  return 6.2;
}

function pluckBrightnessFor(instrument) {
  if (instrument === "music-box" || instrument === "kalimba") {
    return 0.72;
  }
  if (instrument === "marimba") {
    return 0.34;
  }
  if (instrument === "nylon") {
    return 0.28;
  }
  if (instrument === "harp") {
    return 0.54;
  }
  return 0.5;
}

function pluckFilterFor(instrument) {
  if (instrument === "nylon") {
    return 1500;
  }
  if (instrument === "marimba") {
    return 2200;
  }
  if (instrument === "harp") {
    return 3100;
  }
  if (instrument === "kalimba" || instrument === "music-box") {
    return 4200;
  }
  return 2600;
}

function trackSource(source, activeSources) {
  activeSources.add(source);
  source.addEventListener("ended", () => {
    activeSources.delete(source);
    source.disconnect();
  }, { once: true });
}

function buildTriad(tonic, scale, degree) {
  return [noteAtDegree(tonic, scale, degree), noteAtDegree(tonic, scale, degree + 2), noteAtDegree(tonic, scale, degree + 4)];
}

function voiceChord(chord) {
  return chord.map((note) => note + 12);
}

function noteAtDegree(tonic, scale, degree) {
  const octave = Math.floor(degree / scale.length) * 12;
  const index = ((degree % scale.length) + scale.length) % scale.length;
  return tonic + octave + scale[index];
}

function rotate(items, offset) {
  const copy = [...items];
  return copy.slice(offset).concat(copy.slice(0, offset));
}

function pick(items, rng) {
  return items[Math.floor(rng() * items.length)];
}

function weightedPick(candidates, rng) {
  const total = candidates.reduce((sum, candidate) => sum + candidate.weight, 0);
  let ticket = rng() * total;
  for (const candidate of candidates) {
    ticket -= candidate.weight;
    if (ticket <= 0) {
      return candidate.item;
    }
  }
  return candidates[candidates.length - 1].item;
}

function weightedIndex(weights, rng) {
  const total = weights.reduce((sum, weight) => sum + weight, 0);
  let ticket = rng() * total;
  for (let index = 0; index < weights.length; index += 1) {
    ticket -= weights[index];
    if (ticket <= 0) {
      return index;
    }
  }
  return weights.length - 1;
}

function randomInt(rng, min, max) {
  return Math.floor(rng() * (max - min + 1)) + min;
}

function randomIntFromUnit(value, min, max) {
  return Math.round(min + clamp(value, 0, 1) * (max - min));
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function round2(value) {
  return Math.round(value * 100) / 100;
}

function hashSeed(seed) {
  let hash = 2166136261;
  for (let i = 0; i < seed.length; i += 1) {
    hash ^= seed.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}

function hashUnit(seed) {
  return hashSeed(seed) / 4294967296;
}

function mulberry32(seed) {
  return function next() {
    let value = seed += 0x6D2B79F5;
    value = Math.imul(value ^ value >>> 15, value | 1);
    value ^= value + Math.imul(value ^ value >>> 7, value | 61);
    return ((value ^ value >>> 14) >>> 0) / 4294967296;
  };
}

<script>
class PuzzleRenderer {
  constructor(root, options = {}) {
    this.root = root;
    this.options = options;
    this.appliedThemeClass = "";
  }

  render(scene) {
    window.__PuzzleCurrentScene = scene;
    this.lastScene = scene;
    const viewport = this.resolveViewport(scene);
    this.root.style.setProperty("--cols", viewport.width);
    this.root.dataset.viewportX = String(viewport.x);
    this.root.dataset.viewportY = String(viewport.y);
    this.root.dataset.viewportWidth = String(viewport.width);
    this.root.dataset.viewportHeight = String(viewport.height);
    const visuals = this.visuals();
    const hasVisuals = this.hasVisualConfig(visuals) || this.usesVisualSprites(scene, visuals);
    if (visuals.boardClass) {
      this.root.classList.toggle(visuals.boardClass, hasVisuals);
    }
    this.applyThemeClass(visuals.themeClass, hasVisuals);
    this.root.replaceChildren();

    if (this.options.renderMode === "canvas") {
      this.renderCanvas(scene, viewport);
      return;
    }

    for (const cellData of this.viewportCells(scene, viewport)) {
      this.root.append(this.renderCell(cellData, scene));
    }
    window.PuzzleStudio?.dispatchRender({ scene, board: this.root });
  }

  resolveViewport(scene) {
    const screen = scene.screen || scene.view || {};
    const viewportSize = screen.viewportSize || { kind: "full" };
    const mode = screen.viewportMode || "paged";
    const focus = this.focusCell(scene, screen.viewportFocus || "Player");
    const previous = this.viewport;

    if (viewportSize.kind === "full") {
      const viewport = { x: 0, y: 0, width: scene.width, height: scene.height };
      this.viewport = viewport;
      return viewport;
    }

    const width = Math.max(1, Number(viewportSize.width || scene.width || 1));
    const height = Math.max(1, Number(viewportSize.height || scene.height || 1));
    if (
      mode === "paged"
      && previous
      && previous.width === width
      && previous.height === height
      && this.viewportContains(previous, focus)
    ) {
      return previous;
    }

    const viewport = mode === "paged"
      ? this.pagedViewport(scene, focus, width, height)
      : this.centeredViewport(scene, focus, width, height);
    this.viewport = viewport;
    return viewport;
  }

  focusCell(scene, objectName) {
    for (const cell of scene.cells || []) {
      if (cell.layers?.some((layer) => layer.object === objectName || layer.sprite === objectName)) {
        return cell;
      }
    }
    return null;
  }

  viewportContains(viewport, cell) {
    return Boolean(
      cell
      && cell.x >= viewport.x
      && cell.y >= viewport.y
      && cell.x < viewport.x + viewport.width
      && cell.y < viewport.y + viewport.height

  centeredViewport(scene, focus, width, height) {
    const centerX = focus ? focus.x - Math.floor(width / 2) : 0;
    const centerY = focus ? focus.y - Math.floor(height / 2) : 0;
    const maxX = Math.max(0, Number(scene.width || 0) - width);
    const maxY = Math.max(0, Number(scene.height || 0) - height);
    return {
      x: Math.max(0, Math.min(maxX, centerX)),
      y: Math.max(0, Math.min(maxY, centerY)),
      width: Math.min(width, Number(scene.width || width)),
      height: Math.min(height, Number(scene.height || height)),
    };
  }

  pagedViewport(scene, focus, width, height) {
    const viewportX = focus ? Math.floor(focus.x / width) * width : 0;
    const viewportY = focus ? Math.floor(focus.y / height) * height : 0;
    const maxX = Math.max(0, Number(scene.width || 0) - width);
    const maxY = Math.max(0, Number(scene.height || 0) - height);
    return {
      x: Math.max(0, Math.min(maxX, viewportX)),
      y: Math.max(0, Math.min(maxY, viewportY)),
      width: Math.min(width, Number(scene.width || width)),
      height: Math.min(height, Number(scene.height || height)),
    };
  }

  viewportCells(scene, viewport) {
    return (scene.cells || []).filter((cell) =>
      cell.x >= viewport.x
      && cell.y >= viewport.y
      && cell.x < viewport.x + viewport.width
      && cell.y < viewport.y + viewport.height
    );
  }

  renderCell(cellData, scene) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.x = cellData.x;
    cell.dataset.y = cellData.y;
    cell.setAttribute("aria-label", this.cellLabel(cellData));

    const layers = this.sortedLayers(cellData.layers);
    for (const layer of layers) {
      cell.classList.add(`has-${layer.sprite}`);
    }

    for (const layer of layers) {
      cell.append(this.renderSprite(layer));
    }

    return cell;

  renderSprite(layer) {
    const visualSprite = this.resolveVisualSprite(layer);
    if (visualSprite) {
      return this.renderVisualSprite(layer, visualSprite.definition, visualSprite.key);

    sprite.className = `sprite ${layer.sprite}`;
    sprite.dataset.object = layer.object;
    sprite.dataset.layer = layer.layer;
    sprite.style.zIndex = String(layer.layer + 1);
    sprite.setAttribute("aria-hidden", "true");
    return sprite;
  }

    sprite.className = `sprite visual-sprite ${definition.className || ""} ${layer.sprite} visual-${this.classNameFor(visualKey)}`;

    sprite.dataset.layer = layer.layer;
    sprite.style.zIndex = String(definition.zIndex ?? layer.layer + 1);
    sprite.style.setProperty("--sprite-cols", String(definition.pattern?.[0]?.length || 1));

      const source = window.PuzzleAssets?.url(definition.source) || definition.source;

      return sprite;

    if (solidColor) {
      sprite.classList.add("visual-solid");
      sprite.style.backgroundColor = solidColor;
      return sprite;
    }

    sprite.classList.add("visual-pattern");
    sprite.style.backgroundImage = `url("${this.patternDataUrl(definition)}")`;

    return sprite;
  }

    const canvas = document.createElement("canvas");
    canvas.className = "board-canvas";
    const unit = this.canvasCellUnit(scene, frame);
    canvas.width = Math.max(1, frame.width * unit);
    canvas.height = Math.max(1, frame.height * unit);
    canvas.setAttribute("aria-label", this.boardLabel(scene, frame));
    const context = canvas.getContext("2d");
    context.imageSmoothingEnabled = false;
    this.paintCanvas(context, scene, frame, unit);
    this.root.append(canvas);
  }

      return;

          x + colIndex * pixelWidth,
          y + rowIndex * pixelHeight,
          pixelWidth,
          pixelHeight,
        );
      });
    });
  }

  paintFallbackLayer(context, layer, x, y, unit) {
    const hue = this.hashString(layer.object || layer.sprite || "") % 360;
    context.fillStyle = `hsl(${hue} 55% 54%)`;
    const inset = Math.max(1, Math.floor(unit * 0.18));
    context.fillRect(x + inset, y + inset, Math.max(1, unit - inset * 2), Math.max(1, unit - inset * 2));

  cachedImage(source) {
    const url = window.PuzzleAssets?.url(source) || source;
    const cache = this.constructor.imageCache || (this.constructor.imageCache = new Map());
    const existing = cache.get(url);
    if (existing) {
      return existing;
    }
    const image = new Image();
    image.addEventListener("load", () => {
      if (this.lastScene && this.root.isConnected) {
        this.render(this.lastScene);
      }

    image.src = url;
    cache.set(url, image);
    return image;
  }

  canvasCellUnit(scene, frame) {
    let unit = 1;
    let hasImage = false;
    for (const cell of this.frameCells(scene, frame)) {
      for (const layer of cell.layers || []) {
        const definition = this.resolveVisualSprite(layer)?.definition;
        if (!definition) {
          continue;
        }
        if (definition.source) {
          hasImage = true;
          continue;
        }
        const cols = Math.max(1, definition.pattern?.[0]?.length || 1);
        const rows = Math.max(1, definition.pattern?.length || 1);
        unit = this.boundedLeastCommonMultiple(unit, cols, 128);
        unit = this.boundedLeastCommonMultiple(unit, rows, 128);
      }
    }
    return hasImage ? this.boundedLeastCommonMultiple(unit, 32, 128) : unit;
  }

  boundedLeastCommonMultiple(a, b, limit) {
    const left = Math.max(1, Math.trunc(Number(a) || 1));
    const right = Math.max(1, Math.trunc(Number(b) || 1));
    const value = (left * right) / this.greatestCommonDivisor(left, right);
    return value <= limit ? value : left;
  }

  greatestCommonDivisor(a, b) {
    let left = Math.abs(a);
    let right = Math.abs(b);
    while (right) {
      const next = left % right;
      left = right;
      right = next;
    }
    return left || 1;
  }

  canvasFloorColor() {
    const rootStyle = getComputedStyle(this.root);
    return (
      rootStyle.getPropertyValue("--cell-background").trim()
      || "transparent"
