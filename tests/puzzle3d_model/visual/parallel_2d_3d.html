<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parallel Sokoban 2D/3D</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f3ef;
        --ink: #1f2428;
        --line: #d7dde2;
        --muted: #66727c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
        overflow: hidden;
      }

      .parallel-shell {
        display: grid;
        width: 100vw;
        height: 100vh;
        padding: 12px;
      }

      .layout-node {
        display: flex;
        min-width: 0;
        min-height: 0;
        gap: 10px;
        overflow: hidden;
      }

      .layout-row {
        flex-direction: row;
      }

      .layout-column {
        flex-direction: column;
      }

      .frame {
        display: grid;
        grid-template-rows: minmax(0, 1fr);
        min-width: 0;
        min-height: 0;
        border: 0;
        background: transparent;
        overflow: hidden;
      }

      .layout-node > .frame,
      .layout-node > .layout-node {
        flex: var(--weight, 1) 1 0;
      }

      .viewport {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: transparent;
      }

      iframe {
        display: block;
        border: 0;
        background: transparent;
        pointer-events: none;
        transform-origin: top left;
      }

      .component-2d iframe,
      .component-3d iframe {
        --component-scale: 1;
        width: calc(100% / var(--component-scale));
        height: calc(100% / var(--component-scale));
        transform: scale(var(--component-scale));
      }

    </style>
  </head>
  <body>
    <main id="inputSurface" class="parallel-shell" tabindex="0"></main>
    <script>
      const inputSurface = document.querySelector("#inputSurface");
      const componentFrames = [];

      const layoutTree = {
        kind: "row",
        children: [
          {
            kind: "column",
            weight: 1,
            children: [
              { kind: "component", type: "2d", weight: 1.1 },
              { kind: "component", type: "3d", weight: 1 },
            ],
          },
          {
            kind: "column",
            weight: 1.15,
            children: [
              {
                kind: "row",
                weight: 0.9,
                children: [
                  { kind: "component", type: "3d", weight: 1 },
                  { kind: "component", type: "2d", weight: 1 },
                ],
              },
              { kind: "component", type: "3d", weight: 1.25 },
            ],
          },
        ],
      };

      const componentSources = {
        "2d": "./parallel_2d_sokoban.html?component=1&v=command-sprites",
        "3d": "./index.html?scene=playing&component=1&v=multi-instance",
      };

      function focusInputSurface() {
        inputSurface.focus({ preventScroll: true });
      }

      function keepSceneInputFocus() {
        requestAnimationFrame(focusInputSurface);
        setTimeout(focusInputSurface, 0);
      }

      function broadcastKey(event) {
        for (const component of componentFrames) {
          component.frame.contentWindow?.postMessage({
            type: "PuzzleStudioKey",
            key: event.key,
            code: event.code,
          }, "*");
        }
        keepSceneInputFocus();
      }

      function handleSceneKeydown(event) {
        if (event.code === "KeyZ") {
          event.preventDefault();
          event.stopPropagation();
          broadcastCommand("undo");
          return;
        }
        if (event.code === "KeyR") {
          event.preventDefault();
          event.stopPropagation();
          broadcastCommand("restart");
          return;
        }
        event.preventDefault();
        event.stopPropagation();
        broadcastKey(event);
      }

      function broadcastCommand(command) {
        for (const component of componentFrames) {
          if (component.type === "2d") {
            component.frame.contentWindow?.postMessage({ type: "PuzzleStudioCommand", command }, "*");
          } else {
            component.frame.contentWindow?.postMessage({ type: "PuzzleStudioCommand", command }, "*");
          }
        }
        keepSceneInputFocus();
      }

      function renderLayout(node, parent) {
        if (node.kind === "row" || node.kind === "column") {
          const element = document.createElement("section");
          element.className = `layout-node layout-${node.kind}`;
          element.style.setProperty("--weight", String(node.weight || 1));
          for (const child of node.children || []) {
            renderLayout(child, element);
          }
          parent.append(element);
          return;
        }
        if (node.kind !== "component") {
          return;
        }
        const section = document.createElement("section");
        section.className = `frame component-${node.type}`;
        section.style.setProperty("--weight", String(node.weight || 1));
        const viewport = document.createElement("div");
        viewport.className = "viewport";
        const frame = document.createElement("iframe");
        frame.src = componentSources[node.type];
        frame.scrolling = "no";
        frame.tabIndex = -1;
        frame.inert = true;
        frame.setAttribute("inert", "");
        frame.setAttribute("aria-hidden", "true");
        frame.addEventListener("focus", keepSceneInputFocus);
        viewport.append(frame);
        section.append(viewport);
        parent.append(section);
        componentFrames.push({ type: node.type, frame });
      }

      window.addEventListener("keydown", handleSceneKeydown);

      window.ParallelSokobanSend = (code) => {
        const event = keyEventFromCode(code);
        if (!event) {
          return null;
        }
        broadcastKey(event);
        return { key: event.key, code: event.code };
      };

      function keyEventFromCode(code) {
        const keyByCode = {
          ArrowLeft: "ArrowLeft",
          ArrowRight: "ArrowRight",
          ArrowUp: "ArrowUp",
          ArrowDown: "ArrowDown",
          KeyA: "a",
          KeyD: "d",
          KeyW: "w",
          KeyS: "s",
        };
        const key = keyByCode[code];
        return key ? { key, code } : null;
      }

      window.addEventListener("load", () => {
        renderLayout(layoutTree, inputSurface);
        focusInputSurface();
      });
      window.addEventListener("pointerdown", () => {
        focusInputSurface();
      });
      window.addEventListener("blur", () => {
        keepSceneInputFocus();
      });
    </script>
  </body>
</html>
