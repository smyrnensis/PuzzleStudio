[package]
name = "puzzlestudio-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "puzzlestudio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "puzzlestudio-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
html-editor = { path = "../crates/html_editor", default-features = false, features = ["editor-docs", "sound-tools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2.7.1"
