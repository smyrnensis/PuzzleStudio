[workspace]
members = [
    "crates/kernel",
    "crates/authoring",
    "crates/core",
    "crates/grid3d",
    "crates/scene",
    "crates/puzzle_3d",
    "crates/lang",
    "crates/solver",
    "crates/play",
    "crates/game_runtime",
    "crates/ascii_play",
    "crates/html_play",
    "crates/html_editor",
    "crates/cli",
    "crates/wasm",
    "crates/wasm_game",
    "crates/wasm_player",
    "crates/wasm_core",
    "src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = 0
