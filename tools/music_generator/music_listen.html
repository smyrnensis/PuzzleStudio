<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Music Generator Listen</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101214;
        --panel: #191d20;
        --panel-2: #20262a;
        --text: #f2f4f3;
        --muted: #9aa5a1;
        --line: #333b40;
        --accent: #7bd88f;
        --accent-2: #58b7d6;
        --danger: #ff7b7b;
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        background: #141719;
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 12px;
        min-width: 0;
      }

      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
      }

      .status {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }

      .status.is-error {
        color: var(--danger);
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
        min-height: 0;
      }

      .controls {
        border-right: 1px solid var(--line);
        padding: 16px;
        background: var(--panel);
        overflow: auto;
      }

      .main {
        min-width: 0;
        padding: 16px;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 16px;
      }

      .transport {
        display: grid;
        grid-template-columns: auto auto auto minmax(160px, 1fr);
        align-items: center;
        gap: 10px;
      }

      .icon-button {
        width: 38px;
        height: 38px;
        border-radius: 6px;
        display: inline-grid;
        place-items: center;
      }

      .icon-button svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .primary {
        border-color: color-mix(in srgb, var(--accent) 70%, var(--line));
        color: #071008;
        background: var(--accent);
      }

      .control-group {
        display: grid;
        gap: 14px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      label,
      .field-label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .value {
        color: var(--text);
        font-variant-numeric: tabular-nums;
        font-size: 13px;
      }

      input[type="text"],
      input[type="number"],
      select {
        width: 100%;
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0d0f10;
        color: var(--text);
        padding: 7px 9px;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      .seed-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }

      .text-button {
        min-height: 36px;
        border-radius: 6px;
        padding: 0 12px;
        font-size: 13px;
        font-weight: 700;
      }

      .output {
        margin-top: 16px;
        display: grid;
        gap: 10px;
      }

      .code-line {
        min-height: 44px;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0d0f10;
        color: #d7dde0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .form-strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 10px;
      }

      .section {
        min-height: 82px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        padding: 10px;
      }

      .section-name {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        font-weight: 700;
      }

      .section-bars {
        margin-top: 6px;
        font-size: 22px;
        font-weight: 750;
        font-variant-numeric: tabular-nums;
      }

      .section-role {
        margin-top: 6px;
        color: var(--accent-2);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .debug {
        min-height: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0d0f10;
        overflow: auto;
        box-shadow: 0 16px 40px var(--shadow);
      }

      pre {
        margin: 0;
        padding: 14px;
        color: #cbd4d0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      @media (max-width: 820px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .controls {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .transport {
          grid-template-columns: auto auto auto minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <h1>Music Generator Listen</h1>
        </div>
        <div id="status" class="status">Loading</div>
      </header>

      <div class="workspace">
        <aside class="controls" aria-label="Music controls">
          <div class="control-group">
            <div class="field">
              <div class="field-row">
                <label for="seedInput">Seed</label>
              </div>
              <div class="seed-row">
                <input id="seedInput" type="text" autocomplete="off" spellcheck="false">
                <button id="randomButton" class="icon-button" type="button" aria-label="Random seed" title="Random seed">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M16 3h5v5"></path>
                    <path d="M4 20 21 3"></path>
                    <path d="M21 16v5h-5"></path>
                    <path d="M15 15l6 6"></path>
                    <path d="M4 4l5 5"></path>
                  </svg>
                </button>
              </div>
            </div>

            <div class="field">
              <div class="field-row">
                <label for="heightInput">Height</label>
                <span id="heightValue" class="value">0.50</span>
              </div>
              <input id="heightInput" type="range" min="0" max="1" step="0.01" value="0.50">
            </div>

            <div class="field">
              <div class="field-row">
                <label for="barsInput">Bars</label>
              </div>
              <select id="barsInput">
                <option value="8">8</option>
                <option value="16">16</option>
                <option value="32" selected>32</option>
                <option value="64">64</option>
              </select>
            </div>

            <div class="field">
              <div class="field-row">
                <label for="bpmInput">BPM</label>
                <span id="bpmValue" class="value">100</span>
              </div>
              <input id="bpmInput" type="range" min="50" max="150" step="1" value="100">
            </div>

            <div class="field">
              <div class="field-row">
                <label for="volumeInput">Volume</label>
                <span id="volumeValue" class="value">70%</span>
              </div>
              <input id="volumeInput" type="range" min="0" max="1" step="0.01" value="0.70">
            </div>
          </div>

          <div class="output">
            <div class="field-label">Definition</div>
            <div id="definitionLine" class="code-line"></div>
          </div>
        </aside>

        <section class="main" aria-label="Generated music">
          <div class="transport">
            <button id="playButton" class="icon-button primary" type="button" aria-label="Play" title="Play">
              <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true">
                <polygon points="8 5 19 12 8 19 8 5"></polygon>
              </svg>
            </button>
            <button id="stopButton" class="icon-button" type="button" aria-label="Stop" title="Stop">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="6" y="6" width="12" height="12"></rect>
              </svg>
            </button>
            <button id="copyButton" class="icon-button" type="button" aria-label="Copy definition" title="Copy definition">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
            <input id="progressInput" type="range" min="0" max="0.9999" step="0.0001" value="0" aria-label="Loop progress">
          </div>

          <div id="formStrip" class="form-strip" aria-label="Form sections"></div>

          <div class="debug">
            <pre id="debugOutput"></pre>
          </div>
        </section>
      </div>
    </main>

    <script>
(() => {
  const musicPlayer = (() => {
const FUNCTIONAL_TIMBRE_META = {
  "breath-column": { family: "breath", excitation: "air noise plus low-harmonic tone", resonator: "air column", distance: "middle", engine: "breath-additive", gain: 0.86 },
  "reed-column": { family: "reed", excitation: "reed-like odd-harmonic source", resonator: "closed air column", distance: "middle", engine: "odd-additive", gain: 0.72 },
  "body-pluck": { family: "pluck", excitation: "short pluck with body resonance", resonator: "string/body", distance: "middle", engine: "body-pluck", gain: 0.9 },
  "muted-body-pluck": { family: "pluck", excitation: "damped pluck", resonator: "damped string/body", distance: "middle-back", engine: "muted-pluck", gain: 0.98 },
  "struck-bar": { family: "strike", excitation: "mallet-like strike", resonator: "inharmonic bar", distance: "middle", engine: "inharmonic-strike", gain: 0.62 },
  "soft-oscillator": { family: "soft synth", excitation: "oscillator", resonator: "lowpass filter", distance: "middle", engine: "filtered-oscillator", gain: 0.68 },
  "noise-fiber": { family: "noise", excitation: "filtered noise plus weak pitch", resonator: "electronic filter", distance: "background", engine: "noise-pitched", gain: 0.54 },
  "warm-pad": { family: "soft synth", excitation: "slow oscillator", resonator: "lowpass filter", distance: "background", engine: "slow-pad", gain: 0.7 },
  "air-column-pad": { family: "breath", excitation: "soft air noise plus tone", resonator: "air column", distance: "background", engine: "breath-pad", gain: 0.66 },
  "round-low": { family: "low body", excitation: "low oscillator", resonator: "lowpass body", distance: "support", engine: "low-body", gain: 0.86 },
};

function instrumentOutputGain(instrument) {
  if (FUNCTIONAL_TIMBRE_META[instrument]) {
    return FUNCTIONAL_TIMBRE_META[instrument].gain;
  }
  if (instrument === "chip-lead") {
    return 0.65;
  }
  return 1;
}

function midiToFrequency(note) {
  return 440 * 2 ** ((note - 69) / 12);
}

function createPlayer(audioContext, playbackScore) {
  let timer = null;
  let loopStart = 0;
  const scheduled = new Set();
  const activeSources = new Set();
  const lookaheadMs = 80;
  const scheduleAheadSeconds = 0.28;
  const stepSeconds = (60 / playbackScore.transport.bpm) * playbackScore.transport.stepDurationBeats;
  const loopSeconds = playbackScore.transport.loopSteps * stepSeconds;

  function start(progress = 0) {
    stop();
    scheduled.clear();
    loopStart = audioContext.currentTime + 0.05 - progress * loopSeconds;
    timer = setInterval(schedule, lookaheadMs);
    schedule();
  }

  function stop() {
    if (timer !== null) {
      clearInterval(timer);
      timer = null;
    }
    for (const source of activeSources) {
      try {
        source.stop();
      } catch {
        // Stopped sources can be ignored.
      }
      source.disconnect();
    }
    activeSources.clear();
    scheduled.clear();
  }

  function schedule() {
    const now = audioContext.currentTime;
    const firstLoop = Math.max(0, Math.floor((now - loopStart) / loopSeconds));
    for (const loopIndex of [firstLoop, firstLoop + 1]) {
      const candidateLoopStart = loopStart + loopIndex * loopSeconds;
      for (let eventIndex = 0; eventIndex < playbackScore.events.length; eventIndex += 1) {
        const event = playbackScore.events[eventIndex];
        const startsAt = candidateLoopStart + event.step * stepSeconds;
        const key = `${loopIndex}:${eventIndex}`;
        if (!scheduled.has(key) && startsAt >= now && startsAt < now + scheduleAheadSeconds) {
          scheduled.add(key);
          playEvent(audioContext, playbackScore, event, startsAt, event.durationSteps * stepSeconds, activeSources);
        }
      }
    }
    for (const key of scheduled) {
      const [loopIndexText] = key.split(":");
      const loopIndex = Number(loopIndexText);
      if (loopStart + loopIndex * loopSeconds < now - loopSeconds) {
        scheduled.delete(key);
      }
    }
  }

  function loopProgress() {
    if (timer === null) {
      return 0;
    }
    const elapsed = Math.max(0, audioContext.currentTime - loopStart);
    return (elapsed % loopSeconds) / loopSeconds;
  }

  return { start, stop, loopProgress };
}

function playEvent(audioContext, playbackScore, event, startsAt, duration, activeSources) {
  const timbre = playbackScore.timbres[event.timbre] ?? { kind: event.timbre };
  const instrument = timbre?.kind || event.timbre;
  const playbackTone = playbackScore.mix.playbackTone;
  const volume = playbackScore.mix.volume;
  const eventTone = toneForEvent(event, playbackTone);
  const gain = eventTone.gain * volume * (timbre.gain ?? instrumentOutputGain(instrument));
  for (const note of event.notes) {
    if (typeof note === "number") {
      const playbackNote = note + (eventTone.pitchShift ?? 0);
      if (instrument === "spectral-field") {
        playSpectralField(audioContext, playbackNote, startsAt, duration, timbre, event.velocity * gain, eventTone, activeSources);
      } else if (isFunctionalTimbre(instrument)) {
        playFunctionalTimbre(audioContext, playbackNote, startsAt, duration, instrument, event.velocity * gain, eventTone.filter, activeSources);
      } else if (isPlucked(instrument)) {
        playPluck(audioContext, playbackNote, startsAt, duration, instrument, event.velocity * gain, eventTone.filter, activeSources);
      } else {
        playTone(audioContext, playbackNote, startsAt, duration, instrument, event.velocity * gain, eventTone.filter, activeSources);
      }
    } else {
      playNoise(audioContext, startsAt, duration, timbre, event.velocity * gain, eventTone, activeSources);
    }
  }
}

function toneForEvent(event, tone) {
  let result;
  if (event.track === "bass") {
    result = { gain: tone.bassGain, filter: tone.bassFilter };
  } else if (event.track === "lead" || event.track === "counter") {
    result = { gain: tone.leadGain, filter: tone.toneFilter };
  } else if (event.track === "chord") {
    result = { gain: tone.harmonyGain, filter: tone.toneFilter };
  } else if (event.timbre === "hat" || event.timbre === "snare") {
    result = { gain: tone.highPercussionGain, filter: tone.noiseFilter };
  } else {
    result = { gain: tone.lowPercussionGain, filter: tone.bassFilter };
  }
  return {
    gain: result.gain * rolePlaybackGain(event.role, tone),
    filter: result.filter,
    pitchShift: tone.pitchShift ?? 0,
    brightnessTilt: tone.brightnessTilt ?? 0,
    attackShape: tone.attackShape ?? 0,
  };
}

function rolePlaybackGain(role, tone) {
  if (role === "identity") {
    return tone.identityGain ?? 1;
  }
  if (role === "time") {
    return tone.timeGain ?? 1;
  }
  if (role === "color") {
    return tone.colorGain ?? 1;
  }
  if (role === "boundary") {
    return tone.boundaryGain ?? 1;
  }
  return 1;
}

function isFunctionalTimbre(instrument) {
  return Boolean(FUNCTIONAL_TIMBRE_META[instrument]);
}

function playFunctionalTimbre(audioContext, midiNote, startsAt, duration, instrument, velocity, filterMultiplier, activeSources) {
  if (instrument === "body-pluck" || instrument === "muted-body-pluck") {
    playPluck(audioContext, midiNote, startsAt, duration, instrument, velocity, filterMultiplier, activeSources);
    return;
  }
  if (instrument === "struck-bar") {
    playAdditiveTone(audioContext, midiNote, startsAt, duration, velocity, filterMultiplier, activeSources, {
      partials: [
        { ratio: 1, gain: 1, decay: 14 },
        { ratio: 2.74, gain: 0.44, decay: 18 },
        { ratio: 5.36, gain: 0.22, decay: 24 },
      ],
      attack: 0.004,
      sustain: 0.02,
      release: 0.05,
      filter: 2800,
      filterType: "bandpass",
      q: 0.85,
    });
    return;
  }
  if (instrument === "reed-column") {
    playAdditiveTone(audioContext, midiNote, startsAt, duration, velocity, filterMultiplier, activeSources, {
      partials: [
        { ratio: 1, gain: 0.9, decay: 1.7 },
        { ratio: 3, gain: 0.42, decay: 2.2 },
        { ratio: 5, gain: 0.18, decay: 2.8 },
      ],
      attack: 0.018,
      sustain: 0.54,
      release: 0.07,
      filter: 1350,
      filterType: "lowpass",
      q: 0.55,
      vibratoCents: 3,
      vibratoRate: 4.8,
    });
    playDustNoise(audioContext, startsAt, duration, velocity * 0.12, filterMultiplier, activeSources);
    return;
  }
  if (instrument === "breath-column") {
    playAdditiveTone(audioContext, midiNote, startsAt, duration, velocity, filterMultiplier, activeSources, {
      partials: [
        { ratio: 1, gain: 1, decay: 1.5 },
        { ratio: 2, gain: 0.14, decay: 2.1 },
        { ratio: 3, gain: 0.08, decay: 2.6 },
      ],
      attack: 0.07,
      sustain: 0.56,
      release: 0.08,
      filter: 1180,
      filterType: "lowpass",
      q: 0.4,
      vibratoCents: 4,
      vibratoRate: 5.4,
    });
    playBreathNoise(audioContext, startsAt, duration, velocity * 0.18, filterMultiplier, activeSources);
    return;
  }
  if (instrument === "air-column-pad") {
    playAdditiveTone(audioContext, midiNote, startsAt, duration, velocity, filterMultiplier, activeSources, {
      partials: [
        { ratio: 1, gain: 1, decay: 0.7 },
        { ratio: 2, gain: 0.1, decay: 0.9 },
      ],
      attack: 0.14,
      sustain: 0.66,
      release: 0.14,
      filter: 860,
      filterType: "lowpass",
      q: 0.35,
      vibratoCents: 2,
      vibratoRate: 4.2,
    });
    playBreathNoise(audioContext, startsAt, duration, velocity * 0.1, filterMultiplier, activeSources);
    return;
  }
  if (instrument === "noise-fiber") {
    playAdditiveTone(audioContext, midiNote, startsAt, duration, velocity * 0.28, filterMultiplier, activeSources, {
      partials: [{ ratio: 1, gain: 1, decay: 2.4 }],
      attack: 0.025,
      sustain: 0.34,
      release: 0.08,
      filter: 900,
      filterType: "bandpass",
      q: 0.9,
    });
    playDustNoise(audioContext, startsAt, duration, velocity * 0.52, filterMultiplier, activeSources);
    return;
  }
  if (instrument === "round-low") {
    playAdditiveTone(audioContext, midiNote - 12, startsAt, duration, velocity, filterMultiplier, activeSources, {
      partials: [
        { ratio: 1, gain: 1, decay: 1.1 },
        { ratio: 2, gain: 0.18, decay: 1.7 },
      ],
      attack: 0.018,
      sustain: 0.68,
      release: 0.08,
      filter: 680,
      filterType: "lowpass",
      q: 0.45,
    });
    return;
  }
  if (instrument === "warm-pad") {
    playAdditiveTone(audioContext, midiNote, startsAt, duration, velocity, filterMultiplier, activeSources, {
      partials: [
        { ratio: 1, gain: 0.78, decay: 0.5 },
        { ratio: 1.005, gain: 0.28, decay: 0.6 },
        { ratio: 2, gain: 0.12, decay: 0.8 },
      ],
      attack: 0.12,
      sustain: 0.72,
      release: 0.16,
      filter: 780,
      filterType: "lowpass",
      q: 0.42,
      vibratoCents: 1.5,
      vibratoRate: 3.2,
    });
    return;
  }
  playAdditiveTone(audioContext, midiNote, startsAt, duration, velocity, filterMultiplier, activeSources, {
    partials: [
      { ratio: 1, gain: 0.9, decay: 1.4 },
      { ratio: 2, gain: 0.2, decay: 2.4 },
    ],
    attack: 0.016,
    sustain: 0.38,
    release: 0.06,
    filter: 1450,
    filterType: "lowpass",
    q: 0.4,
  });
}

function playAdditiveTone(audioContext, midiNote, startsAt, duration, velocity, filterMultiplier, activeSources, config) {
  const output = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  filter.type = config.filterType ?? "lowpass";
  filter.frequency.value = (config.filter ?? 1400) * filterMultiplier;
  filter.Q.value = config.q ?? 0.5;
  output.connect(filter).connect(audioContext.destination);
  for (const partial of config.partials) {
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(midiToFrequency(midiNote) * partial.ratio, startsAt);
    gain.gain.setValueAtTime(0.0001, startsAt);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, velocity * partial.gain), startsAt + config.attack);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, velocity * partial.gain * config.sustain), startsAt + Math.max(config.attack + 0.02, duration * 0.48));
    gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + Math.max(0.05, duration + (config.release ?? 0.06)));
    if (partial.decay) {
      gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + Math.min(Math.max(0.05, duration + (config.release ?? 0.06)), 1 / partial.decay + duration * 0.72));
    }
    if (config.vibratoCents) {
      const lfo = audioContext.createOscillator();
      const lfoGain = audioContext.createGain();
      lfo.frequency.value = config.vibratoRate ?? 5;
      lfoGain.gain.value = config.vibratoCents;
      lfo.connect(lfoGain).connect(oscillator.detune);
      trackSource(lfo, activeSources);
      lfo.start(startsAt);
      lfo.stop(startsAt + duration + 0.1);
    }
    oscillator.connect(gain).connect(output);
    trackSource(oscillator, activeSources);
    oscillator.start(startsAt);
    oscillator.stop(startsAt + duration + 0.1);
  }
}

function playSpectralField(audioContext, midiNote, startsAt, duration, timbre, velocity, tone, activeSources) {
  const signal = timbre.signal ?? {};
  const output = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  const envelopeConfig = signal.envelope ?? { attack: 0.02, sustain: 0.5, release: 0.08, durationScale: 0.7 };
  const effectiveDuration = duration * (envelopeConfig.durationScale ?? 0.7);
  const filterMultiplier = tone.filter ?? 1;
  filter.type = signal.filter?.type ?? "lowpass";
  filter.frequency.setValueAtTime((signal.filter?.frequency ?? 1600) * filterMultiplier, startsAt);
  if (signal.filter?.endFrequency) {
    filter.frequency.exponentialRampToValueAtTime(Math.max(20, signal.filter.endFrequency * filterMultiplier), startsAt + effectiveDuration);
  }
  filter.Q.value = signal.filter?.q ?? 0.4;
  output.connect(filter).connect(audioContext.destination);
  const sourceInput = connectPlaybackBody(audioContext, output, signal.body, startsAt, effectiveDuration, activeSources);
  const partials = spectralPartialsForBrightness(signal.partials ?? [[1, 1]], tone.brightnessTilt ?? 0);

  for (const partial of partials) {
    playSpectralPartial(audioContext, midiNote, startsAt, effectiveDuration, partial, signal.pitch, velocity, envelopeConfig, sourceInput, activeSources);
  }
  if (signal.noise) {
    playSpectralNoise(audioContext, startsAt, effectiveDuration, signal.noise, velocity, filterMultiplier, sourceInput, activeSources);
  }
}

function spectralPartialsForBrightness(partials, tilt) {
  if (!tilt) {
    return partials;
  }
  let baseEnergy = 0;
  let tiltedEnergy = 0;
  const tilted = partials.map((partial) => {
    const ratio = Math.max(1, partial[0] ?? 1);
    const amount = partial[1] ?? 0;
    const logRatio = Math.log2(ratio);
    const usefulBrightness = Math.min(logRatio, 2.35);
    const glare = Math.max(0, logRatio - 2.8);
    const brightnessCurve = usefulBrightness - glare * glare * 0.85;
    const nextAmount = amount * 2 ** (tilt * brightnessCurve);
    baseEnergy += amount * amount;
    tiltedEnergy += nextAmount * nextAmount;
    return [ratio, nextAmount, partial[2]];
  });
  if (baseEnergy <= 0 || tiltedEnergy <= 0) {
    return tilted;
  }
  const energyScale = Math.sqrt(baseEnergy / tiltedEnergy);
  return tilted.map(([ratio, amount, decay]) => [ratio, amount * energyScale, decay]);
}

function playSpectralPartial(audioContext, midiNote, startsAt, duration, partial, pitch, velocity, envelopeConfig, destination, activeSources) {
  const [ratio, amount, decay] = partial;
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  oscillator.type = "sine";
  oscillator.frequency.setValueAtTime(midiToFrequency(midiNote) * ratio, startsAt);
  applyPlaybackPitchMotion(audioContext, oscillator, startsAt, duration, pitch, activeSources);
  gain.gain.setValueAtTime(0.0001, startsAt);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, velocity * amount), startsAt + envelopeConfig.attack);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, velocity * amount * envelopeConfig.sustain), startsAt + Math.max(envelopeConfig.attack + 0.02, duration * 0.55));
  gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + duration + envelopeConfig.release);
  if (decay) {
    gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + Math.max(0.03, 1 / decay + duration * 0.35));
  }
  oscillator.connect(gain).connect(destination);
  trackSource(oscillator, activeSources);
  oscillator.start(startsAt);
  oscillator.stop(startsAt + duration + 0.18);
}

function playSpectralNoise(audioContext, startsAt, duration, noise, velocity, filterMultiplier, destination, activeSources) {
  const samples = Math.max(1, Math.floor(audioContext.sampleRate * Math.max(duration, noise.decay ?? 0.06)));
  const buffer = audioContext.createBuffer(1, samples, audioContext.sampleRate);
  const data = buffer.getChannelData(0);
  const rng = mulberry32(hashSeed(`spectral-noise:${startsAt}:${duration}:${noise.role}:${noise.filter?.frequency ?? 0}`));
  for (let i = 0; i < samples; i += 1) {
    const t = i / audioContext.sampleRate;
    const decay = noise.role === "attack" ? Math.exp(-t / (noise.decay ?? 0.06)) : Math.exp(-t * 0.7);
    data[i] = (rng() * 2 - 1) * decay;
  }
  const source = audioContext.createBufferSource();
  const gain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  filter.type = noise.filter?.type ?? "bandpass";
  filter.frequency.value = (noise.filter?.frequency ?? 1500) * filterMultiplier;
  filter.Q.value = noise.filter?.q ?? 0.7;
  gain.gain.setValueAtTime(Math.max(0.0001, velocity * (noise.gain ?? 0.1)), startsAt);
  gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + Math.max(0.04, duration));
  source.buffer = buffer;
  source.connect(filter).connect(gain).connect(destination);
  trackSource(source, activeSources);
  source.start(startsAt);
}

function applyPlaybackPitchMotion(audioContext, oscillator, startsAt, duration, pitch, activeSources) {
  if (!pitch) {
    return;
  }
  if (pitch.vibratoCents) {
    const lfo = audioContext.createOscillator();
    const amount = audioContext.createGain();
    lfo.frequency.value = pitch.vibratoRate ?? 5;
    amount.gain.value = pitch.vibratoCents;
    lfo.connect(amount).connect(oscillator.detune);
    trackSource(lfo, activeSources);
    lfo.start(startsAt);
    lfo.stop(startsAt + duration + 0.18);
  }
  if (pitch.jitterCents) {
    const rate = pitch.jitterRate ?? 16;
    const steps = Math.floor(duration * rate);
    let seed = 2166136261;
    for (let index = 0; index <= steps; index += 1) {
      seed = Math.imul(seed ^ (index + 31), 16777619);
      const value = ((seed >>> 0) / 4294967295 - 0.5) * pitch.jitterCents * 2;
      oscillator.detune.setValueAtTime(value, startsAt + index / rate);
    }
  }
}

function playTone(audioContext, midiNote, startsAt, duration, instrument, velocity, filterMultiplier, activeSources) {
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  oscillator.type = waveformFor(instrument);
  oscillator.frequency.setValueAtTime(midiToFrequency(midiNote), startsAt);
  const envelope = envelopeFor(instrument, duration);
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(envelope.filter * filterMultiplier, startsAt);
  gain.gain.setValueAtTime(0.0001, startsAt);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, velocity), startsAt + envelope.attack);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, velocity * envelope.sustain), startsAt + Math.max(envelope.attack + 0.01, duration * 0.5));
  gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + Math.max(0.04, duration));
  oscillator.connect(filter).connect(gain).connect(audioContext.destination);
  trackSource(oscillator, activeSources);
  oscillator.start(startsAt);
  oscillator.stop(startsAt + duration + 0.05);
  if (instrument === "breathy-flute") {
    playBreathNoise(audioContext, startsAt, duration, velocity * 0.18, filterMultiplier, activeSources);
  }
  if (instrument === "breath-column" || instrument === "air-column-pad") {
    playBreathNoise(audioContext, startsAt, duration, velocity * (instrument === "air-column-pad" ? 0.14 : 0.18), filterMultiplier, activeSources);
  }
  if (instrument === "chip-lead") {
    playChipClick(audioContext, startsAt, velocity * 0.22, filterMultiplier, activeSources);
  }
  if (instrument === "dust-lead" || instrument === "reed") {
    playDustNoise(audioContext, startsAt, duration, velocity * (instrument === "dust-lead" ? 0.32 : 0.18), filterMultiplier, activeSources);
  }
  if (instrument === "reed-column" || instrument === "noise-fiber") {
    playDustNoise(audioContext, startsAt, duration, velocity * (instrument === "noise-fiber" ? 0.34 : 0.14), filterMultiplier, activeSources);
  }
}

function playPluck(audioContext, midiNote, startsAt, duration, instrument, velocity, filterMultiplier, activeSources) {
  const sampleRate = audioContext.sampleRate;
  const seconds = Math.max(0.15, Math.min(1.5, duration + 0.25));
  const samples = Math.floor(sampleRate * seconds);
  const buffer = audioContext.createBuffer(1, samples, sampleRate);
  const data = buffer.getChannelData(0);
  const frequency = midiToFrequency(midiNote);
  const decay = pluckDecayFor(instrument);
  const bright = pluckBrightnessFor(instrument);
  const pluckVariant = instrument === "warm-pluck" || instrument === "low-pluck" || instrument === "fuzzy-pluck";
  const bodyPluck = instrument === "body-pluck" || instrument === "muted-body-pluck";
  const struckBar = instrument === "struck-bar";
  const bodyMix = instrument === "harp" || instrument === "nylon" || pluckVariant || bodyPluck ? 0.66 : instrument === "marimba" || struckBar ? 0.48 : 0.55;
  const upperMix = pluckVariant || bodyPluck ? 0.12 : instrument === "kalimba" || instrument === "music-box" || struckBar ? 0.34 : instrument === "harp" ? 0.18 : 0.24;
  const rng = mulberry32(hashSeed(`${instrument}:${midiNote}:${duration}`));
  for (let i = 0; i < samples; i += 1) {
    const t = i / sampleRate;
    const env = Math.exp(-decay * t);
    const body = Math.sin(2 * Math.PI * frequency * t);
    const detunedBody = Math.sin(2 * Math.PI * frequency * (pluckVariant || bodyPluck ? 0.997 : 1.006) * t) * (pluckVariant || bodyPluck ? 0.24 : 0.18);
    const upperRatio = instrument === "marimba" || struckBar ? 2.7 : pluckVariant || bodyPluck ? 1.52 : 2.01;
    const upper = Math.sin(2 * Math.PI * frequency * upperRatio * t) * bright;
    const click = Math.exp(-90 * t) * Math.sin(2 * Math.PI * frequency * 7 * t) * bright * 0.35;
    const wood = instrument === "marimba" || struckBar ? Math.exp(-28 * t) * Math.sin(2 * Math.PI * frequency * 0.52 * t) * 0.28 : 0;
    const scrape = (rng() * 2 - 1) * Math.exp(-(pluckVariant || bodyPluck ? 12 : 38) * t) * (pluckVariant || bodyPluck ? 0.075 : instrument === "nylon" || instrument === "harp" ? 0.035 : 0.018);
    const lowBody = pluckVariant || bodyPluck ? Math.sin(2 * Math.PI * frequency * 0.5 * t) * 0.12 : 0;
    data[i] = (body * bodyMix + detunedBody + lowBody + upper * upperMix + click + wood + scrape) * env;
  }
  const source = audioContext.createBufferSource();
  const gain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = pluckFilterFor(instrument) * filterMultiplier;
  gain.gain.setValueAtTime(Math.max(0.0001, velocity), startsAt);
  gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + seconds);
  source.buffer = buffer;
  source.connect(filter).connect(gain).connect(audioContext.destination);
  trackSource(source, activeSources);
  source.start(startsAt);
  if (pluckVariant || bodyPluck) {
    playStringNoise(audioContext, startsAt, duration, velocity * (instrument === "fuzzy-pluck" ? 0.22 : bodyPluck ? 0.08 : 0.1), filterMultiplier, activeSources);
  }
  if (instrument === "fuzzy-pluck") {
    playDustNoise(audioContext, startsAt, duration, velocity * 0.28, filterMultiplier, activeSources);
  }
}

function playBreathNoise(audioContext, startsAt, duration, velocity, filterMultiplier, activeSources) {
  const samples = Math.max(1, Math.floor(audioContext.sampleRate * Math.max(0.04, duration)));
  const buffer = audioContext.createBuffer(1, samples, audioContext.sampleRate);
  const data = buffer.getChannelData(0);
  const rng = mulberry32(hashSeed(`breath:${startsAt}:${duration}`));
  for (let i = 0; i < samples; i += 1) {
    const t = i / audioContext.sampleRate;
    data[i] = (rng() * 2 - 1) * Math.exp(-2.4 * t);
  }
  const source = audioContext.createBufferSource();
  const gain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = 1800 * filterMultiplier;
  filter.Q.value = 0.8;
  gain.gain.setValueAtTime(0.0001, startsAt);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, velocity), startsAt + 0.035);
  gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + Math.max(0.06, duration));
  source.buffer = buffer;
  source.connect(filter).connect(gain).connect(audioContext.destination);
  trackSource(source, activeSources);
  source.start(startsAt);
}

function playStringNoise(audioContext, startsAt, duration, velocity, filterMultiplier, activeSources) {
  const samples = Math.max(1, Math.floor(audioContext.sampleRate * Math.max(0.08, duration * 0.8)));
  const buffer = audioContext.createBuffer(1, samples, audioContext.sampleRate);
  const data = buffer.getChannelData(0);
  const rng = mulberry32(hashSeed(`string:${startsAt}:${duration}`));
  for (let i = 0; i < samples; i += 1) {
    const t = i / audioContext.sampleRate;
    const burst = Math.exp(-22 * t);
    const scrape = Math.exp(-4.8 * t);
    data[i] = (rng() * 2 - 1) * (burst * 0.7 + scrape * 0.3);
  }
  const source = audioContext.createBufferSource();
  const gain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = 1200 * filterMultiplier;
  filter.Q.value = 0.72;
  gain.gain.setValueAtTime(Math.max(0.0001, velocity), startsAt);
  gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + Math.max(0.06, duration * 0.9));
  source.buffer = buffer;
  source.connect(filter).connect(gain).connect(audioContext.destination);
  trackSource(source, activeSources);
  source.start(startsAt);
}

function playDustNoise(audioContext, startsAt, duration, velocity, filterMultiplier, activeSources) {
  const samples = Math.max(1, Math.floor(audioContext.sampleRate * Math.max(0.05, duration)));
  const buffer = audioContext.createBuffer(1, samples, audioContext.sampleRate);
  const data = buffer.getChannelData(0);
  const rng = mulberry32(hashSeed(`dust:${startsAt}:${duration}`));
  for (let i = 0; i < samples; i += 1) {
    const t = i / audioContext.sampleRate;
    const env = Math.exp(-3.2 * t);
    const crackle = rng() > 0.86 ? (rng() * 2 - 1) * 0.9 : 0;
    data[i] = ((rng() * 2 - 1) * 0.42 + crackle) * env;
  }
  const source = audioContext.createBufferSource();
  const gain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = 1800 * filterMultiplier;
  filter.Q.value = 0.48;
  gain.gain.setValueAtTime(0.0001, startsAt);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, velocity), startsAt + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + Math.max(0.05, duration));
  source.buffer = buffer;
  source.connect(filter).connect(gain).connect(audioContext.destination);
  trackSource(source, activeSources);
  source.start(startsAt);
}

function playChipClick(audioContext, startsAt, velocity, filterMultiplier, activeSources) {
  const samples = Math.max(1, Math.floor(audioContext.sampleRate * 0.018));
  const buffer = audioContext.createBuffer(1, samples, audioContext.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < samples; i += 1) {
    const t = i / audioContext.sampleRate;
    data[i] = Math.sign(Math.sin(2 * Math.PI * 3600 * t)) * Math.exp(-180 * t);
  }
  const source = audioContext.createBufferSource();
  const gain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  filter.type = "highpass";
  filter.frequency.value = 1800 * filterMultiplier;
  gain.gain.setValueAtTime(Math.max(0.0001, velocity), startsAt);
  gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + 0.018);
  source.buffer = buffer;
  source.connect(filter).connect(gain).connect(audioContext.destination);
  trackSource(source, activeSources);
  source.start(startsAt);
}

function playNoise(audioContext, startsAt, duration, timbre, velocity, tone, activeSources) {
  const filterMultiplier = typeof tone === "number" ? tone : tone.filter ?? 1;
  const instrument = timbre.kind;
  if (instrument === "transient-field") {
    playTransientField(audioContext, startsAt, duration, timbre, velocity, tone, activeSources);
    return;
  }
  if (instrument === "kick") {
    playKick(audioContext, startsAt, timbre, velocity, filterMultiplier, activeSources);
    return;
  }
  const decay = instrument === "hat" ? timbre.decay : timbre.decay ?? duration;
  const samples = Math.max(1, Math.floor(audioContext.sampleRate * Math.max(0.018, decay)));
  const buffer = audioContext.createBuffer(1, samples, audioContext.sampleRate);
  const data = buffer.getChannelData(0);
  const rng = mulberry32(hashSeed(`${instrument}:${startsAt}:${duration}:${timbre.filter ?? 0}`));
  for (let i = 0; i < samples; i += 1) {
    const t = i / audioContext.sampleRate;
    const env = Math.exp(-t * (instrument === "hat" ? 42 : 16));
    const noise = rng() * 2 - 1;
    const body = instrument === "snare" ? Math.sin(2 * Math.PI * 185 * t) * (timbre.tone ?? 0.1) : 0;
    data[i] = (noise * (instrument === "hat" ? timbre.brightness ?? 1 : timbre.snap ?? 0.4) + body) * env;
  }
  const source = audioContext.createBufferSource();
  const gain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  filter.type = instrument === "snare" ? "bandpass" : "highpass";
  filter.frequency.value = (timbre.filter ?? (instrument === "hat" ? 5200 : 900)) * filterMultiplier;
  if (instrument === "snare") {
    filter.Q.value = 0.9 + (timbre.snap ?? 0.4);
  }
  gain.gain.setValueAtTime(velocity, startsAt);
  gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + Math.max(0.018, decay));
  source.buffer = buffer;
  source.connect(filter).connect(gain).connect(audioContext.destination);
  trackSource(source, activeSources);
  source.start(startsAt);
}

function playTransientField(audioContext, startsAt, duration, timbre, velocity, tone, activeSources) {
  const signal = timbre.signal ?? {};
  const output = audioContext.createGain();
  const envelopeConfig = signal.envelope ?? { attack: 0.004, decay: 0.18, release: 0.03 };
  const filterMultiplier = typeof tone === "number" ? tone : tone.filter ?? 1;
  const attackShape = typeof tone === "number" ? 0 : tone.attackShape ?? 0;
  const attackScale = 2 ** (-attackShape * 1.4);
  const decayScale = 2 ** (-attackShape * 0.75);
  const attackDuration = Math.max(0.001, envelopeConfig.attack * attackScale);
  const transientDecay = Math.max(0.02, envelopeConfig.decay * decayScale);
  const effectiveDuration = Math.min(Math.max(0.03, duration + transientDecay), transientDecay + envelopeConfig.release + 0.16);
  output.gain.setValueAtTime(0.0001, startsAt);
  output.gain.exponentialRampToValueAtTime(Math.max(0.0001, velocity), startsAt + attackDuration);
  output.gain.exponentialRampToValueAtTime(0.0001, startsAt + effectiveDuration);
  const sourceInput = connectPlaybackBody(audioContext, output, signal.body, startsAt, effectiveDuration, activeSources);
  output.connect(audioContext.destination);

  const noiseDuration = Math.max(0.04, effectiveDuration + 0.04);
  for (const band of signal.bands ?? []) {
    playTransientBand(audioContext, startsAt, noiseDuration, band, filterMultiplier, sourceInput, activeSources, attackShape);
  }
  if (signal.click) {
    playTransientBand(audioContext, startsAt, Math.max(0.025, signal.click.decay * decayScale + 0.02), signal.click, filterMultiplier, sourceInput, activeSources, attackShape, true);
  }
  for (const resonator of signal.resonators ?? []) {
    playTransientFieldResonator(audioContext, startsAt, resonator, sourceInput, activeSources, attackShape);
  }
}

function playTransientBand(audioContext, startsAt, duration, band, filterMultiplier, destination, activeSources, attackShape = 0, isClick = false) {
  const samples = Math.max(1, Math.floor(audioContext.sampleRate * duration));
  const buffer = audioContext.createBuffer(1, samples, audioContext.sampleRate);
  const data = buffer.getChannelData(0);
  const rng = mulberry32(hashSeed(`transient-band:${startsAt}:${duration}:${band.frequency ?? 1200}`));
  for (let i = 0; i < samples; i += 1) {
    data[i] = rng() * 2 - 1;
  }
  const source = audioContext.createBufferSource();
  const filter = audioContext.createBiquadFilter();
  const gain = audioContext.createGain();
  filter.type = "bandpass";
  filter.frequency.value = (band.frequency ?? 1500) * filterMultiplier;
  filter.Q.value = band.q ?? 1;
  const clickScale = isClick ? 2 ** (attackShape * 0.35) : 1;
  const decayScale = 2 ** (-attackShape * 0.75);
  gain.gain.setValueAtTime(Math.max(0.0001, (band.gain ?? 0.1) * clickScale), startsAt);
  gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + Math.max(0.008, (band.decay ?? 0.12) * decayScale));
  source.buffer = buffer;
  source.connect(filter).connect(gain).connect(destination);
  trackSource(source, activeSources);
  source.start(startsAt);
  source.stop(startsAt + duration + 0.02);
}

function playTransientFieldResonator(audioContext, startsAt, resonator, destination, activeSources, attackShape = 0) {
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  const decayScale = 2 ** (-attackShape * 0.65);
  oscillator.type = "sine";
  oscillator.frequency.setValueAtTime(resonator.frequency ?? 160, startsAt);
  gain.gain.setValueAtTime(Math.max(0.0001, resonator.gain ?? 0.08), startsAt);
  gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + Math.max(0.02, (resonator.decay ?? 0.16) * decayScale));
  oscillator.connect(gain).connect(destination);
  trackSource(oscillator, activeSources);
  oscillator.start(startsAt);
  oscillator.stop(startsAt + Math.max(0.04, (resonator.decay ?? 0.16) * decayScale + 0.08));
}

function connectPlaybackBody(audioContext, dryInput, body, startsAt, duration, activeSources) {
  if (!body) {
    return dryInput;
  }
  const input = audioContext.createGain();
  const dry = audioContext.createGain();
  const wet = audioContext.createGain();
  dry.gain.value = 1;
  wet.gain.value = body.gain ?? 0.18;
  input.connect(dry).connect(dryInput);
  if (body.type === "bandpass") {
    const filter = audioContext.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = body.frequency ?? 640;
    filter.Q.value = body.q ?? 1;
    input.connect(filter).connect(wet).connect(dryInput);
  }
  if (body.type === "comb") {
    const delay = audioContext.createDelay(0.05);
    const feedback = audioContext.createGain();
    delay.delayTime.value = body.delay ?? 0.012;
    feedback.gain.value = body.feedback ?? 0.18;
    input.connect(delay).connect(feedback).connect(delay);
    delay.connect(wet).connect(dryInput);
    const silent = audioContext.createConstantSource();
    silent.offset.value = 0;
    trackSource(silent, activeSources);
    silent.start(startsAt);
    silent.stop(startsAt + duration + 0.2);
  }
  return input;
}

function playKick(audioContext, startsAt, timbre, velocity, filterMultiplier, activeSources) {
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  const duration = Math.max(0.06, timbre.decay ?? 0.14);
  oscillator.type = "sine";
  oscillator.frequency.setValueAtTime(timbre.pitchStart ?? 64, startsAt);
  oscillator.frequency.exponentialRampToValueAtTime(Math.max(20, timbre.pitchEnd ?? 36), startsAt + duration);
  filter.type = "lowpass";
  filter.frequency.value = 700 * filterMultiplier;
  gain.gain.setValueAtTime(Math.max(0.0001, velocity), startsAt);
  gain.gain.exponentialRampToValueAtTime(0.0001, startsAt + duration);
  oscillator.connect(filter).connect(gain).connect(audioContext.destination);
  trackSource(oscillator, activeSources);
  oscillator.start(startsAt);
  oscillator.stop(startsAt + duration + 0.03);

      return sum;
    },
  };
}

function randomNoise(rng, continuity) {
  const attackGain = rng() ** (1.9 + continuity * 0.8) * (0.16 + (1 - continuity) * 0.16);
  const sustainGain = rng() ** (2.5 - continuity * 0.5) * (0.09 + continuity * 0.18);
  const carrierChance = rng();
  if (carrierChance < 0.055 + continuity * 0.075) {
    return {
      role: "carrier",
      gain: round4(randomRange(rng, 0.08, 0.28)),
      decay: round4(randomRange(rng, 0.28, 1.05)),
      filter: bandpass(round4(logRange(rng, 520, 3200)), round4(randomRange(rng, 0.32, 1.05))),
    };
  }
  if (sustainGain > Math.max(0.035, attackGain * 0.8)) {
    return {
      role: "sustain",
      gain: round4(sustainGain),
      decay: round4(randomRange(rng, 0.38, 1.15)),
      filter: bandpass(round4(logRange(rng, 700, 3600)), round4(randomRange(rng, 0.28, 0.82))),
    };
  }
  if (attackGain > 0.035) {
    return {
      role: "attack",
      gain: round4(attackGain),
      decay: round4(randomRange(rng, 0.018, 0.11)),
      filter: bandpass(round4(logRange(rng, 650, 4200)), round4(randomRange(rng, 0.35, 1.1))),
    };
  }
  return null;
}

function randomBody(rng, referenceFrequency, continuity) {
  const draw = rng();
  const bodyScale = 1 - continuity * 0.55;
  if (draw < 0.22 * bodyScale) {
    return {
      type: "bandpass",
      frequency: round4(logRange(rng, referenceFrequency * 0.75, referenceFrequency * 4.2)),
      q: round4(randomRange(rng, 0.55, 2.4)),
      gain: round4(rng() ** 1.8 * 0.18),
    };
  }
  if (draw < 0.36 * bodyScale) {
    return {
      type: "comb",
      delay: round4(randomRange(rng, 0.004, 0.026)),
      feedback: round4(randomRange(rng, 0.06, 0.26)),
      gain: round4(rng() ** 1.7 * 0.14),
    };
  }
  return null;
}

function randomPitchMotion(rng) {
  const vibrato = rng() < 0.16;
  const jitter = rng() < 0.1;
  if (!vibrato && !jitter) {
    return null;
  }
  const pitch = {};
  if (vibrato) {
    pitch.vibratoCents = round4(randomRange(rng, 3.5, 17));
    pitch.vibratoRate = round4(randomRange(rng, 4.2, 6.6));
  }
  if (jitter) {
    pitch.jitterCents = round4(randomRange(rng, 2.5, 18));
    pitch.jitterRate = round4(randomRange(rng, 8, 20));
  }
  return pitch;
}

function randomFromSeed(seed) {
  let state = 2166136261;
  const text = String(seed);
  for (let index = 0; index < text.length; index += 1) {
    state ^= text.charCodeAt(index);
    state = Math.imul(state, 16777619);
  }
  return () => {
    state += 0x6d2b79f5;
    let value = state;
    value = Math.imul(value ^ (value >>> 15), value | 1);
    value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
    return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
  };
}

function normal(rng) {
  const left = Math.max(1e-8, rng());
  const right = Math.max(1e-8, rng());
  return Math.sqrt(-2 * Math.log(left)) * Math.cos(2 * Math.PI * right);
}

function logNormal(rng, meanLog, sigma) {
  return Math.exp(meanLog + normal(rng) * sigma);
}

function randomRange(rng, min, max) {
  return min + rng() * (max - min);
}

function logRange(rng, min, max) {
  return Math.exp(Math.log(min) + rng() * (Math.log(max) - Math.log(min)));
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function clampInt(value, min, max) {
  return Math.min(max, Math.max(min, Math.floor(value)));
}

function envelope(attack, sustain, release, durationScale) {
  return { attack, sustain, release, durationScale };
}

function lowpass(frequency, q, endFrequency = null) {
  return { type: "lowpass", frequency, q, endFrequency };
}

function bandpass(frequency, q, endFrequency = null) {
  return { type: "bandpass", frequency, q, endFrequency };
}

function round4(value) {
  return Math.round(value * 10000) / 10000;
}


const KEYS = [
  ["C", 60],
  ["D", 62],
  ["E", 64],
  ["F", 65],
  ["G", 67],
  ["A", 69],
  ["Bb", 70],
];

const SCALES = {
  ionian: [0, 2, 4, 5, 7, 9, 11],
  naturalMinor: [0, 2, 3, 5, 7, 8, 10],
  mixolydian: [0, 2, 4, 5, 7, 9, 10],
  dorian: [0, 2, 3, 5, 7, 9, 10],
  lydian: [0, 2, 4, 6, 7, 9, 11],
  phrygian: [0, 1, 3, 5, 7, 8, 10],
  majorPentatonic: [0, 2, 4, 7, 9],
  minorPentatonic: [0, 3, 5, 7, 10],
  suspendedPentatonic: [0, 2, 5, 7, 10],
};

const DEFAULT_HEIGHT = 0.5;
const DEFAULT_BRIGHTNESS = 0.5;
const DEFAULT_PRESENCE = 0.5;
const DEFAULT_ATTACK = 0.5;
const DEFAULT_BPM = 100;
const DEFAULT_VOLUME = 0.5;
const DEFAULT_BARS = 32;
const BAR_OPTIONS = [8, 16, 32, 64];
const TRANSITION_BRIDGE_IMPACT = 0.22;
const TRANSITION_ENVELOPE_IMPACT = 0.46;

const COMPOSITION_ROLES = ["identity", "time", "tone", "motion", "color", "boundary"];

function splitCompositionSeed(seedText) {
  const text = String(seedText);
  if (text.length <= 2) {
    return { variation: text, style: text, width: 0 };
  }
  return {
    variation: text,
    style: text.slice(2),
    width: 2,
  };
}

function generateSong(seed, options = {}) {
  const seedText = String(seed);
  const seedParts = splitCompositionSeed(seedText);
  const styleRng = mulberry32(hashSeed(`style:${seedParts.style}`));
  const compositionRng = mulberry32(hashSeed(`composition:${seedText}`));
  const height = clamp(Number(options.height ?? options.focus ?? DEFAULT_HEIGHT), 0, 1);
  const brightness = clamp(Number(options.brightness ?? options.tone ?? DEFAULT_BRIGHTNESS), 0, 1);
  const presence = clamp(Number(options.presence ?? DEFAULT_PRESENCE), 0, 1);
  const attack = clamp(Number(options.attack ?? options.punch ?? DEFAULT_ATTACK), 0, 1);
  const bpm = clamp(Math.round(Number(options.bpm ?? DEFAULT_BPM)), 40, 180);
  const volume = clamp(Number(options.volume ?? DEFAULT_VOLUME), 0, 1);
  const bars = normalizeBars(options.bars);
  const [key, tonic] = pick(KEYS, styleRng);
  const scaleName = weightedPick([
    { item: "majorPentatonic", weight: 0.18 },
    { item: "minorPentatonic", weight: 0.18 },
    { item: "suspendedPentatonic", weight: 0.1 },
    { item: "ionian", weight: 0.14 },
    { item: "naturalMinor", weight: 0.14 },
    { item: "dorian", weight: 0.12 },
    { item: "mixolydian", weight: 0.09 },
    { item: "lydian", weight: 0.03 },
    { item: "phrygian", weight: 0.02 },
  ], styleRng);
  const scale = SCALES[scaleName];
  const form = buildCompositionForm(styleRng);
  const roles = assignRoles(styleRng, form);
  const timbres = assignTimbres(styleRng, roles, seedParts.style);
  const progression = buildProgression(compositionRng, scale.length);
  const sectionPlan = markLoopHandoff(stabilizeBackboneContinuity(buildSectionPlan(compositionRng, form, roles, bars / 8)));
  const barPlan = buildBarStateTrajectory(sectionPlan, bars);
  const stepsPerBar = 16;
  const events = [];

  for (let bar = 0; bar < bars; bar += 1) {
    const section = Math.floor(bar / 8);
    const localBar = bar % 8;
    const sectionState = withPhraseBar(sectionPlan[section], barPlan[bar].phraseBar);
    const chordRoot = progression[(bar + sectionState.progressionShift) % progression.length] + sectionState.degreeOffset;
    const chord = buildChord(tonic, scale, chordRoot);
    addIdentity(events, sectionState.roles.identity, timbres, tonic, scale, chordRoot, bar, localBar, sectionState, seedText);
    addTime(events, sectionState.roles.time, timbres, chord, bar, localBar, sectionState, seedText);
    addTone(events, sectionState.roles.tone, timbres, chord, bar, localBar, sectionState, seedText);
    addMotion(events, sectionState.roles.motion, timbres, tonic, scale, chordRoot, bar, localBar, sectionState, seedText);
    addColor(events, sectionState.roles.color, timbres, chord, bar, localBar, sectionState, seedText);
    addBoundary(events, sectionState.roles.boundary, timbres, tonic, scale, bar, localBar, sectionState, seedText);
    addSectionBridge(events, tonic, scale, bar, localBar, sectionState, seedText);
    addSectionEntryBridge(events, tonic, scale, chord, bar, localBar, sectionState, seedText);
  }

  events.sort((a, b) => a.step - b.step || a.track.localeCompare(b.track));
  const playbackScore = buildPlaybackScore({
    seed: seedText,
    height,
    brightness,
    presence,
    attack,
    bpm,
    volume,
    bars,
    stepsPerBar,
    events,
    timbres,
  });

  return {
    input: {
      seed: seedText,
      height,
      focus: height,
      brightness,
      presence,
      attack,
      punch: attack,
      bpm,
      volume,
      bars,
    },
    playbackScore,
    debug: {
      seedParts,
      key,
      scale: scaleName,
      form,
      roles,
      timbres,
      progression: progression.map((degree) => degree + 1),
      sectionPlan,
      barPlan,
      trackMapping: trackMappingFor(roles),
    },
  };
}

function randomPreset(seed = Date.now()) {
  const rng = mulberry32(hashSeed(String(seed)));
  return {
    seed: randomInt(rng, 100000, 999999).toString(),
    height: DEFAULT_HEIGHT,
    focus: DEFAULT_HEIGHT,
    brightness: DEFAULT_BRIGHTNESS,
    presence: DEFAULT_PRESENCE,
    attack: DEFAULT_ATTACK,
    punch: DEFAULT_ATTACK,
    tone: DEFAULT_BRIGHTNESS,
    bpm: DEFAULT_BPM,
    bars: DEFAULT_BARS,
  };
}

function buildCompositionForm(rng) {
  const focus = weightedPick([
    { item: "identity", weight: 0.28 },
    { item: "time", weight: 0.18 },
    { item: "tone", weight: 0.18 },
    { item: "motion", weight: 0.2 },
    { item: "color", weight: 0.16 },
  ], rng);
  return {
    focus,
    density: round2(0.28 + rng() * 0.56),
    space: round2(rng()),
    contrast: round2(rng()),
    pulse: round2(rng()),
  };
}

function assignRoles(rng, form) {
  const identityCarrier = weightedPick([
    { item: "melodic-line", weight: form.focus === "identity" ? 0.48 : 0.28 },
    { item: "bass-riff", weight: form.focus === "time" ? 0.26 : 0.16 },
    { item: "harmony-arp", weight: form.focus === "motion" ? 0.3 : 0.18 },
    { item: "rhythm-hook", weight: form.focus === "time" ? 0.28 : 0.14 },
  ], rng);
  const timeCarrier = weightedPick([
    { item: "drum-grid", weight: identityCarrier === "rhythm-hook" ? 0 : form.focus === "time" ? 0.44 : 0.25 },
    { item: "bass-pulse", weight: 0.25 },
    { item: "arp-pulse", weight: form.focus === "motion" ? 0.3 : 0.18 },
    { item: "thin-pulse", weight: form.space > 0.68 ? 0.34 : 0.12 },
  ], rng);
  const toneCarrier = weightedPick([
    { item: "root-bass", weight: 0.34 },
    { item: "chord-pad", weight: form.focus === "color" ? 0.34 : 0.24 },
    { item: "drone", weight: form.space > 0.58 ? 0.24 : 0.12 },
    { item: "implied", weight: form.density > 0.62 ? 0.22 : 0.1 },
  ], rng);
  const motionCarrier = weightedPick([
    { item: "none", weight: form.density > 0.68 ? 0.24 : 0.08 },
    { item: "answer-line", weight: identityCarrier === "melodic-line" ? 0.28 : 0.14 },
    { item: "harmony-arp", weight: timeCarrier !== "arp-pulse" ? 0.25 : 0.08 },
    { item: "bass-walk", weight: toneCarrier === "root-bass" ? 0.2 : 0.08 },
    { item: "percussion-fill", weight: timeCarrier === "drum-grid" ? 0.18 : 0.08 },
  ], rng);
  const colorCarrier = weightedPick([
    { item: "none", weight: form.focus === "color" ? 0.06 : 0.18 },
    { item: "air-pad", weight: 0.24 },
    { item: "noise-halo", weight: 0.2 },
    { item: "organ-bed", weight: 0.16 },
    { item: "bright-accent", weight: form.contrast > 0.56 ? 0.2 : 0.08 },
  ], rng);
  const boundaryCarrier = weightedPick([
    { item: "rest-gap", weight: form.space > 0.6 ? 0.28 : 0.1 },
    { item: "drum-fill", weight: timeCarrier === "drum-grid" ? 0.26 : 0.12 },
    { item: "contrast-note", weight: form.contrast > 0.42 ? 0.28 : 0.12 },
    { item: "register-turn", weight: identityCarrier === "melodic-line" ? 0.2 : 0.1 },
  ], rng);
  return {
    identity: role("identity", identityCarrier),
    time: role("time", timeCarrier),
    tone: role("tone", toneCarrier),
    motion: role("motion", motionCarrier),
    color: role("color", colorCarrier),
    boundary: role("boundary", boundaryCarrier),
  };
}

function role(name, carrier) {
  return { name, carrier };
}

function rolesWithCarriers(baseRoles) {
  return Object.fromEntries(COMPOSITION_ROLES.map((name) => [
    name,
    role(name, baseRoles[name].carrier),
  ]));
}

function assignTimbres(rng, roles, seedText) {
  const pitched = Object.fromEntries(COMPOSITION_ROLES.map((name) => [
    name,
    pitchedFieldTimbre(`${seedText}:pitched:${name}:${roles[name].carrier}`, name),
  ]));
  const transient = {
    kick: transientFieldTimbre(`${seedText}:transient:kick`, "kick"),
    snare: transientFieldTimbre(`${seedText}:transient:snare`, "snare"),
    hat: transientFieldTimbre(`${seedText}:transient:hat`, "hat"),
  };
  return { pitched, transient };
}

function buildSectionPlan(rng, form, roles, sectionCount = 8) {
  const trajectory = buildStateTrajectory(rng, form, sectionCount);
  const motifVariants = buildMotifVariantTrajectory(rng, trajectory);
  return trajectory.map((state, index) => realizeSectionState(state, index, rng, roles, motifVariants[index]));
}

function buildMotifVariantTrajectory(rng, trajectory) {
  const sectionCount = trajectory.length;
  const familyCount = clamp(
    Math.round(1.52 + Math.sqrt(sectionCount) * 0.38 + rng() * 0.9),
    1,
    Math.max(1, Math.min(4, sectionCount)),
  );
  const families = Array.from({ length: familyCount }, () => randomInt(rng, 0, 9999));
  const dwell = weightedPick([
    { item: 1.45, weight: 0.18 + Math.max(0, 5 - sectionCount) * 0.04 },
    { item: 1.85, weight: 0.42 },
    { item: 2.35, weight: 0.3 },
    { item: 2.9, weight: 0.1 + Math.max(0, sectionCount - 5) * 0.04 },
  ], rng);
  const phase = rng() * 0.86;
  const stateDrift = 0.2 + rng() * 0.36;
  const closureReturn = rng() * 0.28;
  return trajectory.map((state, index) => {
    const phrasePosition = index / dwell
      + phase
      + state.memoryDistance * stateDrift
      + state.tension * 0.12
      - state.closurePressure * state.progress * closureReturn;
    const familyIndex = ((Math.floor(phrasePosition) % familyCount) + familyCount) % familyCount;
    return families[familyIndex];
  });
}

function buildStateTrajectory(rng, form, sectionCount) {
  if (sectionCount <= 1) {
    return [sectionVector(0, 0.08, 0.88, 0.42, 0.22, 0.86, 0.06)];
  }

  const trajectory = [];
  for (let index = 0; index < sectionCount; index += 1) {
    const progress = sectionCount <= 1 ? 0 : index / (sectionCount - 1);
    const previous = trajectory[index - 1] ?? null;
    const middleLift = Math.sin(progress * Math.PI);
    const noveltyBase = index === 0
      ? 0.08
      : clamp(0.1 + form.contrast * 0.28 + progress * 0.23 + middleLift * form.contrast * 0.12 + (rng() - 0.5) * 0.34, 0.02, 0.92);
    const closureBase = index === sectionCount - 1
      ? clamp(0.78 + rng() * 0.18, 0, 1)
      : clamp(0.16 + progress * progress * 0.42 + (rng() - 0.5) * 0.24, 0.04, 0.78);
    const memoryDistance = previous
      ? clamp(previous.memoryDistance * (0.48 + rng() * 0.22) + noveltyBase * 0.62 + middleLift * form.contrast * 0.08 - closureBase * 0.2, 0, 0.96)
      : 0.06;
    const tension = clamp(0.16 + noveltyBase * 0.5 + memoryDistance * 0.26 + progress * 0.14 + middleLift * form.contrast * 0.06 - closureBase * 0.22 + (rng() - 0.5) * 0.22, 0.04, 0.94);
    const density = clamp(form.density * 0.34 + 0.28 + tension * 0.22 + noveltyBase * 0.16 - form.space * 0.14 + (rng() - 0.5) * 0.18, 0.12, 0.92);
    const stability = clamp(0.9 - noveltyBase * 0.42 - memoryDistance * 0.22 - tension * 0.16 + closureBase * 0.24 + (rng() - 0.5) * 0.12, 0.08, 0.96);
    trajectory.push(sectionVector(progress, noveltyBase, stability, density, tension, closureBase, memoryDistance));
  }
  enforceStateTrajectory(trajectory, rng, sectionCount);
  return trajectory.slice(0, sectionCount);
}

function enforceStateTrajectory(trajectory, rng, sectionCount) {
  if (sectionCount >= 4 && !trajectory.some((state) => state.memoryDistance >= 0.5 || state.tension >= 0.68)) {
    const index = sectionCount === 4 ? 2 : randomInt(rng, 2, Math.max(2, sectionCount - 2));
    trajectory[index] = sectionVector(index / (sectionCount - 1), 0.68 + rng() * 0.18, 0.24 + rng() * 0.16, 0.56 + rng() * 0.22, 0.68 + rng() * 0.18, 0.24 + rng() * 0.16, 0.58 + rng() * 0.24);
  }
  if (sectionCount >= 8 && !trajectory.slice(4).some((state) => state.memoryDistance >= 0.5 || state.closurePressure >= 0.68 || state.density <= 0.32)) {
    const index = randomInt(rng, 4, sectionCount - 2);
    trajectory[index] = sectionVector(index / (sectionCount - 1), 0.58 + rng() * 0.28, 0.22 + rng() * 0.18, 0.24 + rng() * 0.54, 0.56 + rng() * 0.26, 0.34 + rng() * 0.34, 0.54 + rng() * 0.3);
  }
  const finalIndex = trajectory.length - 1;
  trajectory[finalIndex] = sectionVector(1, trajectory[finalIndex].novelty * 0.62, 0.68 + rng() * 0.22, trajectory[finalIndex].density, trajectory[finalIndex].tension * 0.72, 0.82 + rng() * 0.14, trajectory[finalIndex].memoryDistance * 0.48);
}

function sectionVector(progress, novelty, stability, density, tension, closurePressure, memoryDistance) {
  return {
    progress: round2(clamp(progress, 0, 1)),
    novelty: round2(clamp(novelty, 0, 1)),
    stability: round2(clamp(stability, 0, 1)),
    density: round2(clamp(density, 0, 1)),
    tension: round2(clamp(tension, 0, 1)),
    closurePressure: round2(clamp(closurePressure, 0, 1)),
    memoryDistance: round2(clamp(memoryDistance, 0, 1)),
  };
}

function realizeSectionState(state, index, rng, baseRoles, motifVariant) {
  const variant = variantForState(state, rng);
  const degreeOffset = degreeOffsetForState(state, rng);
  const progressionShift = progressionShiftForState(state, rng);
  const energy = clamp(0.36 + state.density * 0.34 + state.tension * 0.24 + state.closurePressure * 0.16, 0.16, 0.96);
  const identityLevel = 0.76 + energy * 0.34 + state.stability * 0.12 - (state.density < 0.28 ? 0.16 : 0);
  const motionLevel = 0.66 + energy * 0.48 + state.memoryDistance * 0.18 + state.tension * 0.12 - state.closurePressure * 0.08;
  const colorLevel = 0.52 + state.density * 0.48 + state.novelty * 0.12;
  const boundaryLevel = 0.68 + state.closurePressure * 0.42 + state.memoryDistance * 0.18;
  const section = sectionState(
    index,
    variant,
    degreeOffset,
    progressionShift,
    clamp(identityLevel + state.progress * 0.01, 0.62, 1.28),
    clamp(motionLevel, 0.56, 1.36),
    clamp(colorLevel, 0.44, 1.24),
    clamp(boundaryLevel, 0.7, 1.34),
    motifVariant,
    state,
    energy,
    rolesWithCarriers(baseRoles),
  );
  return section;
}

function variantForState(state, rng) {
  if (state.progress === 0) return 0;
  if (state.closurePressure > 0.72) return weightedPick([{ item: 0, weight: 0.28 }, { item: 1, weight: 0.24 }, { item: 3, weight: 0.48 }], rng);
  if (state.density < 0.32) return weightedPick([{ item: 0, weight: 0.36 }, { item: 3, weight: 0.42 }, { item: 1, weight: 0.22 }], rng);
  return state.memoryDistance > 0.5 ? pick([2, 3], rng) : pick([1, 2], rng);
}

function degreeOffsetForState(state, rng) {
  if (state.progress === 0) return 0;
  const center = Math.round((state.novelty - state.stability) * 2.2 + state.tension * 1.4 - state.closurePressure * 0.8);
  const width = state.memoryDistance > 0.55 ? 3 : 2;
  return clamp(center + randomInt(rng, -width, width), -2, 3);
}

function progressionShiftForState(state, rng) {
  if (state.progress === 0) return 0;
  const pullHome = state.closurePressure > 0.68 || state.stability > 0.72;
  return weightedPick([
    { item: 0, weight: pullHome ? 0.34 : 0.08 },
    { item: 1, weight: 0.18 + state.novelty * 0.16 },
    { item: 2, weight: 0.22 + state.tension * 0.18 },
    { item: 3, weight: 0.16 + state.memoryDistance * 0.24 },
  ], rng);
}

function sectionState(index, variant, degreeOffset, progressionShift, identityLevel, motionLevel, colorLevel, boundaryLevel, motifVariant, state, energy, roles) {
  return {
    name: `section-${index}`,
    index,
    variant,
    motifVariant,
    roles,
    degreeOffset,
    progressionShift,
    progress: state.progress,
    novelty: state.novelty,
    stability: state.stability,
    density: state.density,
    tension: state.tension,
    closurePressure: state.closurePressure,
    memoryDistance: state.memoryDistance,
    energy: round2(energy),
    identityLevel: round2(identityLevel),
    motionLevel: round2(motionLevel),
    colorLevel: round2(colorLevel),
    boundaryLevel: round2(boundaryLevel),
  };
}

function buildPhraseShape(index, variant, degreeOffset, progressionShift, motifVariant, state, context = {}) {
  const rng = mulberry32(hashSeed([
    index,
    variant,
    degreeOffset,
    progressionShift,
    motifVariant,
    state.novelty,
    state.stability,
    state.density,
    state.tension,
    state.closurePressure,
    state.memoryDistance,
  ].join(":")));
  const curve = buildPhraseEnergyCurve(rng, state, variant);
  const rawEnergies = Array.from({ length: 8 }, (_, index) => phraseEnergyAt(index, curve, rng));
  const energies = rawEnergies.map((energy, index) => contextualPhraseEnergy(energy, context, index));
  const bars = [];
  let previousTarget = 0;
  for (let index = 0; index < 8; index += 1) {
    const energy = energies[index];
    const nextEnergy = energies[Math.min(7, index + 1)];
    const previousEnergy = energies[Math.max(0, index - 1)];
    const slopeIn = energy - previousEnergy;
    const slopeOut = nextEnergy - energy;
    const barState = phraseBarState(index, energy, slopeIn, slopeOut, previousTarget, state, rng);
    const entryProgress = transitionEntryProgress(context, index);
    const boundary = phraseBoundaryForBar(index, barState, slopeIn, slopeOut, energy, rng) * entryProgress;
    const pickup = phrasePickupForBar(index, energy, slopeOut, boundary, rng) * entryProgress;
    const space = phraseSpaceForBar(energy, barState, rng);
    bars.push({
      index,
      targetCenter: round2(barState.targetCenter),
      heightBias: round2(barState.heightBias),
      closure: round2(barState.closure),
      tension: round2(barState.tension),
      stability: round2(barState.stability),
      pace: round2(barState.pace),
      energy: round2(energy),
      space: round2(space),
      boundary: round2(boundary),
      pickup: round2(pickup),
      toneAnchor: phraseToneAnchor(index, barState, energy, boundary, rng),
      colorAccent: phraseColorAccent(index, energy, pickup, space, rng),
      syncopation: round2(clamp(0.18 + rng() * 0.5 + pickup * 0.25 + Math.abs(slopeOut) * 0.18, 0.16, 0.84)),
    });
    previousTarget = barState.targetCenter;
  }
  return { archetype: curve.archetype, curve, bars };
}

function transitionEntryProgress(context, barIndex) {
  const incomingImpact = Number(context.transitionIn?.impact ?? 0);
  if (incomingImpact < TRANSITION_ENVELOPE_IMPACT) {
    return 1;
  }
  const bars = transitionSpan(incomingImpact);
  if (barIndex >= bars) {
    return 1;
  }
  return smoothstep((barIndex + 1) / (bars + 1));
}

function transitionExitProgress(context, barIndex) {
  const outgoingImpact = Number(context.transitionOut?.impact ?? 0);
  if (outgoingImpact < TRANSITION_ENVELOPE_IMPACT) {
    return 0;
  }
  const bars = transitionSpan(outgoingImpact);
  const start = 8 - bars;
  if (barIndex < start) {
    return 0;
  }
  return smoothstep((barIndex - start + 1) / (bars + 1));
}

function contextualPhraseEnergy(energy, context, barIndex) {
  const sectionEnergy = Number(context.sectionEnergy ?? 0);
  const entry = transitionEntryProgress(context, barIndex);
  const exit = transitionExitProgress(context, barIndex);
  const entryScale = interpolate(sectionEnergyRatio(context.previousSectionEnergy, sectionEnergy), 1, entry);
  const exitScale = interpolate(1, sectionEnergyRatio(context.nextSectionEnergy, sectionEnergy), exit);
  return clamp(energy * entryScale * exitScale, 0.48, 1.28);
}

function sectionEnergyRatio(referenceEnergy, sectionEnergy) {
  const reference = Number(referenceEnergy);
  const current = Number(sectionEnergy);
  if (!Number.isFinite(reference) || !Number.isFinite(current) || current <= 0) {
    return 1;
  }
  return clamp((0.42 + reference) / (0.42 + current), 0.78, 1.12);
}

function smoothstep(value) {
  const x = clamp(value, 0, 1);
  return x * x * (3 - 2 * x);
}

function buildPhraseEnergyCurve(rng, state, variant) {
  const firstPivot = randomInt(rng, 1, 3);
  const secondPivot = randomInt(rng, 4, 6);
  const latePressure = state.closurePressure * 0.68 + state.stability * 0.18;
  const spreadPressure = state.memoryDistance * 0.56 + state.tension * 0.28;
  const peakIndex = weightedPick(Array.from({ length: 7 }, (_, offset) => {
    const candidate = offset + 1;
    return {
      item: candidate,
      weight: 0.08
        + gaussianScore(candidate, 2 + spreadPressure * 3.5, 1.8) * (1 - latePressure)
        + gaussianScore(candidate, 5.8, 1.4) * latePressure,
    };
  }), rng);
  const valleyIndex = weightedPick(Array.from({ length: 6 }, (_, offset) => {
    const candidate = offset + 1;
    return {
      item: candidate,
      weight: 0.08 + gaussianScore(candidate, 2.4 + state.stability * 2.8 + (1 - state.density) * 1.4, 1.9),
    };
  }), rng);
  const start = clamp(0.7 + state.stability * 0.22 + state.density * 0.24 + rng() * 0.26, 0.56, 1.24);
  const end = clamp(0.68 + state.closurePressure * 0.38 + state.tension * 0.16 + rng() * 0.26, 0.56, 1.36);
  const peak = clamp(Math.max(start, end) + 0.1 + state.tension * 0.2 + state.density * 0.1 + rng() * 0.2, 0.82, 1.38);
  const valley = clamp(Math.min(start, end) - 0.08 - (1 - state.density) * 0.18 - state.stability * 0.06 - rng() * 0.16, 0.44, 1.08);
  const midA = clamp(start + (rng() - 0.44) * 0.34 + variant * 0.025, 0.56, 1.28);
  const midB = clamp(end + (rng() - 0.5) * 0.36 - (1 - state.density) * 0.08, 0.52, 1.3);
  const controls = mergePhraseControls([
    { index: 0, value: start },
    { index: firstPivot, value: midA },
    { index: valleyIndex, value: valley },
    { index: peakIndex, value: peak },
    { index: secondPivot, value: midB },
    { index: 7, value: end },
  ]);
  const archetype = `state-${peakIndex}-${valleyIndex}-${Math.round(state.novelty * 10)}-${Math.round(state.closurePressure * 10)}`;
  return { archetype, controls, peakIndex, valleyIndex };
}

function mergePhraseControls(points) {
  const merged = new Map();
  for (const point of points) {
    const previous = merged.get(point.index);
    if (!previous || Math.abs(point.value - 1) > Math.abs(previous.value - 1)) {
      merged.set(point.index, point);
    }
  }
  return [...merged.values()].sort((left, right) => left.index - right.index);
}

function phraseEnergyAt(index, curve, rng) {
  let left = curve.controls[0];
  let right = curve.controls[curve.controls.length - 1];
  for (let controlIndex = 0; controlIndex < curve.controls.length - 1; controlIndex += 1) {
    const a = curve.controls[controlIndex];
    const b = curve.controls[controlIndex + 1];
    if (index >= a.index && index <= b.index) {
      left = a;
      right = b;
      break;
    }
  }
  const span = Math.max(1, right.index - left.index);
  const x = (index - left.index) / span;
  const eased = x * x * (3 - 2 * x);
  const wave = Math.sin((index + 1) * 0.85 + curve.peakIndex) * 0.04;
  const jitter = (rng() - 0.5) * 0.08;
  return clamp(interpolate(left.value, right.value, eased) + wave + jitter, 0.5, 1.36);
}

function phraseBarState(index, energy, slopeIn, slopeOut, previousTarget, state, rng) {
  const rising = slopeOut > 0.06;
  const falling = slopeOut < -0.06;
  const localProgress = index / 7;
  const closure = clamp(state.closurePressure * (0.42 + localProgress * 0.68) + Number(index === 7) * 0.42 + (falling ? 0.12 : 0) + (rng() - 0.5) * 0.14, 0, 1);
  const tension = clamp(state.tension * 0.72 + state.novelty * 0.2 + (rising ? 0.18 : 0) + Math.max(0, energy - 1) * 0.22 - closure * 0.18 + (rng() - 0.5) * 0.16, 0, 1);
  const stability = clamp(state.stability * 0.72 + closure * 0.26 - tension * 0.18 + (rng() - 0.5) * 0.12, 0, 1);
  const drift = clamp(previousTarget * 0.42 + (state.memoryDistance - 0.5) * 0.8 + slopeOut * 1.8 + (rng() - 0.5) * (0.8 + state.novelty), -1, 1);
  const targetCenter = clamp(drift * (1 - closure * 0.42) - stability * 0.24 + tension * 0.28, -1, 1);
  const heightBias = clamp((energy - 0.94) * 0.72 + tension * 0.36 - stability * 0.18 + (rng() - 0.5) * 0.28, -1, 1);
  const pace = clamp(0.18 + state.density * 0.46 + tension * 0.26 - stability * 0.16 + Math.max(0, energy - 1) * 0.14 + (rng() - 0.5) * 0.16, 0.08, 0.92);
  return { targetCenter, heightBias, closure, tension, stability, pace };
}

function phraseBoundaryForBar(index, barState, slopeIn, slopeOut, energy, rng) {
  if (index === 7) {
    return 1;
  }
  const turns = Math.sign(slopeIn) !== Math.sign(slopeOut) && Math.abs(slopeIn - slopeOut) > 0.08;
  const probability = 0.06 + barState.closure * 0.44 + (turns ? 0.18 : 0) + (energy > 1.12 ? 0.08 : 0);
  return rng() < probability ? clamp(0.42 + rng() * 0.28 + barState.closure * 0.34, 0, 0.92) : 0;
}

function phrasePickupForBar(index, energy, slopeOut, boundary, rng) {
  if (index >= 7) {
    return 0;
  }
  const lift = Math.max(0, slopeOut);
  const boundaryPush = boundary > 0.58 ? 0.12 : 0;
  return clamp((lift > 0.05 ? 0.2 + lift * 0.82 : rng() < 0.12 ? 0.18 : 0) + boundaryPush + (energy > 1.12 ? 0.06 : 0), 0, 0.74);
}

function phraseSpaceForBar(energy, barState, rng) {
  const lowEnergySpace = clamp(0.38 - energy * 0.18, 0, 0.28);
  const instabilitySpace = clamp((1 - barState.stability) * 0.2 + (1 - barState.tension) * 0.08, 0, 0.28);
  const closureSpace = barState.closure > 0.7 ? 0.08 : 0;
  return clamp(0.1 + lowEnergySpace + instabilitySpace + closureSpace + rng() * 0.22, 0.08, 0.78);
}

function phraseToneAnchor(index, barState, energy, boundary, rng) {
  if (index === 0 || index === 7 || barState.stability > 0.66 || barState.closure > 0.68) {
    return true;
  }
  return rng() < 0.2 + (energy < 0.92 ? 0.18 : 0) + (boundary > 0.58 ? 0.18 : 0);
}

function phraseColorAccent(index, energy, pickup, space, rng) {
  if (index === 7) {
    return rng() < 0.42;
  }
  return rng() < 0.14 + (energy > 1.04 ? 0.22 : 0) + pickup * 0.18 + (space > 0.48 ? 0.12 : 0);
}

function phraseBar(sectionState, localBar) {
  return sectionState.phraseBar ?? {
    index: localBar % 8,
    targetCenter: 0,
    heightBias: 0,
    closure: localBar === 7 ? 1 : 0.24,
    tension: 0.32,
    stability: 0.62,
    pace: 0.42,
    energy: 1,
    space: 0.24,
    boundary: localBar === 7 ? 1 : 0,
    pickup: 0,
    toneAnchor: localBar % 2 === 0,
    colorAccent: localBar === 1 || localBar === 5,
    syncopation: 0.42,
  };
}

function withPhraseBar(sectionState, barShape) {
  return {
    ...sectionState,
    phraseBar: barShape,
  };
}

function markLoopHandoff(sectionPlan) {
  const finalIndex = sectionPlan.length - 1;
  return sectionPlan.map((section, index) => ({
    ...section,
    loopHandoff: index === finalIndex,
    loopTarget: index === finalIndex ? {
      degreeOffset: 0,
      progressionShift: 0,
    } : null,
  }));
}

function stabilizeBackboneContinuity(sectionPlan) {
  if (sectionPlan.length <= 1) {
    return sectionPlan;
  }
  const backbone = COMPOSITION_ROLES;
  const result = [...sectionPlan];
  for (let pass = 0; pass < result.length * 2; pass += 1) {
    let changed = false;
    for (let index = 0; index < result.length; index += 1) {
      const nextIndex = (index + 1) % result.length;
      const currentCarriers = effectiveCarriers(result[index], backbone);
      const nextCarriers = effectiveCarriers(result[nextIndex], backbone);
      if (sharesContinuityCarrier(currentCarriers, nextCarriers, backbone)) {
        continue;
      }
      result[nextIndex] = withSectionRoleCarrier(result[nextIndex], "time", currentCarriers.time);
      changed = true;
    }
    if (!changed) {
      break;
    }
  }
  return result;
}

function buildBarStateTrajectory(sectionPlan, bars) {
  if (sectionPlan.length === 0 || bars <= 0) {
    return [];
  }
  return sectionPlan.flatMap((section, index) => {
    const hasLoopNeighbor = sectionPlan.length > 1;
    const previous = index > 0 ? sectionPlan[index - 1] : hasLoopNeighbor ? sectionPlan[sectionPlan.length - 1] : null;
    const next = index < sectionPlan.length - 1 ? sectionPlan[index + 1] : hasLoopNeighbor ? sectionPlan[0] : null;
    const transitionIn = previous ? transitionContext(previous, section) : null;
    const transitionOut = next ? transitionContext(section, next) : null;
