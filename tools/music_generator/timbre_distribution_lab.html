<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timbre Distribution Lab</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0d0f12;
        color: #edf2f7;
      }

      body {
        margin: 0;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 20px 0;
        display: grid;
        justify-items: center;
      }

      main {
        width: min(1040px, calc(100vw - 24px));
        display: grid;
        gap: 12px;
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: end;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0;
      }

      a {
        color: #91d9c2;
        font-size: 13px;
        text-decoration: none;
      }

      .panel {
        border: 1px solid #28323a;
        border-radius: 8px;
        background: #151a1f;
        overflow: hidden;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
      }

      .controls {
        padding: 14px;
        display: grid;
        grid-template-columns: minmax(150px, 1fr) 86px auto auto auto minmax(170px, 1fr);
        gap: 12px;
        align-items: end;
      }

      .field {
        display: grid;
        gap: 7px;
        min-width: 0;
      }

      label,
      .label {
        color: #9aa8b4;
        font-size: 12px;
      }

      input[type="text"],
      input[type="number"] {
        width: 100%;
        min-width: 0;
        height: 38px;
        box-sizing: border-box;
        border: 1px solid #34424d;
        border-radius: 8px;
        background: #0d0f12;
        color: #edf2f7;
        padding: 0 10px;
        font: inherit;
      }

      input[type="range"] {
        width: 100%;
        accent-color: #91d9c2;
      }

      button {
        min-width: 40px;
        height: 40px;
        padding: 0 14px;
        display: inline-grid;
        place-items: center;
        border: 0;
        border-radius: 999px;
        background: #91d9c2;
        color: #0d0f12;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button.secondary {
        background: #28323a;
        color: #edf2f7;
      }

      .field-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
      }

      .value {
        font-size: 13px;
        font-weight: 700;
      }

      .rows {
        display: grid;
      }

      .row {
        display: grid;
        grid-template-columns: 116px minmax(220px, 1.1fr) minmax(220px, 1fr) minmax(140px, 0.7fr) 72px;
        gap: 10px;
        align-items: center;
        padding: 10px 14px;
        border-top: 1px solid #28323a;
      }

      .row:first-child {
        border-top: 0;
      }

      .row.active {
        background: #1e282d;
      }

      .name {
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .meta {
        color: #9aa8b4;
        font-size: 12px;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }

      .partials {
        color: #c7d3dc;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      .row button {
        justify-self: end;
        min-width: 64px;
        height: 32px;
        padding: 0 12px;
      }

      @media (max-width: 860px) {
        .controls,
        .row {
          grid-template-columns: 1fr;
          gap: 8px;
        }

        .row button {
          justify-self: start;
        }
      }
    </style>
  </head>
  <body>
    <script>
      if (location.protocol === "file:") {
        location.replace("http://localhost:8875/timbre_distribution_lab.html");
      }
    </script>
    <main>
      <header>
        <h1>Timbre Distribution Lab</h1>
        <nav>
          <a href="./transient_distribution_lab.html">Transient Lab</a>
          <a href="./timbre_axis_lab.html">Axis Lab</a>
          <a href="./timbre_lab.html">Timbre Lab</a>
          <a href="./function_music_lab.html">Function Lab</a>
          <a href="./music_lab.html">Music Lab</a>
        </nav>
      </header>

      <section class="panel">
        <div class="controls">
          <div class="field">
            <label for="seed">Seed</label>
            <input id="seed" type="text" value="dist-1" autocomplete="off">
          </div>
          <div class="field">
            <label for="count">Count</label>
            <input id="count" type="number" min="1" max="32" step="1" value="12">
          </div>
          <button id="generate" type="button">Generate</button>
          <button id="random" class="secondary" type="button">Random</button>
          <button id="play-all" class="secondary" type="button">Play All</button>
          <div class="field">
            <div class="field-head">
              <span class="label">Volume</span>
              <span id="volume-value" class="value">50%</span>
            </div>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Audition volume">
          </div>
          <button id="stop" class="secondary" type="button">Stop</button>
        </div>
      </section>

      <section id="list" class="panel rows"></section>
    </main>

    <script type="module">
      import { generateTimbreSet, playGeneratedTimbre, randomTimbreSummary } from "./timbre_axis_lab.mjs?v=dist-5";

      const seedInput = document.querySelector("#seed");
      const countInput = document.querySelector("#count");
      const generateButton = document.querySelector("#generate");
      const randomButton = document.querySelector("#random");
      const playAllButton = document.querySelector("#play-all");
      const stopButton = document.querySelector("#stop");
      const volumeInput = document.querySelector("#volume");
      const volumeValue = document.querySelector("#volume-value");
      const list = document.querySelector("#list");
      let audioContext = null;
      let activePlayback = null;
      let activeId = null;
      let playAllTimer = null;
      let timbres = [];

      render();
      updateVolumeLabel();

      function render() {
        stopCurrent();
        const count = Math.max(1, Math.min(32, Number(countInput.value) || 12));
        countInput.value = String(count);
        timbres = generateTimbreSet(seedInput.value || "dist-1", count);
        window.__randomTimbres = timbres;
        list.innerHTML = "";
        for (const model of timbres) {
          const row = document.createElement("div");
          row.className = "row";
          row.dataset.id = model.id;

          const name = document.createElement("div");
          name.className = "name";
          name.textContent = model.id;

          const summary = document.createElement("div");
          summary.className = "meta";
          summary.textContent = randomTimbreSummary(model);

          const partials = document.createElement("div");
          partials.className = "partials";
          partials.textContent = partialSummary(model.signal.partials);

          const mechanics = document.createElement("div");
          mechanics.className = "meta";
          mechanics.textContent = mechanicsSummary(model);

          const button = document.createElement("button");
          button.type = "button";
          button.dataset.id = model.id;
          button.textContent = "Play";

          row.append(name, summary, partials, mechanics, button);
          list.append(row);
        }
      }

      function partialSummary(partials) {
        const first = partials.slice(0, 8).map(([ratio, gain]) => `${ratio}f:${gain}`);
        const suffix = partials.length > first.length ? ` ... +${partials.length - first.length}` : "";
        return `${first.join("  ")}${suffix}`;
      }

      function mechanicsSummary(model) {
        const pitch = model.signal.pitch ? "pitch motion" : "stable pitch";
        const filter = model.parameters.filterEnd ? `${Math.round(model.parameters.filterStart)}->${Math.round(model.parameters.filterEnd)}Hz` : `${Math.round(model.parameters.filterStart)}Hz`;
        const decay = model.signal.partials.filter((partial) => partial.length >= 3).length;
        return `${pitch} / filter ${filter} / decay partials ${decay}/${model.signal.partials.length} / output ${model.signal.distanceGain}`;
      }

      async function ensureAudio() {
        if (!audioContext) {
          audioContext = new AudioContext();
        }
        if (audioContext.state === "suspended") {
          await audioContext.resume();
        }
      }

      async function playOne(model) {
        await ensureAudio();
        stopCurrent();
        activeId = model.id;
        paintActive();
        activePlayback = playGeneratedTimbre(audioContext, model, {
          gain: Number(volumeInput.value) * 0.3,
        });
      }

      async function playAll() {
        await ensureAudio();
        stopCurrent();
        let index = 0;
        const playNext = () => {
          if (index >= timbres.length) {
            stopCurrent();
            return;
          }
          const model = timbres[index];
          activeId = model.id;
          paintActive();
          activePlayback = playGeneratedTimbre(audioContext, model, {
            gain: Number(volumeInput.value) * 0.3,
          });
          index += 1;
          playAllTimer = setTimeout(playNext, 1100);
        };
        playNext();
      }

      function stopCurrent() {
        if (playAllTimer !== null) {
          clearTimeout(playAllTimer);
          playAllTimer = null;
        }
        if (activePlayback) {
          activePlayback.stop();
          activePlayback = null;
        }
        activeId = null;
        paintActive();
      }

      function paintActive() {
        for (const row of list.querySelectorAll(".row")) {
          row.classList.toggle("active", row.dataset.id === activeId);
        }
      }

      function updateVolumeLabel() {
        volumeValue.textContent = `${Math.round(Number(volumeInput.value) * 100)}%`;
      }

      generateButton.addEventListener("click", render);
      randomButton.addEventListener("click", () => {
        seedInput.value = `dist-${Math.floor(Math.random() * 1000000)}`;
        render();
      });
      playAllButton.addEventListener("click", playAll);
      stopButton.addEventListener("click", stopCurrent);
      volumeInput.addEventListener("input", updateVolumeLabel);
      list.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-id]");
        if (!button) {
          return;
        }
        const model = timbres.find((item) => item.id === button.dataset.id);
        if (model) {
          playOne(model);
        }
      });
    </script>
  </body>
</html>
