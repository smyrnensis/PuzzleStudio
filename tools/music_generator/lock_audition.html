<!doctype html>
<meta charset="utf-8" />
<title>Lock SFX audition</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 18px; }
  .pattern { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
  .pattern button { font-size: 15px; padding: 8px 14px; cursor: pointer; }
  .pattern span { color: #666; font-size: 13px; }
  .controls { margin: 20px 0; padding-top: 16px; border-top: 1px solid #ddd; }
  code { background: #f2f2f2; padding: 1px 4px; border-radius: 3px; }
</style>
<h1>Lock SFX audition</h1>
<p>One representative seed per lock pattern. Click to hear it. If a pattern still
sounds wrong, tell me which one and how.</p>
<div id="patterns"></div>
<div class="controls">
  <button id="random">🔀 Play a fresh random lock</button>
  <span id="randomLabel"></span>
</div>
<script type="module">
  import { generateSoundEffect, createSfxPlayer } from "./seeded_sfx.mjs";

  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const PATTERNS = ["latch", "deadbolt", "key-turn", "tumblers", "old-lock", "padlock"];

  function play(effect) {
    if (ctx.state === "suspended") ctx.resume();
    createSfxPlayer(ctx, effect, { volume: 0.9 }).start(ctx.currentTime + 0.02);
  }

  // Find one seed per pattern so each can be auditioned in isolation.
  const seedByPattern = {};
  for (let seed = 1; seed < 5000 && Object.keys(seedByPattern).length < PATTERNS.length; seed++) {
    const eff = generateSoundEffect(String(seed), { type: "lock" });
    if (!seedByPattern[eff.profile.pattern]) seedByPattern[eff.profile.pattern] = eff;
  }

  const host = document.getElementById("patterns");
  for (const pattern of PATTERNS) {
    const eff = seedByPattern[pattern];
    if (!eff) continue;
    const row = document.createElement("div");
    row.className = "pattern";
    const btn = document.createElement("button");
    btn.textContent = `▶ ${pattern}`;
    btn.onclick = () => play(eff);
    const meta = document.createElement("span");
    meta.textContent = `seed ${eff.seed} · variant ${eff.profile.variant} · ${eff.duration.toFixed(2)}s`;
    row.append(btn, meta);
    host.append(row);
  }

  document.getElementById("random").onclick = () => {
    const seed = String(Math.floor(Math.random() * 1e6));
    const eff = generateSoundEffect(seed, { type: "lock" });
    document.getElementById("randomLabel").textContent =
      `seed ${seed} · ${eff.profile.pattern} · ${eff.profile.variant}`;
    play(eff);
  };
</script>
