<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Music Generator Listen</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101214;
        --panel: #191d20;
        --panel-2: #20262a;
        --text: #f2f4f3;
        --muted: #9aa5a1;
        --line: #333b40;
        --accent: #7bd88f;
        --accent-2: #58b7d6;
        --danger: #ff7b7b;
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        background: #141719;
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 12px;
        min-width: 0;
      }

      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
      }

      .status {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }

      .status.is-error {
        color: var(--danger);
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
        min-height: 0;
      }

      .controls {
        border-right: 1px solid var(--line);
        padding: 16px;
        background: var(--panel);
        overflow: auto;
      }

      .main {
        min-width: 0;
        padding: 16px;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 16px;
      }

      .transport {
        display: grid;
        grid-template-columns: auto auto auto minmax(160px, 1fr);
        align-items: center;
        gap: 10px;
      }

      .icon-button {
        width: 38px;
        height: 38px;
        border-radius: 6px;
        display: inline-grid;
        place-items: center;
      }

      .icon-button svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .primary {
        border-color: color-mix(in srgb, var(--accent) 70%, var(--line));
        color: #071008;
        background: var(--accent);
      }

      .control-group {
        display: grid;
        gap: 14px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      label,
      .field-label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .value {
        color: var(--text);
        font-variant-numeric: tabular-nums;
        font-size: 13px;
      }

      input[type="text"],
      input[type="number"],
      select {
        width: 100%;
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0d0f10;
        color: var(--text);
        padding: 7px 9px;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      .seed-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }

      .text-button {
        min-height: 36px;
        border-radius: 6px;
        padding: 0 12px;
        font-size: 13px;
        font-weight: 700;
      }

      .output {
        margin-top: 16px;
        display: grid;
        gap: 10px;
      }

      .code-line {
        min-height: 44px;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0d0f10;
        color: #d7dde0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .form-strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 10px;
      }

      .section {
        min-height: 82px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        padding: 10px;
      }

      .section-name {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        font-weight: 700;
      }

      .section-bars {
        margin-top: 6px;
        font-size: 22px;
        font-weight: 750;
        font-variant-numeric: tabular-nums;
      }

      .section-role {
        margin-top: 6px;
        color: var(--accent-2);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .debug {
        min-height: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0d0f10;
        overflow: auto;
        box-shadow: 0 16px 40px var(--shadow);
      }

      pre {
        margin: 0;
        padding: 14px;
        color: #cbd4d0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      @media (max-width: 820px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .controls {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .transport {
          grid-template-columns: auto auto auto minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <h1>Music Generator Listen</h1>
        </div>
        <div id="status" class="status">Loading</div>
      </header>

      <div class="workspace">
        <aside class="controls" aria-label="Music controls">
          <div class="control-group">
            <div class="field">
              <div class="field-row">
                <label for="seedInput">Seed</label>
              </div>
              <div class="seed-row">
                <input id="seedInput" type="text" autocomplete="off" spellcheck="false">
                <button id="randomButton" class="icon-button" type="button" aria-label="Random seed" title="Random seed">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M16 3h5v5"></path>
                    <path d="M4 20 21 3"></path>
                    <path d="M21 16v5h-5"></path>
                    <path d="M15 15l6 6"></path>
                    <path d="M4 4l5 5"></path>
                  </svg>
                </button>
              </div>
            </div>

            <div class="field">
              <div class="field-row">
                <label for="heightInput">Height</label>
                <span id="heightValue" class="value">0.50</span>
              </div>
              <input id="heightInput" type="range" min="0" max="1" step="0.01" value="0.50">
            </div>

            <div class="field">
              <div class="field-row">
                <label for="barsInput">Bars</label>
              </div>
              <select id="barsInput">
                <option value="8">8</option>
                <option value="16">16</option>
                <option value="32" selected>32</option>
                <option value="64">64</option>
              </select>
            </div>

            <div class="field">
              <div class="field-row">
                <label for="bpmInput">BPM</label>
                <span id="bpmValue" class="value">100</span>
              </div>
              <input id="bpmInput" type="range" min="50" max="150" step="1" value="100">
            </div>

            <div class="field">
              <div class="field-row">
                <label for="volumeInput">Volume</label>
                <span id="volumeValue" class="value">70%</span>
              </div>
              <input id="volumeInput" type="range" min="0" max="1" step="0.01" value="0.70">
            </div>
          </div>

          <div class="output">
            <div class="field-label">Definition</div>
            <div id="definitionLine" class="code-line"></div>
          </div>
        </aside>

        <section class="main" aria-label="Generated music">
          <div class="transport">
            <button id="playButton" class="icon-button primary" type="button" aria-label="Play" title="Play">
              <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true">
                <polygon points="8 5 19 12 8 19 8 5"></polygon>
              </svg>
            </button>
            <button id="stopButton" class="icon-button" type="button" aria-label="Stop" title="Stop">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="6" y="6" width="12" height="12"></rect>
              </svg>
            </button>
            <button id="copyButton" class="icon-button" type="button" aria-label="Copy definition" title="Copy definition">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
            <input id="progressInput" type="range" min="0" max="0.9999" step="0.0001" value="0" aria-label="Loop progress">
          </div>

          <div id="formStrip" class="form-strip" aria-label="Form sections"></div>

          <div class="debug">
            <pre id="debugOutput"></pre>
          </div>
        </section>
      </div>
    </main>

    <script>
/* PUZZLESTUDIO_MUSIC_TOOLS_BUNDLE */
    </script>
    <script>
      const statusLabel = document.getElementById("status");
      const seedInput = document.getElementById("seedInput");
      const randomButton = document.getElementById("randomButton");
      const heightInput = document.getElementById("heightInput");
      const heightValue = document.getElementById("heightValue");
      const barsInput = document.getElementById("barsInput");
      const bpmInput = document.getElementById("bpmInput");
      const bpmValue = document.getElementById("bpmValue");
      const volumeInput = document.getElementById("volumeInput");
      const volumeValue = document.getElementById("volumeValue");
      const definitionLine = document.getElementById("definitionLine");
      const playButton = document.getElementById("playButton");
      const playIcon = document.getElementById("playIcon");
      const stopButton = document.getElementById("stopButton");
      const copyButton = document.getElementById("copyButton");
      const progressInput = document.getElementById("progressInput");
      const formStrip = document.getElementById("formStrip");
      const debugOutput = document.getElementById("debugOutput");

      let audioContext = null;
      let player = null;
      let playing = false;
      let progressFrame = 0;
      let currentSong = null;

      function tools() {
        return window.PuzzleMusicListenTools;
      }

      function setStatus(text, kind = "") {
        statusLabel.textContent = text;
        statusLabel.classList.toggle("is-error", kind === "error");
      }

      function options() {
        return {
          height: Number(heightInput.value),
          bars: Number(barsInput.value),
          bpm: Number(bpmInput.value),
          volume: Number(volumeInput.value),
        };
      }

      function definition(song = currentSong) {
        const input = song?.input || options();
        const seed = seedInput.value.trim() || "music";
        return `music music seed=${seed} bars=${Math.round(Number(input.bars))} height=${Number(input.height).toFixed(2)} bpm=${Math.round(Number(input.bpm))} volume=${Number(input.volume).toFixed(2)}`;
      }

      function renderPlayIcon() {
        playButton.setAttribute("aria-label", playing ? "Pause" : "Play");
        playButton.title = playing ? "Pause" : "Play";
        playIcon.innerHTML = playing
          ? '<path d="M8 5v14"></path><path d="M16 5v14"></path>'
          : '<polygon points="8 5 19 12 8 19 8 5"></polygon>';
      }

      function generate() {
        const api = tools();
        if (!api) {
          throw new Error("Music tools are unavailable.");
        }
        currentSong = api.generateSong(seedInput.value.trim() || "music", options());
        heightValue.textContent = Number(currentSong.input.height).toFixed(2);
        bpmValue.textContent = String(currentSong.playbackScore.transport.bpm);
        volumeValue.textContent = `${Math.round(currentSong.playbackScore.mix.volume * 100)}%`;
        definitionLine.textContent = definition(currentSong);
        renderForm(currentSong);
        renderDebug(currentSong);
        return currentSong;
      }

      function renderForm(song) {
        formStrip.replaceChildren();
        for (const section of song.debug?.sections || []) {
          const item = document.createElement("div");
          item.className = "section";
          const title = document.createElement("div");
          title.className = "section-name";
          title.textContent = section.role || "section";
          const bars = document.createElement("div");
          bars.className = "section-bars";
          bars.textContent = `${section.startBar}-${section.endBar}`;
          const role = document.createElement("div");
          role.className = "section-role";
          role.textContent = section.identity || section.carrier || "";
          item.append(title, bars, role);
          formStrip.append(item);
        }
      }

      function renderDebug(song) {
        const compact = {
          input: song.input,
          transport: song.playbackScore.transport,
          form: song.debug?.form,
          sections: song.debug?.sections,
          tracks: song.playbackScore.tracks,
          eventCount: song.playbackScore.events.length,
        };
        debugOutput.textContent = JSON.stringify(compact, null, 2);
      }

      function stopProgress() {
        cancelAnimationFrame(progressFrame);
        progressFrame = 0;
      }

      function startProgress() {
        stopProgress();
        const tick = () => {
          if (player && playing) {
            progressInput.value = player.loopProgress().toFixed(4);
          }
          progressFrame = requestAnimationFrame(tick);
        };
        progressFrame = requestAnimationFrame(tick);
      }

      function stopPlayback(reset = true) {
        player?.stop();
        player = null;
        playing = false;
        stopProgress();
        if (reset) {
          progressInput.value = "0";
        }
        renderPlayIcon();
      }

      async function ensureAudioContext() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          throw new Error("WebAudio is unavailable.");
        }
        if (!audioContext) {
          audioContext = new AudioContextClass();
        }
        if (audioContext.state === "suspended") {
          await audioContext.resume();
        }
        return audioContext;
      }

      async function playFromProgress(progress = Number(progressInput.value) || 0) {
        const song = generate();
        const context = await ensureAudioContext();
        stopPlayback(false);
        player = tools().createPlayer(context, song.playbackScore);
        player.start(progress);
        playing = true;
        renderPlayIcon();
        startProgress();
        setStatus("Playing");
      }

      function update() {
        const progress = Number(progressInput.value) || 0;
        generate();
        if (playing) {
          playFromProgress(progress).catch((error) => setStatus(error?.message || String(error), "error"));
        }
      }

      randomButton.addEventListener("click", () => {
        const preset = tools().randomPreset(`${Date.now()}:${Math.random()}`);
        seedInput.value = preset.seed;
        heightInput.value = String(preset.height ?? 0.5);
        barsInput.value = String(preset.bars ?? 32);
        bpmInput.value = String(preset.bpm ?? 100);
        update();
      });

      for (const input of [seedInput, heightInput, barsInput, bpmInput, volumeInput]) {
        input.addEventListener("input", update);
      }

      playButton.addEventListener("click", () => {
        if (playing) {
          stopPlayback(false);
          setStatus("Paused");
          return;
        }
        playFromProgress().catch((error) => setStatus(error?.message || String(error), "error"));
      });

      stopButton.addEventListener("click", () => {
        stopPlayback(true);
        setStatus("Stopped");
      });

      progressInput.addEventListener("input", () => {
        if (playing) {
          playFromProgress(Number(progressInput.value)).catch((error) => setStatus(error?.message || String(error), "error"));
        }
      });

      copyButton.addEventListener("click", () => {
        navigator.clipboard.writeText(definitionLine.textContent || "").then(
          () => setStatus("Copied"),
          (error) => setStatus(error?.message || String(error), "error"),
        );
      });

      function initialize() {
        const preset = tools().randomPreset(`listen:${Date.now()}:${Math.random()}`);
        seedInput.value = preset.seed;
        heightInput.value = String(preset.height ?? 0.5);
        barsInput.value = String(preset.bars ?? 32);
        bpmInput.value = String(preset.bpm ?? 100);
        volumeInput.value = "0.70";
        generate();
        setStatus("Ready");
      }

      window.addEventListener("PuzzleMusicListenToolsReady", initialize);
      if (tools()) {
        initialize();
      }

      window.addEventListener("beforeunload", () => stopPlayback(true));
    </script>
  </body>
</html>
