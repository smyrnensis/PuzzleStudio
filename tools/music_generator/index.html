<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seeded Game Audio Generator</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0c0f0c;
        color: #eef4e8;
      }

      html {
        overflow-y: scroll;
        scrollbar-gutter: stable;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        justify-items: center;
        align-items: start;
        box-sizing: border-box;
        padding: 20px 0;
      }

      main {
        width: min(520px, calc(100vw - 24px));
        display: grid;
        gap: 12px;
      }

      h1 {
        margin: 0;
        color: #eef4e8;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .mode-switch {
        display: inline-grid;
        grid-template-columns: 1fr 1fr;
        width: 214px;
        padding: 4px;
        border: 1px solid #303b2b;
        border-radius: 999px;
        background: #0f130e;
      }

      .mode-button {
        min-height: 32px;
        background: transparent;
        color: #9ba994;
        font: inherit;
        font-size: 13px;
      }

      .mode-button[aria-pressed="true"] {
        background: #a7d983;
        color: #0c0f0c;
      }

      .panel {
        border: 1px solid #293329;
        border-radius: 8px;
        background: #151a14;
        overflow: visible;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
      }

      .player {
        padding: 14px;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 14px;
        align-items: center;
      }

      .transport {
        display: flex;
        gap: 8px;
      }

      button {
        border: 0;
        border-radius: 999px;
        background: #a7d983;
        color: #0c0f0c;
        cursor: pointer;
      }

      .icon-button,
      .random-button {
        width: 40px;
        height: 40px;
        display: inline-grid;
        place-items: center;
      }

      button svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .timeline {
        display: grid;
        gap: 7px;
        min-width: 0;
      }

      .progress {
        height: 8px;
        border-radius: 999px;
        background: #293024;
        cursor: pointer;
        position: relative;
      }

      .progress span {
        display: block;
        width: calc(var(--progress, 0) * 100%);
        height: 100%;
        border-radius: inherit;
        background: #a7d983;
      }

      .progress::after {
        content: "";
        position: absolute;
        top: 50%;
        left: calc(var(--progress, 0) * 100%);
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #a7d983;
        transform: translate(-50%, -50%);
      }

      .progress:focus-visible,
      input[type="range"]:focus-visible {
        outline: 0;
      }

      .sfx-current {
        min-width: 0;
        color: #9ba994;
        font-size: 12px;
      }

      .sfx-current strong {
        display: block;
        color: #eef4e8;
        font-size: 15px;
      }

      .controls {
        padding: 0 14px 14px;
        display: grid;
        gap: 14px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
      }

      .label {
        color: #9ba994;
        font-size: 12px;
      }

      .value {
        font-size: 13px;
        font-weight: 700;
      }

      input[type="text"] {
        min-width: 0;
        border: 1px solid #303b2b;
        border-radius: 999px;
        background: #0f130e;
        color: #eef4e8;
        padding: 10px 14px;
        font: inherit;
      }

      .sliders,
      .sfx-fields {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .range-row {
        display: grid;
        grid-template-columns: 52px minmax(0, 1fr) 64px;
        gap: 8px;
        align-items: center;
      }

      .range-row span {
        color: #7f8c78;
        font-size: 11px;
      }

      .range-row span:first-child {
        text-align: right;
      }

      input[type="range"] {
        width: 100%;
        height: 18px;
        appearance: none;
        background: transparent;
        cursor: pointer;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(to right, #a7d983 0%, #a7d983 calc(var(--value, 0) * 100%), #293024 calc(var(--value, 0) * 100%), #293024 100%);
      }

      input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 16px;
        height: 16px;
        margin-top: -4px;
        border-radius: 50%;
        background: #a7d983;
        border: 0;
      }

      input[type="range"]::-moz-range-track {
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(to right, #a7d983 0%, #a7d983 calc(var(--value, 0) * 100%), #293024 calc(var(--value, 0) * 100%), #293024 100%);
      }

      input[type="range"]::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #a7d983;
        border: 0;
      }

      .type-picker {
        position: relative;
      }

      .type-trigger {
        width: 100%;
        min-height: 40px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
        padding: 0 14px;
        border: 1px solid #303b2b;
        border-radius: 999px;
        background: #0f130e;
        color: #eef4e8;
        font: inherit;
        text-align: left;
      }

      .type-trigger::after {
        content: "";
        width: 7px;
        height: 7px;
        border-right: 1.8px solid currentColor;
        border-bottom: 1.8px solid currentColor;
        transform: rotate(45deg) translateY(-2px);
        opacity: 0.76;
      }

      .type-picker.open .type-trigger {
        border-color: #a7d983;
      }

      .type-menu {
        position: absolute;
        z-index: 20;
        top: calc(100% + 6px);
        left: 0;
        width: min(220px, calc(100vw - 40px));
        max-height: 260px;
        overflow-y: auto;
        display: none;
        padding: 6px;
        border: 1px solid #303b2b;
        border-radius: 8px;
        background: #11150f;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.32);
      }

      .type-picker.open .type-menu {
        display: grid;
        gap: 4px;
      }

      .type-option {
        min-height: 32px;
        padding: 0 10px;
        border-radius: 6px;
        background: transparent;
        color: #eef4e8;
        font-size: 12px;
        text-align: left;
      }

      .type-option[aria-pressed="true"] {
        background: #293024;
      }

      pre {
        margin: 0;
        padding: 12px;
        max-height: min(48vh, 520px);
        overflow: auto;
        border: 1px solid #293329;
        border-radius: 8px;
        background: #11150f;
        color: #cbd6c3;
        font-size: 12px;
        line-height: 1.45;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 560px) {
        main,
        .player {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <script>
      if (location.protocol === "file:") {
        location.replace("http://localhost:8875/");
      }
    </script>
    <main>
      <h1>Seeded Game Audio Generator</h1>
      <div class="mode-switch" role="group" aria-label="Generator mode">
        <button id="mode-sfx" class="mode-button" type="button" aria-pressed="true">SFX</button>
        <button id="mode-music" class="mode-button" type="button" aria-pressed="false">Music</button>
      </div>

      <section id="sfx-screen" class="panel">
        <div class="player">
          <div class="transport">
            <button id="sfx-play" class="icon-button" aria-label="Replay SFX" title="Replay SFX">
              <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="8 5 19 12 8 19 8 5"></polygon></svg>
            </button>
            <button id="sfx-random" class="random-button" aria-label="Randomize and play SFX" title="Randomize and play SFX">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg>
            </button>
          </div>
          <div class="sfx-current">
            Type
            <strong id="sfx-type-value">Random</strong>
          </div>
        </div>

        <div class="controls">
          <div class="sfx-fields">
            <div class="field">
              <span class="label">Seed</span>
              <input id="sfx-seed" type="text" value="" aria-label="SFX seed">
            </div>
            <div class="field">
              <div id="type-picker" class="type-picker">
                <button id="type-trigger" class="type-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">Random</button>
                <div id="type-menu" class="type-menu" role="listbox" aria-label="Effect type"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="music-screen" class="panel" hidden>
        <div class="player">
          <div class="transport">
            <button id="music-play" class="icon-button" aria-label="Play" title="Play">
              <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="8 5 19 12 8 19 8 5"></polygon></svg>
            </button>
            <button id="music-random" class="random-button" aria-label="Random seed" title="Random seed">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg>
            </button>
          </div>
          <div class="timeline">
            <div id="music-progress" class="progress" role="slider" aria-label="Playhead" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><span id="music-progress-bar"></span></div>
          </div>
        </div>

        <div class="controls">
          <div class="field">
            <span class="label">Seed</span>
            <input id="music-seed" type="text" value="" aria-label="Music seed">
          </div>

          <div class="sliders">
            <div class="field">
              <div class="field-head">
                <span class="label">Tone</span>
                <span id="music-tone-value" class="value">0.62</span>
              </div>
              <div class="range-row">
                <span>Darker</span>
                <input id="music-tone" type="range" min="0" max="1" step="0.01" value="0.62" aria-label="Music tone">
                <span>Brighter</span>
              </div>
            </div>

            <div class="field">
              <div class="field-head">
                <span class="label">BPM</span>
                <span id="music-bpm-value" class="value">104 BPM</span>
              </div>
              <div class="range-row">
                <span>Slow</span>
                <input id="music-bpm" type="range" min="40" max="180" step="1" value="104" aria-label="Music BPM">
                <span>Fast</span>
              </div>
            </div>

            <div class="field">
              <div class="field-head">
                <span class="label">Volume</span>
                <span id="music-volume-value" class="value">50%</span>
              </div>
              <div class="range-row">
                <span>Quiet</span>
                <input id="music-volume" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Music volume">
                <span>Loud</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <pre id="json"></pre>
    </main>

    <script type="module">
      import { exportMusicLoop, exportSoundEffect } from "./audio_export.mjs?v=latest-clean-7";
      import { generateSong, randomPreset } from "./seeded_music.mjs?v=composition-1";
      import { createPlayer } from "./seeded_music_player.mjs?v=player-1";
      import { SFX_TYPE_OPTIONS, createSfxPlayer, generateSoundEffect, randomSfxPreset } from "./seeded_sfx.mjs?v=latest-clean-7";

      const playIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="8 5 19 12 8 19 8 5"></polygon></svg>';
      const pauseIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14"></path><path d="M16 5v14"></path></svg>';
      const modeSfxButton = document.querySelector("#mode-sfx");
      const modeMusicButton = document.querySelector("#mode-music");
      const sfxScreen = document.querySelector("#sfx-screen");
      const musicScreen = document.querySelector("#music-screen");
      const sfxSeedInput = document.querySelector("#sfx-seed");
      const sfxTypeValue = document.querySelector("#sfx-type-value");
      const musicSeedInput = document.querySelector("#music-seed");
      const musicToneInput = document.querySelector("#music-tone");
      const musicBpmInput = document.querySelector("#music-bpm");
      const musicVolumeInput = document.querySelector("#music-volume");
      const musicToneValue = document.querySelector("#music-tone-value");
      const musicBpmValue = document.querySelector("#music-bpm-value");
      const musicVolumeValue = document.querySelector("#music-volume-value");
      const musicProgress = document.querySelector("#music-progress");
      const musicProgressBar = document.querySelector("#music-progress-bar");
      const musicPlayButton = document.querySelector("#music-play");
      const typePicker = document.querySelector("#type-picker");
      const typeTrigger = document.querySelector("#type-trigger");
      const typeMenu = document.querySelector("#type-menu");
      const json = document.querySelector("#json");
      let audioContext = null;
      let sfxPlayer = null;
      let musicPlayer = null;
      let musicIsPlaying = false;
      let pausedProgress = 0;
      let musicRestartTimer = null;
      let progressFrame = null;
      let mode = "sfx";
      let selectedType = "random";

      for (const type of SFX_TYPE_OPTIONS) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "type-option";
        button.role = "option";
        button.dataset.type = type;
        button.ariaPressed = "false";
        button.ariaSelected = "false";
        button.textContent = labelForType(type);
        button.addEventListener("click", () => {
          selectedType = type;
          closeTypeMenu();
          renderSfx();
        });
        typeMenu.append(button);
      }

      function sfxEffect() {
        return generateSoundEffect(sfxSeedInput.value, { type: selectedType });
      }

      function musicSong() {
        return generateSong(musicSeedInput.value, {
          tone: Number(musicToneInput.value),
          bpm: Number(musicBpmInput.value),
          volume: Number(musicVolumeInput.value),
        });
      }

      function render() {
        if (mode === "music") {
          renderMusic();
        } else {
          renderSfx();
        }
      }

      function renderSfx() {
        const effect = sfxEffect();
        const label = labelForType(selectedType);
        typeTrigger.textContent = label;
        sfxTypeValue.textContent = selectedType === "random" ? `${labelForType(effect.type)} from Random` : label;
        json.textContent = JSON.stringify({
          export: exportSoundEffect(effect, selectedType),
          generated: {
            duration: effect.duration,
            profile: effect.profile,
            layers: effect.layers,
          },
        }, null, 2);
        for (const button of typeMenu.querySelectorAll(".type-option")) {
          const selected = button.dataset.type === selectedType;
          button.ariaPressed = String(selected);
          button.ariaSelected = String(selected);
        }
      }

      function renderMusic() {
        const song = musicSong();
        updateRangeFill(musicToneInput);
        updateRangeFill(musicBpmInput);
        updateRangeFill(musicVolumeInput);
        musicToneValue.textContent = song.input.tone.toFixed(2);
        musicBpmValue.textContent = `${song.playbackScore.transport.bpm} BPM`;
        musicVolumeValue.textContent = `${Math.round(song.playbackScore.mix.volume * 100)}%`;
        json.textContent = JSON.stringify({
          export: exportMusicLoop(song),
          playbackScore: song.playbackScore,
          debug: {
            type: song.debug.type,
            form: song.debug.form,
            roles: song.debug.roles,
            arrangement: song.debug.score.arrangement,
          },
        }, null, 2);
      }

      function updateRangeFill(input) {
        const min = Number(input.min);
        const max = Number(input.max);
        const value = Number(input.value);
        input.style.setProperty("--value", ((value - min) / (max - min)).toFixed(4));
      }

      function setMode(nextMode) {
        mode = nextMode;
        modeSfxButton.ariaPressed = String(mode === "sfx");
        modeMusicButton.ariaPressed = String(mode === "music");
        sfxScreen.hidden = mode !== "sfx";
        musicScreen.hidden = mode !== "music";
        closeTypeMenu();
        if (mode === "sfx") {
          pauseMusic();
        } else {
          sfxPlayer?.stop();
          sfxPlayer = null;
        }
        render();
      }

      function labelForType(type) {
        return type.replace("-", " ").replace(/\b\w/g, (letter) => letter.toUpperCase());
      }

      function openTypeMenu() {
        typePicker.classList.add("open");
        typeTrigger.setAttribute("aria-expanded", "true");
      }

      function closeTypeMenu() {
        typePicker.classList.remove("open");
        typeTrigger.setAttribute("aria-expanded", "false");
      }

      async function ensureAudioContext() {
        audioContext ??= new AudioContext();
        await audioContext.resume();
      }

      async function playSfx() {
        await ensureAudioContext();
        sfxPlayer?.stop();
        sfxPlayer = createSfxPlayer(audioContext, sfxEffect());
        sfxPlayer.start();
        renderSfx();
      }

      async function toggleMusic() {
        if (musicIsPlaying) {
          pauseMusic();
          return;
        }
        await ensureAudioContext();
        musicPlayer?.stop();
        musicPlayer = createPlayer(audioContext, musicSong().playbackScore);
        musicPlayer.start(pausedProgress);
        setMusicPlaying(true);
        startProgress();
        renderMusic();
      }

      function pauseMusic() {
        clearTimeout(musicRestartTimer);
        musicRestartTimer = null;
        pausedProgress = musicPlayer?.loopProgress() ?? pausedProgress;
        musicPlayer?.stop();
        musicPlayer = null;
        setMusicPlaying(false);
        cancelAnimationFrame(progressFrame);
        progressFrame = null;
        setProgress(pausedProgress);
      }

      function setMusicPlaying(nextIsPlaying) {
        musicIsPlaying = nextIsPlaying;
        musicPlayButton.innerHTML = nextIsPlaying ? pauseIcon : playIcon;
        musicPlayButton.setAttribute("aria-label", nextIsPlaying ? "Pause" : "Play");
        musicPlayButton.title = nextIsPlaying ? "Pause" : "Play";
      }

      function updateMusic() {
        renderMusic();
        if (musicIsPlaying && audioContext) {
          clearTimeout(musicRestartTimer);
          musicRestartTimer = setTimeout(() => {
            const progress = musicPlayer?.loopProgress() ?? pausedProgress;
            musicPlayer?.stop();
            musicPlayer = createPlayer(audioContext, musicSong().playbackScore);
            musicPlayer.start(progress);
            startProgress();
          }, 180);
        }
      }

      function setProgress(value) {
        pausedProgress = clamp(value, 0, 0.9999);
        musicProgress.style.setProperty("--progress", pausedProgress.toFixed(4));
        musicProgressBar.style.setProperty("--progress", pausedProgress.toFixed(4));
        musicProgress.setAttribute("aria-valuenow", Math.round(pausedProgress * 100).toString());
      }

      function seekTo(value) {
        setProgress(value);
        if (musicIsPlaying && audioContext) {
          clearTimeout(musicRestartTimer);
          musicPlayer?.stop();
          musicPlayer = createPlayer(audioContext, musicSong().playbackScore);
          musicPlayer.start(pausedProgress);
          startProgress();
        }
      }

      function progressFromPointer(event) {
        const rect = musicProgress.getBoundingClientRect();
        return (event.clientX - rect.left) / rect.width;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function startProgress() {
        cancelAnimationFrame(progressFrame);
        const tick = () => {
          if (musicPlayer && musicIsPlaying) {
            const value = musicPlayer.loopProgress();
            musicProgress.style.setProperty("--progress", value.toFixed(4));
            musicProgressBar.style.setProperty("--progress", value.toFixed(4));
            musicProgress.setAttribute("aria-valuenow", Math.round(value * 100).toString());
          }
          progressFrame = requestAnimationFrame(tick);
        };
        tick();
      }

      modeSfxButton.addEventListener("click", () => setMode("sfx"));
      modeMusicButton.addEventListener("click", () => setMode("music"));
      document.querySelector("#sfx-play").addEventListener("click", playSfx);
      musicPlayButton.addEventListener("click", toggleMusic);

      document.querySelector("#sfx-random").addEventListener("click", () => {
        const preset = randomSfxPreset(`${Date.now()}:${Math.random()}`, selectedType);
        sfxSeedInput.value = preset.seed;
        selectedType = preset.type;
        playSfx();
      });

      document.querySelector("#music-random").addEventListener("click", () => {
        const preset = randomPreset(`${Date.now()}:${Math.random()}`);
        musicSeedInput.value = preset.seed;
        musicToneInput.value = preset.tone;
        musicBpmInput.value = preset.bpm;
        setProgress(0);
        renderMusic();
        if (musicIsPlaying && audioContext) {
          clearTimeout(musicRestartTimer);
          musicPlayer?.stop();
          musicPlayer = createPlayer(audioContext, musicSong().playbackScore);
          musicPlayer.start(0);
          startProgress();
        }
      });

      typeTrigger.addEventListener("click", () => {
        if (typePicker.classList.contains("open")) {
          closeTypeMenu();
        } else {
          openTypeMenu();
        }
      });

      document.addEventListener("click", (event) => {
        if (!typePicker.contains(event.target)) {
          closeTypeMenu();
        }
      });

      musicProgress.addEventListener("pointerdown", (event) => {
        musicProgress.setPointerCapture(event.pointerId);
        seekTo(progressFromPointer(event));
      });

      musicProgress.addEventListener("pointermove", (event) => {
        if (event.buttons === 1) {
          seekTo(progressFromPointer(event));
        }
      });

      musicProgress.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          event.preventDefault();
          seekTo(pausedProgress + (event.key === "ArrowRight" ? 0.025 : -0.025));
        }
        if (event.key === "Home") {
          event.preventDefault();
          seekTo(0);
        }
        if (event.key === "End") {
          event.preventDefault();
          seekTo(0.9999);
        }
      });

      sfxSeedInput.addEventListener("input", renderSfx);
      musicSeedInput.addEventListener("input", updateMusic);
      musicToneInput.addEventListener("input", updateMusic);
      musicBpmInput.addEventListener("input", updateMusic);
      musicVolumeInput.addEventListener("input", updateMusic);

      const sfxPreset = randomSfxPreset(`${Date.now()}:${Math.random()}`);
      const musicPreset = randomPreset(`${Date.now()}:${Math.random()}`);
      sfxSeedInput.value = sfxPreset.seed;
      selectedType = sfxPreset.type;
      musicSeedInput.value = musicPreset.seed;
      musicToneInput.value = musicPreset.tone;
      musicBpmInput.value = musicPreset.bpm;
      updateRangeFill(musicToneInput);
      updateRangeFill(musicBpmInput);
      updateRangeFill(musicVolumeInput);
      setProgress(0);
      render();
    </script>
  </body>
</html>
