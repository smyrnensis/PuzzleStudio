[package]
name = "puzzle-web-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
js-sys = "0.3"
puzzle-audio = { path = "../audio" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioParam",
    "AudioWorklet",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "BaseAudioContext",
    "Event",
    "GainNode",
    "MessageEvent",
    "MessagePort",
    "Window",
] }
