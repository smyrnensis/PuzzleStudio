[package]
name = "puzzle-wasm-player"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "puzzle_wasm_player"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["2d", "3d", "ui"] }
puzzle-bevy-player = { path = "../bevy_player" }
puzzle-game-runtime = { path = "../game_runtime", default-features = false }
puzzle-player-bootstrap = { path = "../player_bootstrap" }
puzzle-runtime-contract = { path = "../runtime_contract" }
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Node",
    "Storage",
    "Window",
    "console",
] }
