[package]
name = "puzzle-wasm-player"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "puzzle_wasm_player"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
source-runtime = ["puzzle-game-runtime/editor-debug"]

[dependencies]
puzzle-core = { path = "../core" }
puzzle-game-runtime = { path = "../game_runtime", default-features = false }
wasm-bindgen = "0.2"
