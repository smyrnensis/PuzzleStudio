[package]
name = "puzzle-wasm-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "puzzle_wasm_game"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
puzzle-assets = { path = "../assets" }
puzzle-audio = { path = "../audio" }
puzzle-game-runtime = { path = "../game_runtime", features = ["editor-debug"] }
puzzle-player-bootstrap = { path = "../player_bootstrap" }
puzzle-presentation = { path = "../presentation" }
puzzle-presentation-json = { path = "../presentation_json" }
puzzle-runtime-contract = { path = "../runtime_contract" }
puzzle-session-contract = { path = "../session_contract" }
serde_json = "1"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
puzzle-web-audio = { path = "../web_audio" }
wasm-bindgen-futures = "0.4"
