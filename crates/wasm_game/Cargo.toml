[package]
name = "puzzle-wasm-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "puzzle_wasm_game"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["2d", "3d", "ui"] }
puzzle-bevy-player = { path = "../bevy_player", features = ["editor-debug"] }
puzzle-editor-preview-contract = { path = "../editor_preview_contract" }
puzzle-lang = { path = "../lang" }
puzzle-player-bootstrap = { path = "../player_bootstrap" }
puzzle-presentation-json = { path = "../presentation_json" }
puzzle-runtime-contract = { path = "../runtime_contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
puzzle-authoring = { path = "../authoring" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "Window",
    "console",
] }
