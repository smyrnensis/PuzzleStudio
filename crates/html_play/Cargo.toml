[package]
name = "html-play"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["solver"]
solver = ["dep:puzzle-solver-runtime"]

[[bin]]
name = "html-play"
path = "src/main.rs"

[dependencies]
puzzle-core = { path = "../core" }
puzzle-game-runtime = { path = "../game_runtime", default-features = false, features = ["editor-debug"] }
puzzle-lang = { path = "../lang" }
puzzle-runtime-contract = { path = "../runtime_contract" }
puzzle-scene = { path = "../scene" }
puzzle-play = { path = "../play" }
puzzle-solver-runtime = { path = "../solver_runtime", optional = true }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
puzzle-workspace = { path = "../workspace" }
