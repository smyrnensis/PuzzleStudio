[package]
name = "html-play"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "html-play"
path = "src/main.rs"

[dependencies]
puzzle-assets = { path = "../assets" }
puzzle-core = { path = "../core" }
puzzle-game-runtime = { path = "../game_runtime", default-features = false, features = ["editor-debug"] }
puzzle-lang = { path = "../lang" }
puzzle-player-bootstrap = { path = "../player_bootstrap" }
puzzle-runtime-contract = { path = "../runtime_contract" }
puzzle-scene = { path = "../scene" }
puzzle-session-contract = { path = "../session_contract" }
puzzle-play = { path = "../play" }
puzzle-presentation = { path = "../presentation" }
puzzle-presentation-json = { path = "../presentation_json" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
puzzle-workspace = { path = "../workspace" }

[dev-dependencies]
puzzle-audio-contract = { path = "../audio_contract" }
