[package]
name = "html-play"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["solver"]
solver = ["dep:puzzle-solver"]

[[bin]]
name = "html-play"
path = "src/main.rs"

[dependencies]
puzzle-core = { path = "../core" }
puzzle-core-wasm = { package = "puzzle-wasm-core", path = "../wasm_core" }
puzzle-grid3d = { path = "../grid3d" }
puzzle-lang = { path = "../lang" }
puzzle-runtime-contract = { path = "../runtime_contract" }
puzzle-scene = { path = "../scene" }
puzzle-play = { path = "../play" }
puzzle-solver = { path = "../solver", optional = true }
serde_json = "1"
