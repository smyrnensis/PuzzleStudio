[package]
name = "html-play"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["solver"]
solver = ["dep:puzzle-solver"]

[[bin]]
name = "html-play"
path = "src/main.rs"

[dependencies]
puzzle-core = { path = "../core" }
puzzle3d-model = { path = "../puzzle3d_model" }
puzzle-lang = { path = "../lang" }
puzzle-play = { path = "../play" }
puzzle-solver = { path = "../solver", optional = true }
serde_json = "1"
