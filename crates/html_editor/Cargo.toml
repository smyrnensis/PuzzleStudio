[package]
name = "html-editor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = ["embedded-assets", "native-preview"]
embedded-assets = ["editor-docs", "native-preview"]
editor-docs = []
native-preview = ["dep:html-play"]

[[bin]]
name = "html-editor"
path = "src/main.rs"
required-features = ["embedded-assets"]

[dependencies]
html-play = { path = "../html_play", default-features = false, optional = true }
puzzle-authoring = { path = "../authoring" }
puzzle-lang = { path = "../lang" }
puzzle-workspace = { path = "../workspace" }
