[package]
name = "puzzlestudio"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
preview = ["dep:html-play"]
editor = ["dep:html-editor"]
export-html = ["dep:html-play"]
export-editor = ["dep:html-editor"]
screenshot = ["dep:html-play"]
adapters = ["preview", "editor", "export-html", "export-editor", "screenshot"]

[[bin]]
name = "puzzlestudio"
path = "src/main.rs"

[dependencies]
html-editor = { path = "../html_editor", optional = true }
html-play = { path = "../html_play", optional = true }
puzzle-agent-runtime = { path = "../agent_runtime" }
puzzle-lang = { path = "../lang" }
