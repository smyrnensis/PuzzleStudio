[package]
name = "puzzle-bevy-renderer"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["2d", "3d"] }
puzzle-assets = { path = "../assets" }
puzzle-runtime-contract = { path = "../runtime_contract" }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
puzzle-presentation = { path = "../presentation" }
