[package]
name = "puzzle-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "puzzle_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
html-play = { path = "../html_play" }
js-sys = "0.3"
puzzle-lang = { path = "../lang" }
puzzle-runtime-contract = { path = "../runtime_contract" }
puzzle-solver-runtime = { path = "../solver_runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
